<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark" style="color-scheme: light;"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Sistema Modular SST</title>

<!-- PWA: permite instalar/abrir este sistema como app no celular -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B1D1B">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SST/CIPA">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
  :root {
    --ink:#EDEAE0;
    --ink-dim:#A6A79C;
    --base:#1B1D1B;
    --panel:#232622;
    --panel-2:#2B2E29;
    --line:#3A3D37;
    --yellow:#F5B700;
    --yellow-ink:#1B1D1B;
    --green:#4E8B62;
    --amber:#E08E32;
    --red:#D6553D;
    --font-head:'Inter', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }

  [data-theme="light"] {
    --ink:#1C1E21;
    --ink-dim:#606770;
    --base:#F4F5F7;
    --panel:#FFFFFF;
    --panel-2:#EAECEE;
    --line:#DCDFE4;
    --yellow:#E5A100;
    --yellow-ink:#FFFFFF;
    --green:#2E7D32;
    --amber:#D97706;
    --red:#DC2626;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--base);
    color:var(--ink);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    transition: background 0.2s ease, color 0.2s ease;
  }

  #app { display: flex; flex-direction: column; min-height: 100vh; }
  
  header.top-header {
    background: var(--panel);
    border-bottom: 1px solid var(--line);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 20px;
    flex-shrink: 0;
    flex-wrap: wrap;
  }

  .brand {
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .brand h1 { font-family: var(--font-head); font-size: 15px; font-weight: 700; margin: 0; line-height: 1.2; }
  .brand p { margin: 0; font-size: 11px; color: var(--ink-dim); }

  .header-modules { 
    display: flex; 
    gap: 6px; 
    flex-wrap: wrap; 
    align-items: center;
    justify-content: center;
    flex: 1;
    overflow-x: auto;
    padding: 4px 0;
  }

  .header-btn {
    all: unset;
    cursor: pointer;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 6px;
    background: var(--panel-2);
    color: var(--ink-dim);
    border: 1px solid var(--line);
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
    transition: all 0.2s ease;
  }
  .header-btn:hover { color: var(--ink); border-color: var(--ink-dim); background: var(--base); }
  .header-btn.active {
    background: var(--yellow);
    color: var(--yellow-ink);
    border-color: var(--yellow);
  }
  .header-btn.disabled {
    opacity: 0.4;
    cursor: not-allowed;
    pointer-events: none;
    background: var(--base);
  }

  .header-user-section {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .user-badge {
    display: flex; 
    align-items: center; 
    gap: 8px; 
    font-size: 12px; 
    background: var(--panel-2);
    padding: 6px 12px; 
    border-radius: 6px; 
    border: 1px solid var(--line);
  }
  .user-badge strong { font-weight: 600; }

  .layout-body { display: flex; flex: 1; }

  .sidebar {
    width: 230px;
    flex-shrink: 0;
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    padding: 20px 0;
  }

  nav { display: flex; flex-direction: column; gap: 4px; padding: 0 10px; overflow-y: auto; }
  nav button {
    all: unset;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border-radius: 4px;
    font-size: 13px;
    color: var(--ink-dim);
    font-weight: 500;
  }
  nav button:hover { background: var(--panel-2); color: var(--ink); }
  nav button.active { background: var(--panel-2); color: var(--ink); font-weight: 600; border-left: 3px solid var(--yellow); }
  nav button.disabled {
    opacity: 0.4;
    cursor: not-allowed;
    pointer-events: none;
  }

  .theme-toggle-container { padding: 10px 10px 0 10px; margin-top: auto; }
  .btn-theme-toggle {
    width: 100%;
    background: var(--panel-2);
    color: var(--ink);
    border: 1px solid var(--line);
    padding: 8px 12px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
  }

  main { flex: 1; padding: 32px 40px; max-width: 1280px; }
  .page-head { margin-bottom: 24px; display: flex; justify-content: space-between; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
  .page-head h2 { font-family: var(--font-head); font-size: 24px; margin: 0 0 4px; font-weight: 700; }
  .page-head .sub { color: var(--ink-dim); font-size: 13px; }

  .btn {
    all: unset;
    cursor: pointer;
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 13px;
    padding: 9px 15px;
    background: var(--yellow);
    color: var(--yellow-ink);
    border-radius: 4px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn:hover { filter: brightness(1.08); }
  .btn.secondary { background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); }

  .hero {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 18px 20px;
    border-radius: 4px;
  }
  .stat-card .num { font-family: var(--font-head); font-size: 32px; font-weight: 700; }
  .stat-card .label { margin-top: 4px; font-size: 12px; color: var(--ink-dim); }


  /* ===== MATRIZ DE ACESSOS — ALINHAMENTO ===== */
  .permissions-wrap{overflow-x:auto;overflow-y:hidden;padding:0 0 5px;}
  .permissions-/* ===== GERENCIAMENTO DE USUÁRIOS ===== */
  .user-search-panel{margin-bottom:10px;}
  .user-search-row{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:10px;padding:10px 14px;}
  .user-search-field,.user-role-filter{margin:0;}
  .user-search-row input,.user-search-row select{margin:0;width:100%;}
  .role-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border-radius:6px;background:var(--panel-2);font-weight:700;font-size:10px;white-space:nowrap;}
  .role-administrador{background:#fff1cf;color:#8a5a00}.role-master{background:#f3e8ff;color:#6b21a8}.role-usuario{background:#e8f1ff;color:#1d4ed8}.role-cipa{background:#e9f8ef;color:#166534}
  .terminal-user-panel{border-left:3px solid var(--yellow);}
  .system-badge{font-size:10px;padding:4px 8px;border-radius:6px;background:var(--panel-2);color:var(--ink-dim);font-weight:600;}
  .terminal-user-card{display:grid;grid-template-columns:1.4fr .8fr 2fr auto;align-items:center;gap:12px;padding:12px 14px;}
  .system-note,.muted{color:var(--ink-dim);font-size:11px}.password-chip{background:var(--panel-2);padding:2px 6px;border-radius:4px;}
  .table-scroll{overflow-x:auto;}.users-admin-table{min-width:980px;}.users-admin-table th,.users-admin-table td{padding:8px 7px;vertical-align:middle;}.users-admin-table th{white-space:nowrap;}.user-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;}.danger-link{color:#a22;}.table-count{font-size:11px;color:var(--ink-dim);font-weight:600;}.users-empty{padding:18px;text-align:center;color:var(--ink-dim);}
  @media(max-width:900px){.user-search-row{grid-template-columns:1fr}.terminal-user-card{grid-template-columns:1fr 1fr}.user-actions{flex-direction:column;align-items:flex-start}}
  table{width:100%;min-width:930px;border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:10px;}
  .permissions-table th,.permissions-table td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:5px 4px;text-align:center;vertical-align:middle;}
  .permissions-table th:first-child,.permissions-table td:first-child{border-left:1px solid var(--line);text-align:left;width:245px;}
  .permissions-table thead th{background:var(--panel-2);font-weight:600;color:var(--ink);}
  .permissions-table .group-head{background:var(--base);font-family:var(--font-head);font-size:11px;padding:7px 4px;}
  .permissions-table .action-head{font-size:9px;line-height:1.15;color:var(--ink-dim);height:54px;padding:4px 2px;}
  .permissions-table .action-head label{display:flex;justify-content:center;align-items:center;gap:3px;margin-top:4px;font-weight:500;white-space:nowrap;font-size:9px;}
  .permissions-table .module-row td{background:var(--panel-2);font-weight:600;padding-top:6px;padding-bottom:6px;}
  .permissions-table .module-row td:first-child{font-size:11px;}
  .permissions-table .subitem-row td{background:var(--panel);font-size:10px;color:var(--ink-dim);height:42px;}
  .permissions-table .subitem-row td:first-child{padding-left:24px;line-height:1.2;}
  .permissions-table .subitem-note{font-size:9px;color:var(--ink-dim);margin-top:2px;}
  .permissions-table input[type=checkbox]{width:14px;height:14px;min-height:14px;margin:0;vertical-align:middle;accent-color:var(--yellow);}
  .permissions-table .role-separator{border-left:2px solid var(--line)!important;}
  .permissions-help{margin-bottom:10px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:var(--panel-2);font-size:10px;color:var(--ink-dim);}
  .permissions-userbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);margin-bottom:10px;}
  .permissions-userbar select{max-width:360px;margin:0;}
  .permissions-role-badge{padding:7px 12px;border-radius:7px;background:var(--panel-2);font-weight:700;font-size:10px;}

  /* ===== PAINEL DO PLANO ANUAL ===== */
  .annual-kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin:0 0 14px;}
  .annual-kpi{display:flex;align-items:center;gap:11px;min-width:0;padding:13px 14px;border:1px solid var(--line);border-radius:8px;background:var(--panel);box-shadow:0 1px 2px rgba(0,0,0,.03);}
  .annual-kpi-icon{width:42px;height:42px;flex:0 0 42px;display:flex;align-items:center;justify-content:center;border-radius:10px;font-size:20px;background:var(--panel-2);}
  .annual-kpi-icon.blue{background:#2563eb18}.annual-kpi-icon.green{background:#16a34a18}.annual-kpi-icon.amber{background:#d9770618}.annual-kpi-icon.purple{background:#7c3aed18}.annual-kpi-icon.red{background:#dc262618}
  .annual-kpi .num{font-family:var(--font-head);font-size:26px;font-weight:700;line-height:1;}
  .annual-kpi .label{margin-top:4px;font-size:11px;color:var(--ink-dim);line-height:1.2;}
  .annual-filter-panel{margin-bottom:14px;}
  .annual-filter-row{display:grid;grid-template-columns:minmax(220px,1.5fr) minmax(170px,1fr) 120px 180px;gap:10px;align-items:end;padding:14px 18px;}
  .annual-filter-row label{display:block;font-size:11px;font-weight:600;color:var(--ink-dim);margin-bottom:5px;}
  .annual-filter-row input,.annual-filter-row select{width:100%;}
  @media(max-width:1000px){.annual-kpis{grid-template-columns:repeat(3,minmax(0,1fr));}.annual-filter-row{grid-template-columns:1fr 1fr;}}
  @media(max-width:650px){.annual-kpis{grid-template-columns:repeat(2,minmax(0,1fr));}.annual-filter-row{grid-template-columns:1fr;}}

  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; margin-bottom: 20px; }
  .panel-head { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
  .panel-head h3 { font-family: var(--font-head); font-size: 15px; margin: 0; font-weight: 600; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    text-align: left;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink-dim);
    font-weight: 500;
    padding: 10px 18px;
    border-bottom: 1px solid var(--line);
  }
  td { padding: 12px 18px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: var(--panel-2); }

  .ca-tag {
    display: inline-flex;
    align-items: center;
    font-family: var(--font-mono);
    font-weight: 600;
    font-size: 11px;
    background: var(--yellow);
    color: var(--yellow-ink);
    padding: 2px 6px;
    border-radius: 3px;
  }

  .status-pill {
    display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 3px;
  }
  .status-pill.ok { background: #4E8B6222; color: var(--green); }
  .status-pill.warn { background: #E08E3222; color: var(--amber); }
  .status-pill.bad { background: #D6553D22; color: var(--red); }
  .status-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .empty { padding: 36px 20px; text-align: center; color: var(--ink-dim); font-size: 13px; }

  .vote-bar { flex:1; height:8px; background:var(--panel-2); border-radius:4px; overflow:hidden; min-width:60px; }
  .vote-bar-fill { height:100%; background:var(--yellow); border-radius:4px; }
  .ballot-option {
    all: unset; cursor: pointer; display:flex; align-items:center; gap:10px;
    width:100%; padding:12px 14px; border-radius:4px; background:var(--panel-2);
    border:1px solid var(--line); font-size:13px; font-weight:600; transition: all 0.15s ease;
  }
  .ballot-option:hover { border-color: var(--yellow); background: var(--base); }
  .ballot-option.branco { justify-content:center; color: var(--ink-dim); font-weight:500; }

  input, select, textarea {
    width: 100%;
    background: var(--base);
    border: 1px solid var(--line);
    color: var(--ink);
    padding: 9px 11px;
    font-family: var(--font-body);
    font-size: 13px;
    border-radius: 4px;
  }
  label { display: block; font-size: 12px; color: var(--ink-dim); margin-bottom: 4px; font-weight: 500; }
  .field { margin-bottom: 14px; }
  .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .modal-overlay {
    position: fixed; inset: 0; background: #0000008c;
    display: flex; align-items: center; justify-content: center; z-index: 50; padding: 20px;
  }
  .modal {
    background: var(--panel);
    border: 1px solid var(--line);
    border-top: 4px solid var(--yellow);
    border-radius: 4px;
    width: 100%; max-width: 620px;
    padding: 24px;
    max-height: 88vh; overflow: auto;
  }
  .modal h3 { font-family: var(--font-head); font-size: 18px; margin: 0 0 16px; font-weight: 600; }
  .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 18px; }

  .action-link { all: unset; cursor: pointer; color: var(--ink-dim); font-size: 12px; font-weight: 500; text-decoration: underline; }
  .action-link:hover { color: var(--ink); }
  .row-actions { display: flex; gap: 12px; justify-content: flex-end; }

  .search-combo { position: relative; }
  .search-combo-results {
    position: absolute; top: 100%; left: 0; right: 0; margin-top: 4px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 4px;
    max-height: 220px; overflow-y: auto; z-index: 60;
    box-shadow: 0 8px 20px rgba(0,0,0,0.25);
  }
  .search-combo-item { padding: 8px 10px; cursor: pointer; font-size: 12px; border-bottom: 1px solid var(--line); }
  .search-combo-item:last-child { border-bottom: none; }
  .search-combo-item:hover, .search-combo-item.active { background: var(--panel-2); }
  .search-combo-item .sc-title { font-weight: 600; color: var(--ink); }
  .search-combo-item .sc-sub { color: var(--ink-dim); font-size: 11px; margin-top: 2px; }
  .search-combo-empty { padding: 10px; font-size: 12px; color: var(--ink-dim); }
  .linked-ata-tag { display:inline-block; margin-top:4px; font-size: 11px; color: var(--ink-dim); }
  .linked-ata-tag strong { color: var(--ink); }

  .login-overlay {
    position: fixed; inset: 0; background: var(--base);
    display: flex; align-items: center; justify-content: center; z-index: 999; padding: 20px;
  }
  .login-card {
    background: var(--panel); border: 1px solid var(--line); border-top: 4px solid var(--yellow);
    border-radius: 6px; padding: 32px; width: 100%; max-width: 380px; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  }
  .login-card h2 { margin: 0 0 6px; font-family: var(--font-head); font-size: 20px; text-align: center; }
  .login-card p { margin: 0 0 20px; font-size: 12px; color: var(--ink-dim); text-align: center; }

  .urna-box { text-align:center; }
  .urna-display {
    font-family: var(--font-mono); font-size: 30px; letter-spacing: 10px; font-weight: 600;
    background: var(--base); border: 1px solid var(--line); border-radius: 6px;
    padding: 18px 10px; margin: 14px 0 6px; color: var(--yellow);
  }
  .urna-preview { font-size: 11px; color: var(--ink-dim); min-height: 14px; margin-bottom: 12px; }
  .urna-keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .urna-key {
    all: unset; cursor: pointer; text-align:center; padding: 14px 4px; border-radius: 6px;
    background: var(--panel-2); border: 1px solid var(--line); font-family: var(--font-mono);
    font-size: 18px; font-weight: 600; color: var(--ink);
  }
  .urna-key:hover { border-color: var(--yellow); }
  .urna-key.branco, .urna-key.corrige { font-family: var(--font-body); font-size: 11px; letter-spacing: 0.5px; }
  .urna-msg { min-height: 16px; font-size: 12px; color: var(--red); margin-top: 10px; font-weight: 600; }
  .urna-pending-box {
    display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    background: #E08E3222; border: 1px solid var(--amber); border-radius: 4px; padding: 12px 16px; margin: 0 0 16px;
    font-size: 12px;
  }


  /* ===== EXPERIÊNCIA MOBILE / RESPONSIVA ===== */
  html { -webkit-text-size-adjust: 100%; }
  button, input, select, textarea { -webkit-tap-highlight-color: transparent; }
  button, .btn, select, input[type="checkbox"] { touch-action: manipulation; }

  @media (max-width: 900px) {
    header.top-header {
      padding: 10px 14px;
      gap: 10px;
      align-items: stretch;
    }
    .brand { min-width: 180px; }
    .header-modules {
      order: 3;
      flex: 1 1 100%;
      justify-content: flex-start;
      flex-wrap: nowrap;
      overflow-x: auto;
      overflow-y: hidden;
      scrollbar-width: none;
      padding: 2px 0 4px;
      -webkit-overflow-scrolling: touch;
    }
    .header-modules::-webkit-scrollbar { display:none; }
    .header-btn { min-height: 42px; padding: 9px 12px; }
    .header-user-section { margin-left:auto; }
    .user-badge { min-height:42px; }

    .layout-body { display:block; }
    .sidebar {
      width:100%;
      border-right:0;
      border-bottom:1px solid var(--line);
      padding:8px 0;
    }
    nav {
      flex-direction:row;
      overflow-x:auto;
      overflow-y:hidden;
      flex-wrap:nowrap;
      padding:0 8px 4px;
      -webkit-overflow-scrolling:touch;
      scrollbar-width:none;
    }
    nav::-webkit-scrollbar { display:none; }
    nav button {
      flex:0 0 auto;
      min-height:44px;
      white-space:nowrap;
      padding:10px 12px;
    }
    .theme-toggle-container { margin-top:0; padding:6px 8px 2px; }
    .btn-theme-toggle { min-height:42px; }

    main {
      width:100%;
      max-width:none;
      padding:20px 14px 32px;
      overflow-x:hidden;
    }
    .page-head {
      align-items:stretch;
      margin-bottom:16px;
      gap:12px;
    }
    .page-head h2 { font-size:22px; line-height:1.2; }
    .page-head .sub { font-size:12px; line-height:1.45; }
    .page-head > .btn { width:100%; justify-content:center; min-height:46px; }

    .panel { margin-bottom:14px; border-radius:7px; }
    .panel-head { padding:12px 14px; gap:10px; flex-wrap:wrap; }
    .panel-head > div { max-width:100%; }

    .hero {
      grid-template-columns:repeat(2, minmax(0,1fr));
      gap:10px;
      padding-left:10px !important;
      padding-right:10px !important;
    }
    .stat-card { padding:14px; min-width:0; }
    .stat-card .num { font-size:28px; }
    .stat-card .label { font-size:11px; }

  function getAvailableModules(user) {
    if (!user) return [];
    if (user.role === "Administrador") return ALL_MODULES.map(m => m.id);
    if (user.role === "Master") {
      const allowed = state.modulePermissions?.master;
      return Array.isArray(allowed) ? allowed : ALL_MODULES.map(m => m.id);
    }
    if (user.role === "Usuario") {
      const specific = state.userSpecificPermissions?.[user.id];
      const masterAllowed = state.modulePermissions?.master || ALL_MODULES.map(m => m.id);
      const defaultUser = state.modulePermissions?.usuario || ["trainings", "epi"];
      
      const allowedMods = specific && Array.isArray(specific.modules) ? specific.modules : defaultUser;
      return allowedMods.filter(m => masterAllowed.includes(m));
    }
    return [];
  }

  function getAvailableTabs(user, modId) {
    if (!user) return [];
    if (user.role === "Administrador" || user.role === "Master") {
      return (MODULE_TABS[modId] || []).map(t => t.id);
    }
    if (user.role === "Usuario") {
      const specific = state.userSpecificPermissions?.[user.id];
      const allTabsForMod = (MODULE_TABS[modId] || []).map(t => t.id);
      
      if (specific && specific.tabs && Array.isArray(specific.tabs[modId])) {
        return specific.tabs[modId];
      }
      return allTabsForMod;
    }
    return [];
  }

  function checkPermission(requiredRole) {
    if(!currentUser) return false;
    if(currentUser.role === "Administrador") return true;
    if(currentUser.role === "Master") {
      if(requiredRole === "Master" || requiredRole === "Usuario") return true;
      return false;
    }
    if(currentUser.role === "Usuario") {
      if(requiredRole === "Usuario") return true;
      // Na matriz por usuário, Cadastrar/Incluir e Editar liberam os controles
      // normalmente reservados ao Master; Excluir é controlado separadamente.
      if(requiredRole === "Master") return canSubitemAction(currentTab, "create", currentUser) || canSubitemAction(currentTab, "edit", currentUser);
      if(requiredRole === "Administrador") return canSubitemAction(currentTab, "delete", currentUser);
    }
    return false;
  }

  function handleLogin(e) {
    e.preventDefault();
    const userInp = document.getElementById("login-username").value.trim().toLowerCase();
    const passInp = document.getElementById("login-password").value;
    const errDiv = document.getElementById("login-error");

    const usersList = state.usersDb || [];
    const found = usersList.find(u => u.username.toLowerCase() === userInp && u.pass === passInp);

    if(found) {
      if(found.trialExpires) {
        const today = new Date().toISOString().slice(0, 10);
        if(today > found.trialExpires) {
          errDiv.style.display = "block";
          errDiv.innerText = "Acesso negado: O seu período de teste expirou em " + fmtDate(found.trialExpires) + ". Contate o administrador.";
          return;
        }
      }

      currentUser = { 
        id: found.id, 
        username: found.username, 
        role: found.role, 
        name: found.name, 
        trialExpires: found.trialExpires,
        mustChangePassword: found.mustChangePassword || false,
        employeeId: found.employeeId || null
      };
      sessionStorage.setItem(SESSION_KEY, JSON.stringify(currentUser));
      
      const available = getAvailableModules(currentUser);
      if(!available.includes(currentModule)) {
        currentModule = available[0] || "geral";
      }
      const tabs = getAvailableTabs(currentUser, currentModule);
      if(!tabs.includes(currentTab)) {
        currentTab = tabs[0] || (MODULE_TABS[currentModule]?.[0]?.id ?? '');
      }

      render();
    } else {
      errDiv.style.display = "block";
      errDiv.innerText = "Usuário ou senha incorretos!";
    }
  }

      state.modulePermissions.master.push("cipa");
    }
    if(Array.isArray(state.modulePermissions.master) && !state.modulePermissions.master.includes("terceiros")) {
      state.modulePermissions.master.push("terceiros");
    }
  }

  // Capacidade "artifact" (publicação): permite que a página guarde seus
  // próprios dados republicando-se a cada alteração, para que qualquer pessoa
  // com o link (ex: eleitor votando pelo celular) compartilhe o mesmo estado.
  // Retorna null quando a página ainda não foi publicada (ex: preview do chat)
  // ou quando executada localmente fora do claude.ai — nesses casos o sistema
  // usa o fallback window.storage abaixo, sem quebrar o funcionamento.
  async function getArtifactCapability(){
    try{
      if(window.claude && typeof window.claude.use === "function"){
        return await window.claude.use("artifact");
      }
    }catch(e){}
    return null;
  }

  async function loadState(){
    try{
      let parsed = null;

      // 1) Firestore: fonte principal de dados. É de onde o sistema lê ao
      // abrir, tanto no computador quanto em qualquer outro dispositivo/
      // navegador que acesse este mesmo arquivo com a mesma firebaseConfig.
      try{
        if(window.firestoreGetDoc){
          const snap = await window.firestoreGetDoc();
          if(snap && snap.exists && snap.exists()){
            const data = snap.data();
            if(data && data.json) parsed = JSON.parse(data.json);
          }
        }
      }catch(e){ console.error("Falha ao carregar do Firestore:", e); }

      // 2) Estado embutido na própria página (usado só como semente inicial,
      // caso o Firestore ainda esteja vazio na primeira execução).
      if(!parsed){
        const stateEl = document.getElementById("__STATE__");
        const raw = stateEl ? stateEl.textContent.trim() : "";
        if(raw && raw !== "{}"){
          try{ parsed = JSON.parse(raw); }catch(e){ parsed = null; }
        }
      }

      // 3) Fallback extra: armazenamento do preview do Claude, caso esteja
      // rodando ali e o Firestore não tenha respondido por algum motivo.
      if(!parsed){
        try{
          const res = await window.storage.get(STORAGE_KEY, true);
          if(res && res.value) parsed = JSON.parse(res.value);
        }catch(e){}
      }

      if(parsed){
        state = Object.assign(Object.assign({}, DEFAULT_STATE_SHAPE), parsed);
        applyStateMigrations();
      } else {
        seedIfEmpty();
      }
      await saveState(); // garante que o Firestore fique com o dado carregado/semeado
    }catch(e){ seedIfEmpty(); }
    (state.cipaElections || []).forEach(ensureElectionVotingFields);
    loaded = true;
    render();
  }

  function ensureElectionVotingFields(el){
    if(!Array.isArray(el.candidatos)) el.candidatos = [];
    if(!Array.isArray(el.votantes)) el.votantes = [];
    if(!el.urnaStatus) el.urnaStatus = "Fechada";
    if(el.vagasTitulares == null) el.vagasTitulares = 3;
    if(el.vagasSuplentes == null) el.vagasSuplentes = 3;
    if(el.votosBrancos == null) el.votosBrancos = 0;
    if(el.votoPendente === undefined) el.votoPendente = null;
    return el;
  }

  function userByEmployeeId(employeeId){

  // estes só podem votar através do terminal físico "Terminal de Votação CIPA".
  function employeesWithoutUser(){

  function stopCipaPoll(){
    if(cipaPollInterval){ clearInterval(cipaPollInterval); cipaPollInterval = null; }
  }

  // Verifica periodicamente (via window.storage) se o estado da urna mudou em
  // outro dispositivo/terminal. Em uma página publicada (capacidade "artifact"),
  // isso normalmente nem é necessário — a plataforma já recarrega todas as
  // visualizações abertas assim que alguém publica uma nova versão — mas o
  // polling é mantido como reforço, e falha silenciosamente onde não se aplica.
  function startCipaPoll(onChange){
    stopCipaPoll();
    cipaPollInterval = setInterval(async () => {
      try{
        if(window.firestoreGetDoc){
          const snap = await window.firestoreGetDoc();
          if(snap && snap.exists && snap.exists()){
            const data = snap.data();
            if(data && data.json){
              const fresh = JSON.parse(data.json);
              if(fresh.cipaElections) state.cipaElections = fresh.cipaElections;
              (state.cipaElections || []).forEach(ensureElectionVotingFields);
              onChange();
            }
          }
          return;
        }
        const res = await window.storage.get(STORAGE_KEY, true);
        if(res && res.value){
          const fresh = JSON.parse(res.value);
          if(fresh.cipaElections) state.cipaElections = fresh.cipaElections;
          (state.cipaElections || []).forEach(ensureElectionVotingFields);
          onChange();
        }
      }catch(e){}
    }, 4000);
  }

  // Salva o estado atual no Firestore (fonte principal de dados agora que o
  // sistema roda fora do claude.ai, com o banco criado no projeto Firebase).
  // Qualquer computador/navegador que abra este mesmo arquivo, com a mesma
  // firebaseConfig, lê e grava neste mesmo documento — os dados ficam
  // centralizados e compartilhados. Mantém alternativas antigas como
  // segurança extra, caso o Firestore falhe (ex: sem internet no momento).
  // Retorna true/false conforme o salvamento teve sucesso.
  async function saveState(){
    let savedToFirestore = false;
    try{
      if(window.firestoreSetDoc){
        await window.firestoreSetDoc(JSON.stringify(state));
        savedToFirestore = true;
      }
    }catch(e){ console.error("Falha ao salvar no Firestore:", e); }

    const art = await getArtifactCapability();
    if(art){
      try{
        const docClone = document.documentElement.cloneNode(true);
        docClone.querySelectorAll(".modal-overlay").forEach(o => o.remove());
        const appDivClone = docClone.querySelector("#app");
        if(appDivClone) appDivClone.innerHTML = "";
        const stateScript = docClone.querySelector("#__STATE__");
        if(stateScript) stateScript.textContent = JSON.stringify(state);
        const html = "<!DOCTYPE html>\n" + docClone.outerHTML;
        await art.publish(html);
        return true;
      }catch(e){ console.error("Falha ao publicar estado:", e); }
    }

    if(savedToFirestore) return true;

    try{
      await window.storage.set(STORAGE_KEY, JSON.stringify(state), true);
      return true;
    }catch(e){ return false; }
  }

  function fmtDate(d){
    if(!d) return "—";
    const dt = new Date(d + "T00:00:00");
    return dt.toLocaleDateString("pt-BR");
  }

  function fmtDateTime(iso){
    if(!iso) return "—";
    const dt = new Date(iso);
    return dt.toLocaleString("pt-BR", { day:"2-digit", month:"2-digit", year:"numeric", hour:"2-digit", minute:"2-digit" });
  }

  function cipaVerificationCode(str){
    let hash = 0;
    for(let i=0; i<str.length; i++){ hash = ((hash << 5) - hash) + str.charCodeAt(i); hash |= 0; }
    return Math.abs(hash).toString(36).toUpperCase().padStart(8,'0').slice(0,8);
  }

  function addMonths(dateStr, months){
    const dt = new Date(dateStr + "T00:00:00");
    dt.setMonth(dt.getMonth() + Number(months));
    return dt.toISOString().slice(0,10);
  }

  function addDays(dateStr, days){
    const dt = new Date(dateStr + "T00:00:00");
    dt.setDate(dt.getDate() + Number(days));
    return dt.toISOString().slice(0,10);
  }

  function daysUntil(dateStr){
    if(!dateStr) return 999;
    const today = new Date(); today.setHours(0,0,0,0);
    const target = new Date(dateStr + "T00:00:00");
    return Math.round((target - today) / DAY);
  }

  // Verifica se a data atual está dentro do período de inscrições definido no
  // Processo Eleitoral, período em que novos candidatos podem ser cadastrados.
  function dentroPeriodoInscricao(el){
    if(!el || !el.dataInscricaoInicio || !el.dataInscricaoFim) return false;
    const hoje = new Date().toISOString().slice(0,10);
    return hoje >= el.dataInscricaoInicio && hoje <= el.dataInscricaoFim;
  }

  function trainingStatus(t){
    const dleft = daysUntil(t.dataVencimento);
    return dleft < 0 ? "bad" : dleft <= 30 ? "warn" : "ok";
  }

  function deliveryStatus(d){
    const dleft = daysUntil(d.dataValidade);
    return dleft < 0 ? "bad" : dleft <= 30 ? "warn" : "ok";
  }

  function pcmsoStatus(p){
    const dleft = daysUntil(p.dataVencimento);
    return dleft < 0 ? "bad" : dleft <= 30 ? "warn" : "ok";
  }

  function fireStatus(eq){
    const minDays = Math.min(daysUntil(eq.vencimentoCarga), daysUntil(eq.vencimentoHidro));
    return minDays < 0 ? "bad" : minDays <= 30 ? "warn" : "ok";
  }

  function getNextInspectionDate(eq){
    if(!eq.ultimaInspecao) return eq.dataCarga || new Date().toISOString().slice(0,10);
    return addMonths(eq.ultimaInspecao, eq.periodicidadeInspMeses || 1);
  }

  function inspectionStatus(eq){
    const nextDate = getNextInspectionDate(eq);
    const dleft = daysUntil(nextDate);
    if(dleft < 0) return "bad";
    if(dleft <= 7) return "warn";
    return "ok";
  }

  function cipaMandateStatus(m){
    const dleft = daysUntil(m.mandatoFim);
    return dleft < 0 ? "bad" : dleft <= 60 ? "warn" : "ok";
  }

  function cipaActionStatus(a){
    if(a.status === "Concluída") return "ok";
    const dleft = daysUntil(a.prazo);
    return dleft < 0 ? "bad" : dleft <= 15 ? "warn" : "ok";
  }

  function cipaMemberById(id){ return state.cipaMembers.find(x=>x.id===id); }

  function tercEmpresaById(id){ return state.tercEmpresas.find(x=>x.id===id); }
  function tercEmpresaNome(id){ return tercEmpresaById(id)?.razaoSocial || "—"; }

  // Situação do contrato de uma empresa terceirizada: encerrado manualmente,
  // vencido/vencendo pela data de fim de contrato, ou vigente.
  function tercContratoStatus(e){
    if(e.status === "Encerrado") return "bad";
    if(!e.dataFimContrato) return "ok";
    const dleft = daysUntil(e.dataFimContrato);
    return dleft < 0 ? "bad" : dleft <= 60 ? "warn" : "ok";
  }

  // Situação de um trabalhador terceiro (vigência de atividade na planta).
  function tercFuncionarioStatus(f){
    if(f.status === "Inativo") return "bad";
    if(!f.dataFimAtividade) return "ok";
    const dleft = daysUntil(f.dataFimAtividade);
    return dleft < 0 ? "bad" : dleft <= 30 ? "warn" : "ok";
  }

  // Situação de um documento obrigatório da empresa terceirizada (contrato,
  // CND, apólices, ordens de serviço etc.) com base na data de vencimento.
  function tercDocStatus(d){
    if(!d.dataVencimento) return "ok";
    const dleft = daysUntil(d.dataVencimento);
    return dleft < 0 ? "bad" : dleft <= 30 ? "warn" : "ok";
  }

  // Membros vigentes da comissão atual (composição em mandato).
  function activeCipaMembers(){ return state.cipaMembers.filter(m => m.ativo !== false); }

  // Membros de comissões anteriores (histórico), agrupados por gestão/eleição.
  function historicoCipaMembers(){ return state.cipaMembers.filter(m => m.ativo === false); }

  // Ao encerrar a urna, apura o resultado e atualiza automaticamente a composição
  // da Comissão (subitem "Membros da Comissão"), preservando as gestões anteriores
  // como histórico (ativo:false) em vez de sobrescrevê-las.
  function applyCipaElectionResults(el){
    const ranking = (el.candidatos || []).slice().sort((a,b)=>(b.votos||0)-(a.votos||0));
    const vagasTitulares = el.vagasTitulares || 0;
    const vagasSuplentes = el.vagasSuplentes || 0;
    const titulares = ranking.slice(0, vagasTitulares);
    const suplentes = ranking.slice(vagasTitulares, vagasTitulares + vagasSuplentes);

    if(titulares.length === 0 && suplentes.length === 0) return;

    // Arquiva a composição anterior como histórico, sem apagar os registros.
    state.cipaMembers.forEach(m => { if(m.ativo !== false) m.ativo = false; });

    const mandatoInicio = el.dataPosse || new Date().toISOString().slice(0,10);
    const mandatoFim = addMonths(mandatoInicio, 12);

    const presidenteCand = titulares.find(c => c.representacao === "Empregador") || titulares[0];
    const vicePresidenteCand = titulares.find(c => c.representacao === "Empregado" && c !== presidenteCand);

    titulares.forEach(c => {
      let funcao = "Membro";
      if(c === presidenteCand) funcao = "Presidente";
      else if(c === vicePresidenteCand) funcao = "Vice-Presidente";
      state.cipaMembers.push({
        id: uid("cipam"),
        employeeId: c.employeeId,
        representacao: c.representacao,
        tipo: "Titular",
        funcaoComissao: funcao,
        mandatoInicio, mandatoFim,
        ativo: true,
        gestao: el.gestao,
        eleicaoId: el.id
      });
    });

    suplentes.forEach(c => {
      state.cipaMembers.push({
        id: uid("cipam"),
        employeeId: c.employeeId,
        representacao: c.representacao,
        tipo: "Suplente",
        funcaoComissao: "Membro",
        mandatoInicio, mandatoFim,
        ativo: true,
        gestao: el.gestao,
        eleicaoId: el.id
      });
    });
  }

  function calcRiskScore(sev, prob){
    const score = Number(sev) * Number(prob);
    if(score >= 12) return { score, label: "Alto", class: "bad" };
    if(score >= 6) return { score, label: "Médio", class: "warn" };
    return { score, label: "Baixo", class: "ok" };
  }

  const MODULE_ACTIONS = [
    { id: "create", label: "Cadastrar / Incluir" },
    { id: "edit", label: "Editar" },
    { id: "delete", label: "Excluir" }
  ];

  function getRoleActionPermissions(role){
    if(!state.roleActionPermissions) state.roleActionPermissions = {};
    if(!state.roleActionPermissions[role]) state.roleActionPermissions[role] = {};
    ALL_MODULES.forEach(mod => {
      if(!state.roleActionPermissions[role][mod.id]) {
        // Compatibilidade: Master começa com todas as ações; Usuário começa sem ações
        // explícitas, preservando o comportamento das versões anteriores.
        state.roleActionPermissions[role][mod.id] = role === "Master"
          ? { create:true, edit:true, delete:true }
          : { create:false, edit:false, delete:false };
      } else {
        MODULE_ACTIONS.forEach(a => {
          if(typeof state.roleActionPermissions[role][mod.id][a.id] !== "boolean") {
            state.roleActionPermissions[role][mod.id][a.id] = false;
          }
        });
      }
    });
    return state.roleActionPermissions[role];
  }

  function canModuleAction(moduleId, action, role = currentUser?.role){
    if(!role) return false;
    if(role === "Administrador") return true;
    const perms = getRoleActionPermissions(role);
    return !!(perms[moduleId] && perms[moduleId][action]);
  }

  function getSubitemActionPermissions(role, tabId, selectedUserId = null){
    if(!state.roleSubitemPermissions) state.roleSubitemPermissions = {};
    if(!state.roleSubitemPermissions[role]) state.roleSubitemPermissions[role] = {};
    if(role === "Master"){
      if(!state.roleSubitemPermissions.Master[tabId]){
        state.roleSubitemPermissions.Master[tabId] = {access:true, create:true, edit:true, delete:true};
      } else {
        ["access","create","edit","delete"].forEach(k=>{
          if(typeof state.roleSubitemPermissions.Master[tabId][k] !== "boolean") state.roleSubitemPermissions.Master[tabId][k] = true;
        });
      }
      return state.roleSubitemPermissions.Master[tabId];
    }

    if(!selectedUserId) return {access:false, create:false, edit:false, delete:false};
    if(!state.userSpecificPermissions) state.userSpecificPermissions = {};
    const userPerm = state.userSpecificPermissions[selectedUserId] || {};
    if(!userPerm.actions) userPerm.actions = {};
    if(!userPerm.actions[tabId]){
      // Compatibilidade: quando o usuário ainda não tem permissões por subitem,
      // aproveita as permissões antigas definidas por módulo.
      const mod = ALL_MODULES.find(m => (MODULE_TABS[m.id] || []).some(t => t.id === tabId));
      const old = mod ? (getRoleActionPermissions("Usuario")[mod.id] || {}) : {};
      userPerm.actions[tabId] = {
        access: Array.isArray(userPerm.tabs?.[mod?.id]) ? userPerm.tabs[mod.id].includes(tabId) : !!(userPerm.modules || []).includes(mod?.id),
        create: !!old.create,
        edit: !!old.edit,
        delete: !!old.delete
      };
    }
    ["access","create","edit","delete"].forEach(k=>{
      if(typeof userPerm.actions[tabId][k] !== "boolean") userPerm.actions[tabId][k] = false;
    });
    state.userSpecificPermissions[selectedUserId] = userPerm;
    return userPerm.actions[tabId];
  }

  function canSubitemAction(tabId, action, user = currentUser){
    if(!user) return false;
    if(user.role === "Administrador") return true;
    if(user.role === "Master") return !!getSubitemActionPermissions("Master", tabId)[action];
    if(user.role === "Usuario") return !!getSubitemActionPermissions("Usuario", tabId, user.id)[action];
    return false;
  }

  function renderAdminPermissions(root){
    const isMasterUser = currentUser.role === "Master";
    const isAdmin = currentUser.role === "Administrador";

    const targetUsers = (state.usersDb || []).filter(u => {
      if(u.role !== "Usuario") return false;
      if(isMasterUser && DEFAULT_ADMIN_USERNAMES.includes((u.username||'').toLowerCase())) return false;
      return true;
    });

    if(selectedPermissionRole === "Master" && !isAdmin && !isMasterUser) selectedPermissionRole = "Usuario";
    if(selectedPermissionRole === "Usuario" && targetUsers.length && (!selectedTargetUserId || !targetUsers.some(u=>u.id===selectedTargetUserId))) selectedTargetUserId = targetUsers[0].id;
    const selectedUser = targetUsers.find(u => u.id === selectedTargetUserId) || targetUsers[0];

    const masterAllowed = state.modulePermissions?.master || ALL_MODULES.map(m => m.id);
    const accessibleModulesForConfig = isAdmin ? ALL_MODULES : ALL_MODULES.filter(m => masterAllowed.includes(m.id));
    const configuringMaster = selectedPermissionRole === "Master";
    const configuringUser = selectedPermissionRole === "Usuario";

    const actionCheckbox = (role, tabId, action, checked, disabled=false) => `
      <input type="checkbox" class="permission-subitem-action" data-role="${role}" data-tab="${tabId}" data-action="${action}"
        ${checked ? 'checked' : ''} ${disabled ? 'disabled' : ''} aria-label="${action}"
        style="width:14px;height:14px;cursor:${disabled?'not-allowed':'pointer'};accent-color:var(--amber);">
    `;

    const getModuleAccess = (role, mod, userId) => {
      const tabs = MODULE_TABS[mod.id] || [];
      if(role === "Master") return tabs.length ? tabs.every(t => !!getSubitemActionPermissions("Master", t.id).access) : masterAllowed.includes(mod.id);
      return tabs.length ? tabs.every(t => !!getSubitemActionPermissions("Usuario", t.id, userId).access) : false;
    };

    root.innerHTML = `
      <div class="page-head">
        <div>
          <h2>🔐 ${isMasterUser ? 'Master · Matriz de Acessos' : 'Administração · Matriz de Acessos'}</h2>
          <div class="sub">Defina, por nível e por subitem, as permissões de acesso, cadastro, edição e exclusão.</div>
        </div>
      </div>

      <div class="panel" style="padding:10px 12px;">
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
          ${isAdmin ? `<div style="display:flex;gap:6px;align-items:center;"><strong style="font-size:12px;">Nível:</strong>
            <button type="button" id="perm-role-user" class="btn ${configuringUser?'':'secondary'}" style="padding:7px 11px;">👤 Usuário</button>
            <button type="button" id="perm-role-master" class="btn ${configuringMaster?'':'secondary'}" style="padding:7px 11px;">👑 Master</button>
          </div>` : `<span class="permissions-role-badge">👑 Nível configurado: Master</span>`}
          ${configuringUser ? `
            <label style="margin:0;font-weight:700;font-size:12px;">👤 Funcionário / Usuário:</label>
            <select id="select-target-user" style="min-width:300px;flex:1;max-width:520px;">
              ${targetUsers.map(u => `<option value="${u.id}" ${u.id===selectedTargetUserId?'selected':''}>${u.name}${u.employeeId ? ' · Funcionário vinculado' : ''} (${u.username})</option>`).join('')}
            </select>
            <span style="font-size:10px;color:var(--ink-dim);">As permissões abaixo valem somente para o usuário selecionado.</span>
          ` : `<span style="font-size:10px;color:var(--ink-dim);">As permissões abaixo valem para o nível Master.</span>`}
        </div>
      </div>

      ${configuringUser && targetUsers.length === 0 ? `<div class="panel"><div class="empty">Nenhum usuário com perfil "Usuario" disponível para configurar.</div></div>` : `
      <div class="panel" style="padding:10px 12px;">
        <div class="permissions-help" style="margin-bottom:8px;"><strong>Como funciona:</strong> cada subitem tem quatro permissões independentes: <b>Acesso</b>, <b>Cadastrar/Incluir</b>, <b>Editar</b> e <b>Excluir</b>. O campo <b>Todos</b> aplica a ação a todos os subitens.</div>
        <form id="permissions-form">
          <div class="permissions-wrap">
            <table class="permissions-table" style="table-layout:fixed;width:100%;font-size:11px;">
              <colgroup>
                <col style="width:38%;">
                <col style="width:15.5%;"><col style="width:15.5%;"><col style="width:15.5%;"><col style="width:15.5%;">
              </colgroup>
              <thead>
                <tr>
                  <th rowspan="2" class="group-head" style="text-align:left;padding:7px 8px;">Módulo e Subitens<br><span style="font-size:9px;color:var(--ink-dim);font-weight:500;">Permissões individuais</span></th>
                  <th colspan="4" class="group-head role-separator">${configuringMaster ? 'Nível Master' : 'Usuário selecionado'}</th>
                </tr>
                <tr>
                  ${['access','create','edit','delete'].map((action,i)=>{
                    const label={access:'Acesso',create:'Cadastrar / Incluir',edit:'Editar',delete:'Excluir'}[action];
                    return `<th class="action-head ${i===0?'role-separator':''}" style="padding:5px 3px;white-space:nowrap;">${label}<label style="display:flex;justify-content:center;align-items:center;gap:3px;font-size:9px;margin-top:3px;"><input type="checkbox" class="select-all-subitem" data-role="${configuringMaster?'Master':'Usuario'}" data-action="${action}" style="width:13px;height:13px;"> Todos</label></th>`;
                  }).join('')}
                </tr>
              </thead>
              <tbody>
                ${accessibleModulesForConfig.map(mod => {
                  const tabs = MODULE_TABS[mod.id] || [];
                  const role = configuringMaster ? 'Master' : 'Usuario';
                  const moduleAccess = getModuleAccess(role, mod, selectedUser?.id);
                  const disabled = configuringMaster ? false : !selectedUser;
                  return `
                    <tr class="module-row">
                      <td style="padding:7px 8px;"><strong>${mod.name}</strong><div class="subitem-note">Marque o acesso do módulo para selecionar o acesso de todos os subitens.</div></td>
                      <td colspan="4" style="padding:7px 3px;text-align:center;">

                      </td>
                    </tr>
                    ${tabs.map(tab => {
                      const pp = getSubitemActionPermissions(role, tab.id, selectedUser?.id);
                      return `
                        <tr class="subitem-row" data-module="${mod.id}" data-tab="${tab.id}">
                          <td style="padding:5px 8px 5px 18px;"><strong style="font-size:11px;">↳ ${tab.name}</strong><div class="subitem-note">Permissões independentes deste subitem</div></td>
                          ${['access','create','edit','delete'].map((action,i)=>`<td class="${i===0?'role-separator':''}" style="text-align:center;padding:5px 2px;">${actionCheckbox(role,tab.id,action,!!pp[action],disabled)}</td>`).join('')}

          <div style="margin-top:10px;display:flex;justify-content:flex-end;gap:8px;">

    root.querySelector('#perm-role-user')?.addEventListener('click',()=>{ selectedPermissionRole='Usuario'; renderContent(); });
    root.querySelector('#perm-role-master')?.addEventListener('click',()=>{ selectedPermissionRole='Master'; renderContent(); });
    root.querySelector('#select-target-user')?.addEventListener('change', e => { selectedTargetUserId = e.target.value; renderContent(); });

    root.querySelectorAll('.select-all-subitem').forEach(toggle => {
      toggle.addEventListener('change', () => {
        const role = toggle.dataset.role, action = toggle.dataset.action;
        root.querySelectorAll(`.permission-subitem-action[data-role="${role}"][data-action="${action}"]:not(:disabled)`).forEach(cb => cb.checked = toggle.checked);
        syncPermissionHeaders();
      });
    });
    root.querySelectorAll('.permission-module-access').forEach(toggle => {
      toggle.addEventListener('change', () => {
        const role=toggle.dataset.role, modId=toggle.dataset.module;
        root.querySelectorAll(`.subitem-row[data-module="${modId}"] .permission-subitem-action[data-role="${role}"][data-action="access"]:not(:disabled)`).forEach(cb=>cb.checked=toggle.checked);
        syncPermissionHeaders();
      });
    });
    const syncPermissionHeaders = () => {
      root.querySelectorAll('.select-all-subitem').forEach(toggle => {
        const boxes=[...root.querySelectorAll(`.permission-subitem-action[data-role="${toggle.dataset.role}"][data-action="${toggle.dataset.action}"]:not(:disabled)`)];
        toggle.checked=boxes.length>0 && boxes.every(cb=>cb.checked);
        toggle.indeterminate=boxes.some(cb=>cb.checked)&&!toggle.checked;
      });
      root.querySelectorAll('.permission-module-access').forEach(toggle=>{
        const boxes=[...root.querySelectorAll(`.subitem-row[data-module="${toggle.dataset.module}"] .permission-subitem-action[data-role="${toggle.dataset.role}"][data-action="access"]:not(:disabled)`)];
        if(boxes.length){ toggle.checked=boxes.every(cb=>cb.checked); toggle.indeterminate=boxes.some(cb=>cb.checked)&&!toggle.checked; }
      });
    };
    root.querySelectorAll('.permission-subitem-action').forEach(cb=>cb.addEventListener('change',syncPermissionHeaders));
    syncPermissionHeaders();

    const form=root.querySelector('#permissions-form');
    if(form){
      form.addEventListener('submit', async e=>{
        e.preventDefault();
        const role=configuringMaster?'Master':'Usuario';
        if(role==='Usuario'){
          if(!selectedUser) return;
          if(!state.userSpecificPermissions) state.userSpecificPermissions={};
          if(!state.userSpecificPermissions[selectedUser.id]) state.userSpecificPermissions[selectedUser.id]={modules:[],tabs:{},actions:{}};
          const target=state.userSpecificPermissions[selectedUser.id];
          if(!target.tabs) target.tabs={};
          if(!target.actions) target.actions={};
          accessibleModulesForConfig.forEach(mod=>{
            const tabs=MODULE_TABS[mod.id]||[];
            target.tabs[mod.id]=[];
            tabs.forEach(tab=>{
              const vals={};
              ['access','create','edit','delete'].forEach(action=>{
                const cb=form.querySelector(`.permission-subitem-action[data-role="Usuario"][data-tab="${tab.id}"][data-action="${action}"]`);
                vals[action]=!!cb?.checked;
              });
              target.actions[tab.id]=vals;
              if(vals.access) target.tabs[mod.id].push(tab.id);
            });
          });
          target.modules=accessibleModulesForConfig.filter(mod=>(target.tabs[mod.id]||[]).length>0).map(mod=>mod.id);
          await saveState();
          alert(`Permissões de ${selectedUser.name} atualizadas com sucesso!`);
        }else{
          if(!state.roleSubitemPermissions) state.roleSubitemPermissions={Master:{}};
          if(!state.roleSubitemPermissions.Master) state.roleSubitemPermissions.Master={};
          accessibleModulesForConfig.forEach(mod=>{
            (MODULE_TABS[mod.id]||[]).forEach(tab=>{
              const vals={};
              ['access','create','edit','delete'].forEach(action=>{
                const cb=form.querySelector(`.permission-subitem-action[data-role="Master"][data-tab="${tab.id}"][data-action="${action}"]`);
                vals[action]=!!cb?.checked;
              });
              state.roleSubitemPermissions.Master[tab.id]=vals;
            });
          });
          await saveState();
          alert('Permissões do nível Master atualizadas com sucesso!');
        }
        render();
      });
    }
  }

      if(!d) return false;
      const end = p.dataFim || (Array.isArray(p.datasRealizacao) && p.datasRealizacao.filter(Boolean).sort().slice(-1)[0]) || d;

  function getAnnualPlanDates(plan){
    if(!plan) return [];
    if(Array.isArray(plan.datasRealizacao)){
      return [...new Set(plan.datasRealizacao.filter(Boolean))].sort();
    }
    if(plan.dataInicio && plan.dataFim && plan.dataInicio === plan.dataFim) return [plan.dataInicio];
    if(plan.dataInicio) return [plan.dataInicio];
    return [];
  }

  function formatAnnualPlanPeriod(plan){
    if(!plan || plan.status !== 'Agendado') return '';
    const dates = getAnnualPlanDates(plan);
    const tipo = plan.periodoTipo || (dates.length > 1 && !plan.dataFim ? 'dias' : (plan.dataInicio && plan.dataFim && plan.dataInicio !== plan.dataFim ? 'periodo' : 'dia'));
    if(tipo === 'dia' && dates[0]) return `📅 Dia: ${fmtDate(dates[0])}`;
    if(tipo === 'periodo' && plan.dataInicio && plan.dataFim){
      return `📅 Período: ${fmtDate(plan.dataInicio)} a ${fmtDate(plan.dataFim)}`;
    }
    if(tipo === 'dias' && dates.length){
      return `📅 Dias: ${dates.map(d=>fmtDate(d)).join(', ')}`;
    }
    if(plan.dataInicio || plan.dataFim){
      return `📅 Período: ${plan.dataInicio ? fmtDate(plan.dataInicio) : '—'}${plan.dataFim ? ' a '+fmtDate(plan.dataFim) : ''}`;
    }
    return '';
  }

  function initAnnualPeriodEditor(ov, prefix, initialPlan={}){
    const typeEl = ov.querySelector(`#${prefix}-period-type`);
    const oneDayBox = ov.querySelector(`#${prefix}-one-day-box`);
    const rangeBox = ov.querySelector(`#${prefix}-range-box`);
    const datesBox = ov.querySelector(`#${prefix}-dates-box`);
    const oneDayInput = ov.querySelector(`#${prefix}-one-day`);
    const rangeStart = ov.querySelector(`#${prefix}-range-start`);
    const rangeEnd = ov.querySelector(`#${prefix}-range-end`);
    const datesList = ov.querySelector(`#${prefix}-specific-dates`);
    const addDateBtn = ov.querySelector(`#${prefix}-add-date`);

    let dates = getAnnualPlanDates(initialPlan);
    let initialType = initialPlan.periodoTipo;
    if(!initialType){
      if(dates.length > 1) initialType = 'dias';
      else if(initialPlan.dataInicio && initialPlan.dataFim && initialPlan.dataInicio !== initialPlan.dataFim) initialType = 'periodo';
      else initialType = 'dia';
    }
    if(typeEl) typeEl.value = initialType;

    const addDateRow = (value='')=>{
      if(!datesList) return;
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;gap:8px;align-items:center;margin-bottom:7px;';
      row.innerHTML = `<input type="date" class="${prefix}-specific-date" value="${value}" style="flex:1;"><button type="button" class="btn secondary ${prefix}-remove-date" style="width:auto;padding:7px 10px;">Remover</button>`;
      row.querySelector(`.${prefix}-remove-date`)?.addEventListener('click', ()=>{ row.remove(); sync(); });
      datesList.appendChild(row);
    };

    const clearDateRows=()=>{
      if(datesList) datesList.innerHTML='';
    };

    const sync=()=>{
      const type = typeEl?.value || 'dia';
      if(oneDayBox) oneDayBox.style.display = type === 'dia' ? 'block' : 'none';
      if(rangeBox) rangeBox.style.display = type === 'periodo' ? 'block' : 'none';
      if(datesBox) datesBox.style.display = type === 'dias' ? 'block' : 'none';
      if(oneDayInput) oneDayInput.required = type === 'dia';
      if(rangeStart) rangeStart.required = type === 'periodo';
      if(rangeEnd) rangeEnd.required = type === 'periodo';
      if(type === 'dias'){
        const rows = Array.from(ov.querySelectorAll(`.${prefix}-specific-date`));
        rows.forEach(r=>r.required=true);
      }else{
        const rows = Array.from(ov.querySelectorAll(`.${prefix}-specific-date`));
        rows.forEach(r=>r.required=false);
      }
    };

    if(typeEl) typeEl.addEventListener('change', sync);
    if(addDateBtn) addDateBtn.addEventListener('click', ()=>{ addDateRow(''); sync(); });

    clearDateRows();
    if(dates.length){
      if(initialType === 'dia' && oneDayInput) oneDayInput.value = dates[0];
      else if(initialType === 'periodo'){
        if(rangeStart) rangeStart.value = initialPlan.dataInicio || dates[0] || '';
        if(rangeEnd) rangeEnd.value = initialPlan.dataFim || dates[dates.length-1] || '';
      }else{
        dates.forEach(d=>addDateRow(d));
      }
    }else if(initialType === 'dias'){
      addDateRow('');
    }
    sync();

    return {
      validate(){
        const type = typeEl?.value || 'dia';
        if(type === 'dia'){
          if(!oneDayInput?.value){ alert('Informe o dia do treinamento.'); return false; }
        }else if(type === 'periodo'){
          if(!rangeStart?.value || !rangeEnd?.value){ alert('Informe a data inicial e a data final do treinamento.'); return false; }
          if(rangeEnd.value < rangeStart.value){ alert('A data final não pode ser anterior à data inicial.'); return false; }
        }else{
          const vals = Array.from(ov.querySelectorAll(`.${prefix}-specific-date`)).map(i=>i.value).filter(Boolean);
          if(!vals.length){ alert('Informe pelo menos um dia específico para o treinamento.'); return false; }
        }
        return true;
      },
      getData(){
        const type = typeEl?.value || 'dia';
        if(type === 'dia'){
          const d = oneDayInput.value;
          return { periodoTipo:'dia', dataInicio:d, dataFim:d, datasRealizacao:[d] };
        }
        if(type === 'periodo'){
          return { periodoTipo:'periodo', dataInicio:rangeStart.value, dataFim:rangeEnd.value, datasRealizacao:[] };
        }
        const vals = [...new Set(Array.from(ov.querySelectorAll(`.${prefix}-specific-date`)).map(i=>i.value).filter(Boolean))].sort();
        return { periodoTipo:'dias', dataInicio:vals[0] || '', dataFim:vals[vals.length-1] || '', datasRealizacao:vals };
      }
    };
  }

                  const periodText = formatAnnualPlanPeriod(p);
                  const participantLocked = status === 'Realizado' || !canEditAnnual;
                  return `
                  <tr>
                    <td><strong>${String(p.mes).padStart(2,'0')}</strong></td>
                    <td><strong>${p.treinamento}</strong>${p.norma?`<br><span style="font-size:11px;color:var(--ink-dim);">${p.norma}</span>`:''}${periodText ? `<br><span style="font-size:11px;color:var(--amber);">${periodText}</span>` : ''}</td>
                    <td>${p.publico || '—'}</td>
                    <td>
                      <button type="button" class="action-link" data-manage-annual-participants="${p.id}" title="${participantLocked?'Visualizar participantes':'Ver, acrescentar ou excluir funcionários'}">
                        ${participantCount} participante${participantCount===1?'':'s'}
                      </button>
                    </td>
                    <td>${p.responsavel || '—'}</td>
                    <td><span class="ca-tag">${p.cargaHoraria || '—'}</span></td>
                    <td>${p.modalidade || '—'}</td>
                    <td>
                      ${((currentUser?.role === 'Usuario' && status !== 'Realizado') || (currentUser?.role !== 'Usuario' && canEditAnnual)) ? `
                        <select class="annual-status-select" data-status-annual-plan="${p.id}" style="min-width:125px;">
                          ${['Planejado','Agendado','Realizado','Cancelado'].map(st=>`<option value="${st}" ${status===st?'selected':''}>${st}</option>`).join('')}
                        </select>
                      ` : `<span class="status-pill ${status==='Realizado'?'ok':status==='Cancelado'?'bad':status==='Agendado'?'warn':'ok'}"><span class="dot"></span>${status}${status==='Realizado' && currentUser?.role==='Usuario' ? ' 🔒' : ''}</span>`}
                    </td>
                    ${showAnnualActions ? `<td class="row-actions"><button class="action-link" data-del-annual-plan="${p.id}">Remover</button></td>` : ''}
                  </tr>
                  ${p.observacoes ? `<tr><td></td><td colspan="${showAnnualActions?8:7}" style="font-size:11px;color:var(--ink-dim);padding-top:0;">Observações: ${p.observacoes}</td></tr>` : ''}
                `;}).join("")}
              </tbody>
            </table>
          </div>
        `}
      </div>
    `;

    root.querySelector("#annual-plan-search")?.addEventListener("input", e => {
      root.dataset.planSearch = e.target.value;
      renderAnnualTrainingPlan(root);
      attachMainListeners(root);
      const input = root.querySelector("#annual-plan-search");
      if(input){ input.focus(); input.setSelectionRange(input.value.length,input.value.length); }
    });
    root.querySelector("#annual-plan-status-filter")?.addEventListener("change", e => {
      root.dataset.planStatus = e.target.value;
      renderAnnualTrainingPlan(root);
      attachMainListeners(root);
    });
    root.querySelector("#annual-plan-year")?.addEventListener("change", e => {

      renderAnnualTrainingPlan(root);
      attachMainListeners(root);
    });
    root.querySelector("#annual-plan-month")?.addEventListener("change", e => {

    });

  function ensureGeneralMasterData(){
    if(!Array.isArray(state.generalSectors)) state.generalSectors=[];
    if(!Array.isArray(state.generalJobs)) state.generalJobs=[];
    // Aproveita setores e cargos já existentes nos funcionários.
    (state.employees||[]).forEach(e=>{
      const setor=(e.setor||"").trim(), cargo=(e.cargo||e.funcao||"").trim();
      if(setor && !state.generalSectors.some(x=>normalizeText(x.nome)===normalizeText(setor))) state.generalSectors.push({id:uid("setor"),nome:setor,imported:true});
      if(cargo && !state.generalJobs.some(x=>normalizeText(x.nome)===normalizeText(cargo))) state.generalJobs.push({id:uid("cargo"),nome:cargo,imported:true});
    });
  }

  function ensurePcmsoComplementaryExamCatalog(){

  function normalizeText(v){return String(v||"").trim().toLowerCase();}
  function pgrRisksForFunction(funcao){
    const target=normalizeText(funcao); if(!target) return [];
    const out=[];
    const add=(risk,source="PGR")=>{
      if(!risk) return;
      const text=typeof risk==="string"?risk:(risk.risco||risk.perigo||risk.agente||risk.descricao||risk.fatorRisco||risk.nome||"");
      if(text && !out.some(x=>normalizeText(x.text)===normalizeText(text))) out.push({text,source});
    };
    const scan=(obj,source="PGR")=>{
      if(!obj||typeof obj!=="object") return;
      const fn=normalizeText(obj.funcao||obj.cargo||obj.atividade||obj.funcaoNome);
      if(fn===target || fn.includes(target) || target.includes(fn)){
        ["riscos","risks","perigos","agentes","fatoresRisco","fatoresDeRisco"].forEach(k=>{
          const v=obj[k]; if(Array.isArray(v))v.forEach(x=>add(x,source)); else if(v)add(v,source);
        });
        add(obj.risco,source); add(obj.perigo,source); add(obj.agente,source); add(obj.fatorRisco,source);
      }
      Object.entries(obj).forEach(([k,v])=>{
        if(v&&typeof v==="object" && !["employees","pcmsoFunctionExams","pcmsoComplementaryExamCatalog"].includes(k)){
          if(Array.isArray(v)) v.forEach(x=>scan(x,source)); else scan(v,source);
        }
      });
    };
    // Procura nas estruturas PGR existentes do próprio sistema.
    ["pgr","pgrRisks","pgrRiscos","pgrInventario","pgrInventory","riskInventory","inventarioRiscos"].forEach(k=>{
      if(state[k]) scan(state[k],k);
    });
    return out;
  }

  function ensurePcmsoAnnualReports(){
    if(!Array.isArray(state.pcmsoAnnualReports)) state.pcmsoAnnualReports=[];

  function pcmsoExamDate(ex){
    return ex.dataExame || ex.data || ex.realizadoEm || ex.createdAt?.slice(0,10) || "";
  }
  function pcmsoExamYear(ex){ return Number((pcmsoExamDate(ex)||"").slice(0,4))||0; }
  function pcmsoExamType(ex){ return ex.tipoExame || ex.tipo || ex.exame || ex.tipoASO || "Exame ocupacional"; }
  function pcmsoEmployee(ex){ return (state.employees||[]).find(e=>e.id===(ex.employeeId||ex.funcionarioId))||null; }
  function pcmsoEmployeeGroup(ex){
    const emp=pcmsoEmployee(ex);
    return {
      unidade:ex.unidade||emp?.unidade||emp?.empresa||"Não informado",
      setor:ex.setor||emp?.setor||"Não informado",
      funcao:ex.funcao||emp?.funcao||emp?.cargo||"Não informado"
    };
  }
  function pcmsoAnnualData(year){
    const exams=(state.pcmso||[]).filter(e=>pcmsoExamYear(e)===Number(year));
    const clinical=exams.filter(e=>!e.complementar && !String(pcmsoExamType(e)).toLowerCase().includes("complement"));
    const complementary=exams.filter(e=>e.complementar || String(pcmsoExamType(e)).toLowerCase().includes("complement"));
    const types={};
    complementary.forEach(e=>{const t=pcmsoExamType(e);types[t]=(types[t]||0)+1;});
    const abnormal=complementary.filter(e=>{
      const r=String(e.resultado||e.result||e.situacao||"").toLowerCase();
      return e.anormal===true || r.includes("alter") || r.includes("anormal");
    });
    const abnormalGroups={};
    abnormal.forEach(e=>{
      const g=pcmsoEmployeeGroup(e), key=`${pcmsoExamType(e)}|||${g.unidade}|||${g.setor}|||${g.funcao}`;
      abnormalGroups[key]=(abnormalGroups[key]||0)+1;
    });
    const cats=(state.cipaCATs||[]).filter(c=>Number((c.dataAcidente||"").slice(0,4))===Number(year));
    const occupational=cats.filter(c=>String(c.tipoAcidente||"").toLowerCase().includes("doença") || String(c.descricao||"").toLowerCase().includes("ocupacional"));
    return {exams,clinical,complementary,types,abnormal,abnormalGroups,cats,occupational};
  }

  function printPcmsoAnnualReport(year,notes,d,previous){
    const w=window.open("","_blank","width=1000,height=800");if(!w){alert("Permita pop-ups para gerar o PDF.");return;}
    const esc=x=>String(x||"—").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
    w.document.write(`<!doctype html><html><head><meta charset="utf-8"><title>Relatório Analítico PCMSO ${year}</title><style>body{font-family:Arial,sans-serif;margin:28px;color:#222}h1{font-size:20px}h2{font-size:15px;border-bottom:1px solid #bbb;padding-bottom:5px;margin-top:22px}table{width:100%;border-collapse:collapse;font-size:11px}th,td{border:1px solid #bbb;padding:6px;text-align:left}th{background:#eee}.note{white-space:pre-wrap;font-size:12px}.foot{margin-top:30px;font-size:10px;color:#555}@media print{body{margin:12mm}}</style></head><body>
      <h1>Relatório Analítico Anual do PCMSO · NR-7</h1><p>Ano-base: <strong>${year}</strong></p>
      <h2>1. Exames clínicos realizados</h2><p>Total: ${d.clinical.length}</p>
      <h2>2. Exames complementares realizados</h2><table><tr><th>Tipo</th><th>Quantidade</th></tr>${Object.entries(d.types).map(([t,n])=>`<tr><td>${esc(t)}</td><td>${n}</td></tr>`).join("")}</table>
      <h2>3. Resultados anormais</h2><p>Total identificado: ${d.abnormal.length}</p>
      <h2>4. Doenças relacionadas ao trabalho</h2><div class="note">${esc(notes.diseasesAnalysis)}</div>
      <h2>5. CAT emitidas</h2><p>Total: ${d.cats.length}</p><table><tr><th>CAT</th><th>Data</th><th>Evento/doença</th></tr>${d.cats.map(c=>`<tr><td>${esc(c.numeroInterno)}</td><td>${fmtDate(c.dataAcidente)}</td><td>${esc(c.tipoAcidente||c.tipoCat)}</td></tr>`).join("")}</table>
      <h2>6. Comparação com o relatório anterior</h2><div class="note">${esc(notes.comparisonAnalysis)}</div>
      <h2>7. Prontuários médicos</h2><div class="note">${esc(notes.recordsNote)}</div>
      <h2>8. Conclusões e medidas de prevenção</h2><div class="note">${esc(notes.conclusion)}</div><p>Discussão com SST/CIPA: ${notes.discussionDate?fmtDate(notes.discussionDate):"—"}</p>
      <div class="foot">Relatório a ser validado pelo médico responsável pelo PCMSO.</div><script>window.onload=()=>setTimeout(()=>window.print(),250);<\/script></body></html>`);
    w.document.close();
  }

  function renderCipaDash(root){

          <div class="field"><label>Pesquisar</label><input id="cipa-dash-action-search" placeholder="Ação, origem ou responsável..."></div>
          <div class="field"><label>Situação</label><select id="cipa-dash-action-status"><option value="">Todas</option><option value="Pendente">Pendentes</option><option value="Atrasada">Atrasadas</option><option value="Concluída">Concluídas</option></select></div>
          <div class="field"><label>Responsável</label><select id="cipa-dash-action-owner"><option value="">Todos</option>${(state.employees||[]).map(e=>`<option value="${e.id}">${e.nome}</option>`).join("")}</select></div>

      const owner=root.querySelector("#cipa-dash-action-owner")?.value||"";
      const list=state.cipaActions.filter(a=>{
        const statusReal=a.status==="Concluída"?"Concluída":cipaActionStatus(a)==="bad"?"Atrasada":"Pendente";
        const hay=[a.descricao,a.origem,a.observacoes,employeeName(a.responsavelId)].join(" ").toLowerCase();

  function renderCipaMembros(root){
    // Exibe somente a comissão atual. Considera ativo=true e, quando houver,
    // a gestão mais recente entre os membros ativos.
    const allCipaMembers = Array.isArray(state.cipaMembers) ? state.cipaMembers : [];
    const activeMembersList = allCipaMembers.filter(m => m.ativo !== false);
    const currentGestao = activeMembersList
      .map(m => m.gestao || "")
      .filter(Boolean)
      .sort((a,b)=>String(b).localeCompare(String(a)))[0] || "";
    const currentCipaMembers = activeMembersList.filter(m => !currentGestao || (m.gestao || "") === currentGestao);

    const ativos = currentCipaMembers;
    const historico = historicoCipaMembers();

    // Agrupa o histórico por gestão (mais recente primeiro), preservando as
    // composições de comissões anteriores mesmo após uma nova eleição.
    const gestoes = [];
    historico.forEach(m => {
      const chave = m.gestao || "Sem gestão informada";
      let grupo = gestoes.find(g => g.gestao === chave);
      if(!grupo){ grupo = { gestao: chave, membros: [] }; gestoes.push(grupo); }
      grupo.membros.push(m);
    });
    gestoes.sort((a,b) => b.gestao.localeCompare(a.gestao));

    root.innerHTML = `
      <div class="page-head">
        <div>
          <h2>Membros da Comissão (Titulares e Suplentes)</h2>
          <div class="sub">Composição paritária da CIPA — representantes do empregador e dos empregados.</div>
        </div>
        ${checkPermission("Master") ? `<button class="btn" id="btn-new-cipa-membro">+ Novo Membro</button>` : ""}
      </div>
      <div class="panel">
        <div class="panel-head"><h3>Comissão Atual</h3></div>
        <div style="padding:0 0 2px;font-size:11px;color:var(--ink-dim);padding:10px 18px 0;">Ao encerrar a urna de uma eleição, esta composição é atualizada automaticamente com os candidatos eleitos.</div>
        ${renderCipaMembersTable(ativos, checkPermission("Administrador"))}
      </div>

      ${gestoes.length > 0 ? `
        <div class="panel">
          <div class="panel-head"><h3>Histórico de Comissões Anteriores</h3></div>
          ${gestoes.map(g => `
            <div style="padding:12px 18px 0;font-size:12px;font-weight:600;color:var(--ink-dim);">Gestão ${g.gestao}</div>
            ${renderCipaMembersTable(g.membros, false)}
          `).join("")}
        </div>
      ` : ''}
    `;
  }

  function renderCipaMembersTable(list, allowActions=false){

    return `

            return `<tr>

  function renderCipaHistorico(root){
    const allMembers = Array.isArray(state.cipaMembers) ? state.cipaMembers : [];
    const activeMembers = allMembers.filter(m => m.ativo !== false);
    const currentGestao = activeMembers.map(m=>m.gestao||"").filter(Boolean)
      .sort((a,b)=>String(b).localeCompare(String(a)))[0] || "";

    // Histórico = membros inativos ou membros pertencentes a gestões diferentes da atual.
    const historical = allMembers.filter(m =>
      m.ativo === false || (currentGestao && m.gestao && m.gestao !== currentGestao)
    );

    const groups = historical.reduce((acc,m)=>{
      const key = m.gestao || "Gestão não informada";
      (acc[key] ||= []).push(m);
      return acc;
    },{});
    const gestoes = Object.keys(groups).sort((a,b)=>String(b).localeCompare(String(a)));
    const isAdmin = currentUser?.role === "Administrador";

    root.innerHTML = `
      <div class="page-head">
        <div>
          <h2>Histórico de Comissões Anteriores</h2>
          <div class="sub">Consulta das composições anteriores da CIPA. A comissão atual permanece em “Membros da Comissão”.</div>
        </div>
        ${isAdmin && historical.length ? `<button class="btn secondary" id="btn-clear-cipa-history" style="color:var(--red);">🗑️ Limpar Histórico</button>` : ""}
      </div>

      ${!historical.length ? `<div class="panel"><div class="empty">Nenhuma comissão anterior registrada no histórico.</div></div>` :
        gestoes.map(gestao=>`
          <div class="panel">
            <div class="panel-head">
              <h3>Gestão ${gestao}</h3>
              <span style="font-size:11px;color:var(--ink-dim);">${groups[gestao].length} membro${groups[gestao].length===1?"":"s"}</span>
            </div>
            <div style="overflow-x:auto;">
              <table>
                <thead><tr><th>Funcionário</th><th>Representação</th><th>Tipo</th><th>Função na Comissão</th><th>Mandato</th></tr></thead>
                <tbody>
                  ${groups[gestao].map(m=>{
                    const emp=(state.employees||[]).find(e=>e.id===m.employeeId);
                    return `<tr>
                      <td><strong>${emp?.nome || "Funcionário não localizado"}</strong>${emp?.matricula?`<br><span style="font-size:11px;color:var(--ink-dim);">Matrícula: ${emp.matricula}</span>`:""}</td>
                      <td>${m.representacao || "—"}</td>
                      <td>${m.tipo || "—"}</td>
                      <td>${m.funcaoComissao || "—"}</td>
                      <td>${m.mandatoInicio ? fmtDate(m.mandatoInicio) : "—"} até ${m.mandatoFim ? fmtDate(m.mandatoFim) : "—"}</td>
                    </tr>`;
                  }).join("")}
                </tbody>
              </table>
            </div>
          </div>
        `).join("")
      }
    `;

    root.querySelector("#btn-clear-cipa-history")?.addEventListener("click", async ()=>{
      if(currentUser?.role !== "Administrador"){
        alert("Somente o Administrador pode limpar o histórico de comissões anteriores.");
        return;
      }
      if(!confirm("ATENÇÃO: deseja realmente limpar todo o histórico de comissões anteriores da CIPA? A comissão atual não será excluída.")) return;
      const historicalIds = new Set(historical.map(m=>m.id));
      state.cipaMembers = (state.cipaMembers || []).filter(m=>!historicalIds.has(m.id));
      await saveState();
      render();
    });
  }
