  // Registra um voto (candidato ou branco) de forma sigilosa na eleição informada.
  // Retorna o código de comprovante gerado, ou null se o funcionário já tiver votado.
  function registerCipaVote(electionId, employeeId, candidate){
    const el = state.cipaElections.find(e => e.id === electionId);
    if(!el) return null;
    ensureElectionVotingFields(el);
    if(el.votantes.some(v => v.employeeId === employeeId)) return null;

    if(candidate){ candidate.votos = (candidate.votos || 0) + 1; }
    else { el.votosBrancos = (el.votosBrancos || 0) + 1; }

    const dataHora = new Date().toISOString();
    const codigo = cipaVerificationCode(`${el.id}|${employeeId}|${dataHora}`);
    el.votantes.push({ employeeId, dataHora, codigo });
    return codigo;
  }

  // Monta o link do terminal de votação remota para um eleitor específico,
  // usando a própria URL em que o sistema está publicado.
  function buildVotoCipaLink(eleicaoId, eleitorId, canal){
    const baseUrl = window.location.href.split("#")[0].split("?")[0];
    return `${baseUrl}?votarCipa=1&eleicaoId=${encodeURIComponent(eleicaoId)}&eleitorId=${encodeURIComponent(eleitorId)}&canal=${encodeURIComponent(canal)}`;
  }

  // Abre o WhatsApp Web/App ou o cliente de e-mail já com a mensagem e o link
  // de votação preenchidos, para o Administrador/Master apenas conferir e enviar.
  function enviarLinkVotacaoCipa(eleicaoId, eleitorId, canal){
    const el = state.cipaElections.find(e=>e.id===eleicaoId);
    const emp = state.employees.find(e=>e.id===eleitorId);
    if(!el || !emp) return;
    if(canal === "whatsapp" && !emp.telefone){ alert(`Cadastre o telefone de ${emp.nome} em Geral/Pessoas antes de enviar por WhatsApp.`); return; }
    if(canal === "email" && !emp.email){ alert(`Cadastre o e-mail de ${emp.nome} em Geral/Pessoas antes de enviar por e-mail.`); return; }

    const link = buildVotoCipaLink(eleicaoId, eleitorId, canal);
    const mensagem = `Olá, ${emp.nome}! A urna da eleição da CIPA (gestão ${el.gestao}) está aberta. Acesse o link abaixo para registrar seu voto com total sigilo:\n\n${link}\n\nApós votar, você receberá a confirmação do seu voto por este mesmo canal.`;

    if(canal === "whatsapp"){
      const digits = emp.telefone.replace(/\D/g,"");
      const waPhone = digits.startsWith("55") ? digits : "55"+digits;
      window.open(`https://wa.me/${waPhone}?text=${encodeURIComponent(mensagem)}`, "_blank");
    } else {
      window.open(`mailto:${emp.email}?subject=${encodeURIComponent("Votação Eletrônica da CIPA — Gestão "+el.gestao)}&body=${encodeURIComponent(mensagem)}`, "_blank");
    }
  }

  // Após o voto remoto ser registrado, tenta abrir automaticamente o mesmo canal
  // (WhatsApp ou e-mail) usado para enviar o link, já com a confirmação do voto
  // preenchida, para que o eleitor receba/envie o comprovante para si mesmo.
  function enviarConfirmacaoVotoCipa(emp, el, codigo, canal){
    const mensagem = `Olá, ${emp.nome}! Confirmamos o recebimento do seu voto na eleição da CIPA (gestão ${el.gestao}), registrado com sigilo. Código de confirmação: ${codigo}. Obrigado por participar!`;
    try{
      if(canal === "whatsapp" && emp.telefone){
        const digits = emp.telefone.replace(/\D/g,"");
        const waPhone = digits.startsWith("55") ? digits : "55"+digits;
        window.open(`https://wa.me/${waPhone}?text=${encodeURIComponent(mensagem)}`, "_blank");
      } else if(canal === "email" && emp.email){
        window.open(`mailto:${emp.email}?subject=${encodeURIComponent("Confirmação do seu voto — CIPA "+el.gestao)}&body=${encodeURIComponent(mensagem)}`, "_blank");
      }
    }catch(err){}
  }

  // Tela pública de votação remota, acessada pelo link enviado por WhatsApp/E-mail
  // (parâmetros ?votarCipa=1&eleicaoId=...&eleitorId=...&canal=...). Não exige login.

  function renderCipaAuthenticatedTerminal(electionId, voterId){
    // Login voto_cipa usa exatamente a mesma tela responsiva utilizada pelos links de WhatsApp/e-mail.
    renderRemoteVoteScreen(electionId, voterId, "login");
  }

  function renderRemoteVoteScreen(eleicaoId, eleitorId, canal){
    stopCipaPoll();
    const app = document.getElementById("app");
    const el = state.cipaElections.find(e=>e.id===eleicaoId);
    const emp = state.employees.find(e=>e.id===eleitorId);

    if(!el || !emp){
      app.innerHTML = `
        <div class="login-overlay"><div class="login-card" style="max-width:420px; text-align:center;">
          <h2>🗳️ Votação Eletrônica da CIPA</h2>
          <div class="empty" style="padding:30px 10px;">⚠️ Link inválido ou eleição não encontrada.</div>
        </div></div>`;
      return;
    }
    ensureElectionVotingFields(el);
    const jaVotou = el.votantes.some(v => v.employeeId === eleitorId);

    if(el.urnaStatus !== "Aberta" || jaVotou){
      app.innerHTML = `
        <div class="login-overlay"><div class="login-card" style="max-width:420px; text-align:center;">
          <h2>🗳️ Votação Eletrônica da CIPA</h2>
          <p>Olá, <strong>${emp.nome}</strong>.</p>
          <div class="empty" style="padding:30px 10px;">
            ${jaVotou ? '✅ Seu voto já foi registrado anteriormente nesta gestão. Obrigado por participar!' : '🔒 A urna eletrônica não está aberta no momento. Aguarde uma nova liberação do Administrador/Master e tente novamente pelo mesmo link.'}
          </div>
        </div></div>`;
      return;
    }

    app.innerHTML = `
      <div class="login-overlay">
        <div class="login-card cipa-vote-card" style="width:min(960px,calc(100vw - 32px));max-width:960px;margin:20px auto;box-sizing:border-box;">
          <h2>🗳️ Votação Eletrônica da CIPA</h2>
          <p>Olá, <strong>${emp.nome}</strong>. Você está votando remotamente na eleição da gestão <strong>${el.gestao}</strong>. Seu voto é sigiloso.</p>
          <div id="urna-container"></div>
        </div>
      </div>
    `;
    const container = document.getElementById("urna-container");
    container.innerHTML = buildUrnaBallotHtml(el);
    wireUrnaBallot(container, el, {
      onConfirm: async (candidate) => {
        const codigo = registerCipaVote(el.id, eleitorId, candidate);
        // Dispara a tentativa de confirmação automática antes do await, para
        // aproveitar o gesto de clique do usuário e reduzir o bloqueio de pop-up.
        enviarConfirmacaoVotoCipa(emp, el, codigo, canal);
        await saveState();
        app.innerHTML = `
          <div class="login-overlay"><div class="login-card" style="max-width:420px; text-align:center;">
            <h2>✅ Voto Confirmado</h2>
            <p>Obrigado, <strong>${emp.nome}</strong>! Seu voto foi registrado com sucesso e de forma sigilosa.</p>
            <div style="font-size:11px; color:var(--ink-dim); margin-top:6px;">Código de comprovante de votação</div>
            <div style="font-family:var(--font-mono); font-size:20px; letter-spacing:3px; margin:6px 0 20px; color:var(--ink);">${codigo || '—'}</div>
            <p style="font-size:12px;color:var(--ink-dim);">Uma confirmação foi enviada por ${canal==='whatsapp'?'WhatsApp':'e-mail'}. Se não abriu automaticamente, use o botão abaixo.</p>
            <button type="button" class="btn secondary" id="btn-reenviar-confirmacao" style="width:100%; justify-content:center; margin-top:8px;">Reenviar confirmação por ${canal==='whatsapp'?'WhatsApp':'E-mail'}</button>
            <div style="text-align:center; margin-top:14px;"><span style="font-size:11px;color:var(--ink-dim);">Você já pode fechar esta janela.</span></div>
          </div></div>`;
        document.getElementById("btn-reenviar-confirmacao")?.addEventListener("click", () => enviarConfirmacaoVotoCipa(emp, el, codigo, canal));
      }
    });
  }


  // Monta o HTML da cédula eletrônica com teclado numérico. Os números digitados
  // NUNCA são exibidos na tela — aparecem sempre mascarados como "*", para
  // preservar o sigilo do voto mesmo com pessoas próximas ao terminal.
  function cipaCandidateEmployee(c){
    return (state.employees || []).find(e => e.id === (c.employeeId || c.funcionarioId || c.id)) || null;
  }

  function buildCipaCandidateListHtml(el){
    return `<div class="cipa-candidate-list">
      ${(el.candidatos || []).map(c=>{
        const emp=cipaCandidateEmployee(c);
        const nome=emp?.nome || c.nome || "Candidato";
        const foto=emp?.foto || "";
        return `<div class="cipa-candidate-mini">
          ${foto ? `<img src="${foto}" alt="Foto de ${nome}">` : `<div class="cipa-candidate-avatar">👤</div>`}
          <div class="num">Nº ${c.numero}</div>
          <div class="name">${nome}</div>
        </div>`;
      }).join("")}
    </div>`;
  }

  function buildUrnaBallotHtml(el){
    const numDigits = Math.max(1, ...el.candidatos.map(c => String(c.numero).length));
    return `
      <div class="urna-box">
        <div class="urna-voting-layout">
          <aside class="urna-candidates-side">
            <div class="urna-candidates-title">👥 Candidatos</div>
            ${buildCipaCandidateListHtml(el)}
          </aside>
          <section class="urna-keypad-side">
        <div class="urna-display" id="urna-display">${"*"}</div>
        <div class="urna-preview" id="urna-preview">Digite o número do seu candidato.</div>
        <input id="urna-hidden-input" type="text" inputmode="numeric" autocomplete="off"
               style="position:absolute; opacity:0; height:0; width:0; pointer-events:none;">
        <div class="urna-keys">
          ${[1,2,3,4,5,6,7,8,9].map(n => `<button type="button" class="urna-key" data-key="${n}">${n}</button>`).join("")}
          <button type="button" class="urna-key branco" data-key="branco">✖<br>BRANCO</button>
          <button type="button" class="urna-key" data-key="0">0</button>
          <button type="button" class="urna-key corrige" data-key="corrige">⌫<br>CORRIGE</button>
        </div>
        <button type="button" class="btn" id="urna-confirmar" style="width:100%; justify-content:center; margin-top:14px;">✅ CONFIRMA (Enter)</button>
        <div class="urna-msg" id="urna-msg"></div>
                </section>

</div>
    `;

  // Liga o comportamento da cédula eletrônica renderizada por buildUrnaBallotHtml
  // dentro de `container`. opts.onConfirm(candidatoOuNull) é chamado após a
  // confirmação final do eleitor (candidato = null significa voto em branco).
  function wireUrnaBallot(container, el, opts){
    const numDigits = Math.max(1, ...el.candidatos.map(c => String(c.numero).length));
    let buffer = "";
    let isBranco = false;

    const displayEl = container.querySelector("#urna-display");
    const previewEl = container.querySelector("#urna-preview");
    const msgEl = container.querySelector("#urna-msg");
    const hiddenInput = container.querySelector("#urna-hidden-input");

    function updateDisplay(){
      if(isBranco){
        displayEl.textContent = "BRANCO";
        previewEl.textContent = "Voto em branco selecionado. Pressione CONFIRMA (Enter).";
        return;
      }
      // O visor nunca exibe "_" vazio. Sem digitação mostra apenas "*".
      // Durante a digitação continua mascarando o número informado.
      displayEl.textContent = buffer.length ? "*".repeat(buffer.length) : "*";
      previewEl.textContent = buffer.length===numDigits ? "Pressione CONFIRMA (Enter) para registrar o voto." : "Digite o número do seu candidato.";
    }

    function addDigit(d){
      if(isBranco) return;
      if(buffer.length >= numDigits) return;
      buffer += String(d);
      msgEl.textContent = "";
      updateDisplay();
    }
    function corrige(){
      isBranco = false;
      buffer = buffer.slice(0, -1);
      msgEl.textContent = "";
      updateDisplay();
    }
    function setBranco(){
      isBranco = true;
      buffer = "";
      msgEl.textContent = "";
      updateDisplay();
    }

    function confirmar(){
      if(isBranco){
        if(!confirm("Confirmar VOTO EM BRANCO?\n\nEsta ação não poderá ser desfeita.")) return;
        opts.onConfirm(null);
        return;
      }
      if(buffer.length === 0){
        msgEl.textContent = "Digite o número do candidato ou selecione BRANCO.";
        return;
      }
      const cand = el.candidatos.find(c => String(c.numero) === buffer);
      if(!cand){
        msgEl.textContent = "❌ Número inválido. Confira o número do seu candidato e tente novamente.";
        buffer = "";
        isBranco = false;
        updateDisplay();
        return;
      }
      if(!confirm(`Confirmar voto na Chapa ${cand.numero}?\n\nEsta ação não poderá ser desfeita.`)) return;
      opts.onConfirm(cand);
    }

    container.querySelectorAll("[data-key]").forEach(btn => {
      btn.addEventListener("click", () => {
        const k = btn.dataset.key;
        if(k === "corrige") corrige();
        else if(k === "branco") setBranco();
        else addDigit(k);
        hiddenInput.focus();
      });
    });

    container.querySelector("#urna-confirmar").addEventListener("click", confirmar);

    hiddenInput.addEventListener("keydown", (e) => {
      if(e.key >= "0" && e.key <= "9"){ addDigit(e.key); e.preventDefault(); }
      else if(e.key === "Backspace"){ corrige(); e.preventDefault(); }
      else if(e.key === "Enter"){ confirmar(); e.preventDefault(); }
      else if(e.key.toLowerCase() === "b"){ setBranco(); e.preventDefault(); }
    });

    updateDisplay();
    setTimeout(() => hiddenInput.focus(), 60);
  }

  // Tela de comprovante de voto (ocupa a tela inteira, como a de login).
  function renderVoteReceiptScreen(codigo, nome, onContinue){

        </div>
      </div>
    `;
    document.getElementById("btn-voto-continuar").addEventListener("click", onContinue);

  // Retorna a eleição com urna aberta na qual o usuário logado (via employeeId
  // vinculado à sua conta) ainda precisa votar, ou null se não houver pendência.
  function getPendingSelfVoteElection(){
    if(!currentUser || !currentUser.employeeId) return null;
    (state.cipaElections || []).forEach(ensureElectionVotingFields);
    const el = state.cipaElections.find(e => e.urnaStatus === "Aberta");
    if(!el || el.candidatos.length === 0) return null;
    if(el.votantes.some(v => v.employeeId === currentUser.employeeId)) return null;
    if(sessionStorage.getItem("cipa-skip-" + el.id + "-" + currentUser.id)) return null;
    return el;
  }

  // Tela de votação exibida automaticamente para funcionários com usuário
  // próprio assim que acessam o sistema, enquanto houver urna aberta pendente.
  function renderSelfVoteScreen(el){
    stopCipaPoll();
    const app = document.getElementById("app");
    const emp = state.employees.find(e => e.id === currentUser.employeeId);
    const nome = emp ? emp.nome : currentUser.name;
    app.innerHTML = `
      <div class="login-overlay">
        <div class="login-card cipa-terminal-card">
          <h2>🗳️ Votação Eletrônica da CIPA</h2>
          <p>Olá, <strong>${nome}</strong>. A urna está aberta para a gestão <strong>${el.gestao}</strong>. Registre seu voto para continuar.</p>
          <div id="urna-container"></div>
          <div style="text-align:center; margin-top:14px;">
            <button type="button" class="action-link" id="btn-votar-depois">Votar depois</button>
          </div>
        </div>
      </div>
    `;
    const container = document.getElementById("urna-container");
    container.innerHTML = buildUrnaBallotHtml(el);
    wireUrnaBallot(container, el, {
      onConfirm: async (candidate) => {
        const codigo = registerCipaVote(el.id, currentUser.employeeId, candidate);
        await saveState();
        renderVoteReceiptScreen(codigo, nome, () => render());
      }
    });
    document.getElementById("btn-votar-depois").addEventListener("click", () => {
      sessionStorage.setItem("cipa-skip-" + el.id + "-" + currentUser.id, "1");
      render();
    });
  }

  // Tela do terminal físico de votação (usuário fixo "voto_cipa"), usado para
  // funcionários sem conta própria no sistema. Fica esperando o Administrador
  // ou Master liberar a urna para um funcionário específico.
  function renderVotoCipaTerminal(){
    const app = document.getElementById("app");
    (state.cipaElections || []).forEach(ensureElectionVotingFields);
    const el = state.cipaElections.find(e => e.urnaStatus === "Aberta" && e.votoPendente);

    app.innerHTML = `
      <div class="login-overlay cipa-terminal-overlay">
        <div class="login-card cipa-terminal-card" style="text-align:center;">
          <h2>🖥️ Terminal de Votação CIPA</h2>
          ${el ? `
            <p>Eleitor liberado para votar agora:<br><strong>${employeeName(el.votoPendente.employeeId)}</strong></p>
            <div id="urna-container"></div>
          ` : `
            <p>Aguardando o Administrador/Master liberar a urna para um funcionário votar neste terminal.</p>
            <div class="empty" style="padding:30px 10px;">🔒 Nenhuma votação liberada no momento.</div>
          `}
          <div style="text-align:center; margin-top:18px;">
            <button type="button" class="action-link" id="btn-terminal-logout">Sair do Terminal</button>
          </div>
        </div>
      </div>
    `;

    if(el){
      stopCipaPoll();
      const container = document.getElementById("urna-container");
      container.innerHTML = buildUrnaBallotHtml(el);
      wireUrnaBallot(container, el, {
        onConfirm: async (candidate) => {
          const employeeId = el.votoPendente.employeeId;
          const codigo = registerCipaVote(el.id, employeeId, candidate);
          const terminalVoter = (state.employees || []).find(e=>e.id===employeeId);
          if(terminalVoter) createCipaVoteAuth(el, terminalVoter);
          el.votoPendente = null;
          await saveState();
          renderVoteReceiptScreen(codigo, employeeName(employeeId), () => render());
        }
      });
    } else {
      startCipaPoll(() => renderVotoCipaTerminal());
    }

    document.getElementById("btn-terminal-logout").addEventListener("click", () => { stopCipaPoll(); handleLogout(); });
  }

  function openCipaCandidateModal(electionId){
    const el = state.cipaElections.find(e=>e.id===electionId);
    if(!el) return;
    ensureElectionVotingFields(el);
    if(!dentroPeriodoInscricao(el)){
      alert(`A inscrição de candidatos só é permitida dentro do período de inscrições informado no Processo Eleitoral (${fmtDate(el.dataInscricaoInicio)} — ${fmtDate(el.dataInscricaoFim)}).`);
      return;
    }
    if(state.employees.length===0){ alert("Cadastre ao menos um funcionário em Geral/Pessoas antes de inscrever candidatos."); return; }
    const jaCandidatos = new Set(el.candidatos.map(c=>c.employeeId));
    const disponiveis = state.employees.filter(e=>!jaCandidatos.has(e.id));
    if(disponiveis.length===0){ alert("Todos os funcionários cadastrados já são candidatos nesta gestão."); return; }

    openModal(`
      <h3>Cadastrar Candidato · Gestão ${el.gestao}</h3>
      <form id="cipa-candidato-form">
        <div class="field">
          <label>Funcionário Candidato</label>
          <select required name="employeeId">
            ${disponiveis.map(e=>`<option value="${e.id}">${e.nome} (${e.cargo||'—'})</option>`).join("")}

        await saveState(); window.closeModal(); render();
      });
    });
  }

  // Admin/Master libera a urna no Terminal de Votação CIPA para um funcionário
  // específico que não possui usuário próprio cadastrado no sistema.
  function openLiberarUrnaTerminalModal(electionId){
    const el = state.cipaElections.find(e=>e.id===electionId);
    if(!el) return;
    ensureElectionVotingFields(el);
    if(el.votoPendente){ alert("Já existe uma votação liberada aguardando conclusão no terminal. Cancele-a ou aguarde a conclusão antes de liberar outra."); return; }

    const jaVotaramIds = new Set(el.votantes.map(v=>v.employeeId));
    const semUsuario = employeesWithoutUser().filter(e=>!jaVotaramIds.has(e.id));
    if(semUsuario.length===0){ alert("Não há funcionários elegíveis sem usuário cadastrado no sistema para votar pelo terminal."); return; }

    openModal(`
      <h3>Liberar Urna no Terminal de Votação</h3>
      <div class="sub" style="margin-bottom:14px;">
        Selecione o funcionário sem usuário cadastrado que irá votar agora. Assim que liberada, a cédula aparecerá
        no computador logado com o usuário <strong>Terminal de Votação CIPA</strong> (login: <code>voto_cipa</code>).
      </div>
      <div class="field">
        <label>Funcionário</label>
        <select id="liberar-emp-select">
          <option value="">Selecione...</option>
          ${semUsuario.map(e=>`<option value="${e.id}">${e.nome} (${e.cargo||'—'})</option>`).join("")}
        </select>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn secondary" onclick="window.closeModal()">Cancelar</button>
        <button type="button" class="btn" id="btn-liberar-confirmar">🔓 Liberar Urna</button>
      </div>
    `, (ov)=>{
      ov.querySelector("#btn-liberar-confirmar").addEventListener("click", async ()=>{
        const employeeId = ov.querySelector("#liberar-emp-select").value;
        if(!employeeId){ alert("Selecione o funcionário para continuar."); return; }
        el.votoPendente = { employeeId, releasedAt: new Date().toISOString(), releasedBy: currentUser.name };
        await saveState();
        window.closeModal();
        render();
      });
    });
  }

  // Relatório com a lista de eleitores que já votaram (com comprovante) e os

  function openCipaVotantesReportModal(electionId){
    const el = state.cipaElections.find(e=>e.id===electionId);

    ensureElectionVotingFields(el);

    const votaram = el.votantes
      .map(v => ({ ...v, nome: employeeName(v.employeeId) }))

  function renderCipaCalendario(root){
    ensureCipaCalendar();

      ...(state.cipaMembers||[]).map(m=>m.gestao),

    const list=state.cipaMeetingCalendar.filter(r=>r.gestao===selected).sort((a,b)=>a.data.localeCompare(b.data));

    root.innerHTML=`
      <div class="page-head">
        <div><h2>📅 Calendário de Reuniões da CIPA</h2><div class="sub">Planejamento das reuniões ordinárias por gestão e inclusão de reuniões extraordinárias quando necessário.</div></div>

          const meeting=(state.cipaMeetings||[]).find(m=>m.calendarId===r.id || (m.dataReuniao===r.data && (m.gestao||selected)===selected));
          const done=!!meeting;
          const late=!done && r.data<today;
          const cls=done?"done":late?"late":r.tipo==="Extraordinária"?"extra":"scheduled";
          return `<div class="calendar-event ${cls}">
            <div class="calendar-date"><strong>${fmtDate(r.data)}</strong><span>${r.tipo}</span></div>
            <div class="calendar-info"><strong>${r.titulo||`${i+1}ª Reunião`}</strong><small>${r.observacoes|| (r.tipo==="Ordinária"&&i===0?"Na primeira reunião podem ser confirmadas/ajustadas as datas da gestão.":"")}</small></div>

        }).join("")}</div>`:`<div class="empty">Nenhuma reunião planejada para a gestão ${selected}. Use “Definir Calendário da Gestão” para cadastrar as datas.</div>`}

  function openCipaCalendarPlanModal(gestao){
    ensureCipaCalendar();
    const existing=state.cipaMeetingCalendar
      .filter(r=>r.gestao===gestao && r.tipo==="Ordinária")
      .sort((a,b)=>a.data.localeCompare(b.data));

    const yearMatch=String(gestao||"").match(/\d{4}/);
    const baseYear=yearMatch ? Number(yearMatch[0]) : new Date().getFullYear();

    const toISO=(y,m,d)=>{
      const dt=new Date(y,m,d,12,0,0);
      return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;
    };
    const nextBusinessDay=(iso)=>{
      if(!iso) return "";
      const [y,m,d]=iso.split("-").map(Number);
      const dt=new Date(y,m-1,d,12,0,0);
      while(dt.getDay()===0 || dt.getDay()===6) dt.setDate(dt.getDate()+1);
      return toISO(dt.getFullYear(),dt.getMonth(),dt.getDate());
    };
    const make12Dates=(firstISO)=>{
      if(!firstISO) return [];
      const [y,m,d]=firstISO.split("-").map(Number);
      const out=[];
      for(let i=0;i<12;i++){
        const targetMonth=(m-1)+i;
        const yy=y+Math.floor(targetMonth/12);
        const mm=((targetMonth%12)+12)%12;
        const lastDay=new Date(yy,mm+1,0,12,0,0).getDate();
        const safeDay=Math.min(d,lastDay);
        out.push(nextBusinessDay(toISO(yy,mm,safeDay)));
      }
      return out;
    };

    const initial=existing.length ? existing.map(x=>x.data) : [];

    openModal(`<h3>📅 Calendário de Reuniões · Gestão ${gestao}</h3>
      <div class="sub" style="margin-bottom:14px;">
        Escolha como deseja programar as reuniões ordinárias. Se uma data cair em sábado ou domingo,
        o sistema moverá automaticamente para o próximo dia útil.
      </div>

      <div class="calendar-mode-box">
        <label class="calendar-mode-option">
          <input type="radio" name="calendarMode" value="monthly" checked>
          <span><strong>📆 Definir mês a mês</strong><small>Escolha manualmente a data de cada reunião.</small></span>
        </label>
        <label class="calendar-mode-option">
          <input type="radio" name="calendarMode" value="annual">
          <span><strong>🗓️ Repetir por 12 meses</strong><small>Escolha a primeira data e o sistema programa os 12 meses seguintes.</small></span>
        </label>
      </div>

      <form id="cipa-calendar-form">
        <div id="calendar-monthly-mode">
          <div id="cipa-calendar-date-list">
            ${(initial.length?initial:[""]).map((d,i)=>`<div class="field-row cipa-date-row">
              <div class="field"><label>${i+1}ª reunião ordinária</label><input type="date" name="datas" value="${d}"></div>
              <button type="button" class="btn secondary cipa-remove-date" style="align-self:end;">Remover</button>
            </div>`).join("")}
          </div>
          <button type="button" class="btn secondary" id="cipa-add-date">+ Adicionar mês/data</button>
        </div>

        <div id="calendar-annual-mode" style="display:none;">
          <div class="field-row">
            <div class="field">
              <label>Primeira data da sequência de 12 meses</label>
              <input type="date" id="cipa-first-annual-date" value="${initial[0]||`${baseYear}-01-01`}">
            </div>
          </div>
          <div class="calendar-business-note">💼 Sábado ou domingo → próximo dia útil (segunda-feira).</div>
          <div id="cipa-annual-preview"></div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button>
          <button class="btn" type="submit">Salvar Calendário</button>
        </div>
      </form>`,ov=>{
        const monthly=ov.querySelector("#calendar-monthly-mode");
        const annual=ov.querySelector("#calendar-annual-mode");
        const list=ov.querySelector("#cipa-calendar-date-list");
        const firstAnnual=ov.querySelector("#cipa-first-annual-date");
        const preview=ov.querySelector("#cipa-annual-preview");

        const renumber=()=>list.querySelectorAll(".cipa-date-row label").forEach((l,i)=>l.textContent=`${i+1}ª reunião ordinária`);
        const adjustInput=(input)=>{
          if(!input.value) return;
          const adjusted=nextBusinessDay(input.value);
          if(adjusted!==input.value){
            input.value=adjusted;
            alert("A data selecionada caiu em um final de semana e foi transferida para o próximo dia útil.");
          }
        };
        const wireRows=()=>{
          list.querySelectorAll('input[name="datas"]').forEach(inp=>inp.onchange=()=>adjustInput(inp));
          list.querySelectorAll(".cipa-remove-date").forEach(b=>b.onclick=()=>{
            b.closest(".cipa-date-row").remove();renumber();
          });
        };
        const renderPreview=()=>{
          const dates=make12Dates(firstAnnual.value);
          preview.innerHTML=dates.length?`<div class="annual-preview-grid">${dates.map((d,i)=>`
            <div class="annual-preview-item"><strong>${i+1}º mês</strong><span>${fmtDate(d)}</span></div>`).join("")}</div>`:"";
        };

        wireRows();
        renderPreview();

        ov.querySelectorAll('input[name="calendarMode"]').forEach(r=>r.onchange=()=>{
          const isAnnual=r.value==="annual" && r.checked;
          if(r.checked){
            monthly.style.display=isAnnual?"none":"block";
            annual.style.display=isAnnual?"block":"none";
            if(isAnnual) renderPreview();
          }
        });

        ov.querySelector("#cipa-add-date").onclick=()=>{
          list.insertAdjacentHTML("beforeend",`<div class="field-row cipa-date-row">
            <div class="field"><label>Nova reunião</label><input type="date" name="datas"></div>
            <button type="button" class="btn secondary cipa-remove-date" style="align-self:end;">Remover</button>
          </div>`);
          wireRows();renumber();
        };

        firstAnnual.onchange=()=>{
          firstAnnual.value=nextBusinessDay(firstAnnual.value);
          renderPreview();
        };

        ov.querySelector("#cipa-calendar-form").onsubmit=async e=>{
          e.preventDefault();
          const mode=ov.querySelector('input[name="calendarMode"]:checked').value;
          let dates;
          if(mode==="annual"){
            if(!firstAnnual.value){alert("Escolha a primeira data.");return;}
            dates=make12Dates(firstAnnual.value);
          }else{
            dates=[...e.target.querySelectorAll('input[name="datas"]')]
              .map(x=>nextBusinessDay(x.value)).filter(Boolean);
            if(!dates.length){alert("Adicione pelo menos uma data.");return;}
          }

          dates=Array.from(new Set(dates)).sort();
          state.cipaMeetingCalendar=state.cipaMeetingCalendar.filter(r=>!(r.gestao===gestao&&r.tipo==="Ordinária"));
          dates.forEach((data,i)=>state.cipaMeetingCalendar.push({
            id:uid("cipacal"),gestao,data,tipo:"Ordinária",
            titulo:`${i+1}ª Reunião Ordinária`,
            observacoes:i===0?"Primeira reunião da gestão":""
          }));
          await saveState();closeModal();render();
        };
      });
  }

  function ensureCipaCauseAnalysis(){
    if(!Array.isArray(state.cipaCauseAnalyses)) state.cipaCauseAnalyses=[];
  }
  function getMeetingCAT(meeting){
    if(!meeting) return null;
    const calendar=(state.cipaMeetingCalendar||[]).find(r=>r.id===meeting.calendarId);
    const catId=meeting.catId || calendar?.catId;
    return catId ? (state.cipaCATs||[]).find(c=>c.id===catId) : null;
  }
  function fishboneCauses(analysis){
    if(!analysis) return [];
    const groups=[
      ["Método",analysis.metodo],["Máquina / Equipamento",analysis.maquina],
      ["Mão de obra / Pessoas",analysis.maoDeObra],["Material",analysis.material],
      ["Meio ambiente",analysis.meioAmbiente],["Medição / Controle",analysis.medicao]
    ];
    return groups.flatMap(([grupo,texto])=>(texto||"").split("\n").map(x=>x.trim()).filter(Boolean).map((texto,i)=>({
      id:`${analysis.id}-${grupo}-${i}`,grupo,texto
    })));
  }
  function openFishboneAnalysis(meetingId, afterSave){
    ensureCipaCauseAnalysis();
    const meeting=(state.cipaMeetings||[]).find(m=>m.id===meetingId);
    const cat=getMeetingCAT(meeting);
    if(!meeting||!cat){ if(afterSave) afterSave(); return; }
    let a=state.cipaCauseAnalyses.find(x=>x.meetingId===meetingId);
    if(!a) a={id:uid("fish"),meetingId,catId:cat.id,metodo:"",maquina:"",maoDeObra:"",material:"",meioAmbiente:"",medicao:"",causaRaiz:"",conclusao:""};

      <div class="cat-form-note"><strong>${cat.numeroInterno}</strong> · ${catEmployeeName(cat.employeeId)} · acidente em ${fmtDate(cat.dataAcidente)}. Registre causas potenciais por categoria; uma causa por linha facilita o vínculo com o Plano de Ação.</div>

      const owner=root.querySelector("#cipa-action-owner")?.value||"";
      const from=root.querySelector("#cipa-action-from")?.value||"";
      const to=root.querySelector("#cipa-action-to")?.value||"";

      const rows=(state.cipaActions||[]).filter(a=>{
        const realStatus=a.status==="Concluída" ? "Concluída" : (cipaActionStatus(a)==="bad" ? "Atrasada" : "A vencer");
        const text=[a.descricao,a.origem,a.observacoes,employeeName(a.responsavelId)].filter(Boolean).join(" ").toLowerCase();
        return (!q||text.includes(q)) && (!origin||a.origem===origin) && (!status||realStatus===status)
          && (!owner||a.responsavelId===owner) && (!from||(a.prazo||"")>=from) && (!to||(a.prazo||"")<=to);
      });
      root.querySelector("#cipa-action-results").innerHTML=renderCipaActionsTable(rows,checkPermission("Master"));
      root.querySelector("#cipa-action-count").textContent=`${rows.length} de ${(state.cipaActions||[]).length} ação(ões)`;
    };

    root.querySelector("#cipa-action-search")?.addEventListener("input",applyFilters);
    ["#cipa-action-origin","#cipa-action-status","#cipa-action-owner","#cipa-action-from","#cipa-action-to"].forEach(sel=>root.querySelector(sel)?.addEventListener("change",applyFilters));
    root.querySelector("#cipa-action-clear")?.addEventListener("click",()=>{
      ["#cipa-action-search","#cipa-action-origin","#cipa-action-status","#cipa-action-owner","#cipa-action-from","#cipa-action-to"].forEach(sel=>{const el=root.querySelector(sel);if(el)el.value="";});
      applyFilters();
    });
    root.addEventListener("click",async ev=>{
      const edit=ev.target.closest(".cipa-action-edit");
      if(edit){ openCipaActionEdit(edit.dataset.id); return; }
      const done=ev.target.closest(".cipa-action-done");
      if(done){
        const a=(state.cipaActions||[]).find(x=>x.id===done.dataset.id);
        if(a){a.status="Concluída";a.concluidaEm=new Date().toISOString();await saveState();render();}
        return;
      }
      const rem=ev.target.closest(".cipa-action-remove");
      if(rem && confirm("Remover esta ação?")){
        state.cipaActions=(state.cipaActions||[]).filter(x=>x.id!==rem.dataset.id);await saveState();render();
      }
    });
    applyFilters();
  }


  function getCipaActionMeeting(action){
    if(!action) return null;
    if(action.meetingId) return (state.cipaMeetings||[]).find(m=>m.id===action.meetingId)||null;
    if(action.reuniaoId) return (state.cipaMeetings||[]).find(m=>m.id===action.reuniaoId)||null;
    // Retrocompatibilidade: ações antigas de "Reunião CIPA" podem ter a data da ata na origem.
    if((action.origem||"").toLowerCase().includes("reuni")){
      const date=action.dataOrigem||action.dataReuniao||action.createdAt?.slice(0,10);
      if(date) return (state.cipaMeetings||[]).find(m=>m.dataReuniao===date)||null;
    }
    return null;
  }
  function cipaMeetingLabel(meeting){
    if(!meeting) return "—";
    const tipo=meeting.tipo||"Reunião CIPA";
    return `${tipo} · ${fmtDate(meeting.dataReuniao)}${meeting.gestao?` · Gestão ${meeting.gestao}`:""}`;
  }

  function renderCipaActionsTable(list, allowActions=false){
    if(list.length === 0) return `<div class="empty">Nenhuma ação cadastrada neste filtro.</div>`;
    return `
      <table>
        <thead><tr><th>Ação</th><th>Origem</th><th>Ata vinculada</th><th>Responsável</th><th>Prazo</th><th>Situação</th>${allowActions?'<th>Ações</th>':''}</tr></thead>
        <tbody>
          ${list.map(a=>{
            const st=cipaActionStatus(a);
            const dleft=daysUntil(a.prazo);
            const stLabel=a.status==="Concluída"?"Concluída":st==="bad"?`Atrasada ${Math.abs(dleft)}d`:st==="warn"?`Prazo em ${dleft}d`:"A vencer";
            const meeting=getCipaActionMeeting(a);
            const cause=a.causeRef?a.causeRef.split("|||").slice(1).join(" · "):"";
            return `<tr>
              <td><strong>${a.descricao}</strong>${cause?`<br><small class="cause-link-label">🔗 Causa: ${cause}</small>`:""}</td>
              <td>${a.origem||"—"}${a.dataOrigem?`<br><small>Ata de <strong>${fmtDate(a.dataOrigem)}</strong></small>`:""}</td>
              <td>${meeting?`<strong>📝 ${cipaMeetingLabel(meeting)}</strong><br><small>${meeting.pauta||""}</small>`:(a.origem||"").toLowerCase().includes("reuni")?'<span class="badge warn">Ata não identificada</span>':"—"}</td>
              <td>${employeeName(a.responsavelId)}</td>
              <td>${fmtDate(a.prazo)}</td>
              <td><span class="badge ${a.status==="Concluída"?"ok":st}">● ${stLabel}</span></td>
              ${allowActions?`<td class="action-buttons"><button class="btn secondary cipa-action-edit" data-id="${a.id}">✏️ Editar</button> ${a.status!=="Concluída"?`<button class="btn secondary cipa-action-done" data-id="${a.id}">Concluir</button>`:""} <button type="button" class="btn secondary cipa-action-remove" data-id="${a.id}">🗑️ Remover</button></td>`:""}
            </tr>`;
          }).join("")}
        </tbody>
      </table>`;
  }

    openModal(`

        const n = checks.filter(c=>c.checked).length;

      checks.forEach(c=>c.addEventListener('change', update));

      ov.querySelector('#btn-back-annual-participants')?.addEventListener('click', ()=>{
        openAnnualTrainingPlanParticipantsModal(plan.id);

    const plan = (state.annualTrainingPlan || []).find(x => x.id === planId);
    if(!plan) return;
    const employees = Array.isArray(state.employees) ? state.employees : [];
    const selectedIds = new Set(Array.isArray(plan.participantes) ? plan.participantes : []);
    const selectedEmployees = employees.filter(emp => selectedIds.has(emp.id));
    const canCreateAnnual = currentUser?.role === "Administrador" || currentUser?.role === "Master" || canSubitemAction("annual-plan", "create", currentUser);
    const canEditAnnual = currentUser?.role === "Administrador" || currentUser?.role === "Master" || canSubitemAction("annual-plan", "edit", currentUser);
    const canDeleteAnnual = currentUser?.role === "Administrador" || currentUser?.role === "Master" || canSubitemAction("annual-plan", "delete", currentUser);
    const showAnnualActions = currentUser?.role !== "Usuario" && canDeleteAnnual;
    const locked = !canEditAnnual || (currentUser?.role === 'Usuario' && plan.status === 'Realizado');

    openModal(`
      <h3>Participantes do Treinamento</h3>
      <div style="font-size:13px;margin-bottom:12px;"><strong>${plan.treinamento || 'Treinamento'}</strong> · ${String(plan.mes).padStart(2,'0')}/${plan.ano}</div>
      ${locked ? `<div style="background:#E08E3222;border:1px solid var(--amber);border-radius:6px;padding:9px 11px;margin-bottom:12px;font-size:12px;color:var(--amber);">🔒 Este treinamento está <strong>Realizado</strong>. Os participantes não podem ser alterados pelo usuário. Somente Administrador ou Master podem editar.</div>` : ''}
      <form id="annual-participants-form">
        <div class="field">
          <label>Funcionários selecionados no cadastro</label>
          <div style="border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--panel);">
            <div id="manage-employee-list" style="max-height:300px;overflow-y:auto;display:flex;flex-direction:column;gap:7px;">
              ${selectedEmployees.length ? selectedEmployees.map(emp=>`
                <label style="display:flex;align-items:center;gap:8px;cursor:${locked?'default':'pointer'};font-weight:400;margin:0;">
                  <input type="checkbox" class="manage-employee-check" value="${emp.id}" checked ${locked?'disabled':''} style="width:auto;margin:0;cursor:${locked?'default':'pointer'};">
                  <span>${emp.nome} <span style="font-size:11px;color:var(--ink-dim);">(${emp.cargo||'—'}${emp.setor ? ' · '+emp.setor : ''})</span></span>
                </label>
              `).join('') : `<div class="empty" style="padding:8px 0;">Nenhum funcionário foi selecionado no primeiro cadastro.</div>`}
            </div>
            <div id="manage-selected-count" style="font-size:11px;color:var(--ink-dim);margin-top:9px;"></div>
          </div>
        </div>
        ${!locked ? `<div style="display:flex;justify-content:flex-start;margin-top:4px;">
          <button type="button" class="btn" id="btn-add-annual-participants">+ Selecionar novos participantes</button>
        </div>` : ''}
        <div class="modal-actions">
          <button type="button" class="btn secondary" onclick="window.closeModal()">Fechar</button>
          ${!locked ? `<button type="submit" class="btn">Salvar Participantes</button>` : ''}
        </div>
      </form>
    `, (ov)=>{
      const checks = Array.from(ov.querySelectorAll('.manage-employee-check'));
      const countEl = ov.querySelector('#manage-selected-count');
      const update = ()=>{
        const n = checks.filter(c=>c.checked).length;
        if(countEl) countEl.textContent = `${n} funcionário${n===1?'':'s'} selecionado${n===1?'':'s'}`;
      };
      checks.forEach(c=>c.addEventListener('change', update));
      update();

      if(!locked){
        ov.querySelector('#btn-add-annual-participants')?.addEventListener('click', ()=>{
          openAnnualTrainingPlanAddParticipantsModal(plan.id);
        });

        ov.querySelector('#annual-participants-form').addEventListener('submit', async e=>{
          e.preventDefault();
          plan.participantes = checks.filter(c=>c.checked).map(c=>c.value);
          await saveState();
          window.closeModal();
          render();
        });
      }
    });
  }

              <div class="field" style="margin-bottom:0;"><label>Data inicial</label><input type="date" id="annual-range-start"></div>
              <div class="field" style="margin-bottom:0;"><label>Data final</label><input type="date" id="annual-range-end"></div>
            </div>
          </div>

          <div id="annual-dates-box" style="display:none;margin-top:10px;">
            <label>Dias em que o treinamento será realizado</label>
            <div id="annual-specific-dates"></div>
            <button type="button" class="btn secondary" id="annual-add-date" style="margin-top:4px;">+ Adicionar outro dia</button>
          </div>

          <div style="font-size:11px;color:var(--ink-dim);margin-top:7px;">Você pode agendar para um único dia, para um período contínuo ou para vários dias separados.</div>
        </div>

        <div class="field"><label>Observações</label><textarea name="observacoes" rows="2" placeholder="Turma, fornecedor, requisitos ou outras informações."></textarea></div>
        <div class="modal-actions">
          <button type="button" class="btn secondary" onclick="window.closeModal()">Cancelar</button>
          <button type="submit" class="btn">Salvar no Plano Anual</button>
        </div>
      </form>
    `, (ov)=>{
      const selectAll = ov.querySelector('#annual-select-all');
      const checks = Array.from(ov.querySelectorAll('.annual-employee-check'));
      const countEl = ov.querySelector('#annual-selected-count');

      const updateParticipantSelection = ()=>{
        const selected = checks.filter(ch=>ch.checked).length;
        countEl.textContent = `${selected} funcionário${selected===1?'':'s'} selecionado${selected===1?'':'s'}`;
        if(selectAll){
          selectAll.checked = checks.length > 0 && selected === checks.length;
          selectAll.indeterminate = selected > 0 && selected < checks.length;
        }
      };

      if(selectAll){
        selectAll.addEventListener('change', ()=>{
          checks.forEach(ch=>ch.checked = selectAll.checked);
          updateParticipantSelection();
        });
      }
      checks.forEach(ch=>ch.addEventListener('change', updateParticipantSelection));
      updateParticipantSelection();

      const statusSelect = ov.querySelector('#annual-plan-status');
      const periodBox = ov.querySelector('#annual-plan-period');
      let periodEditor = null;
      const updatePeriodVisibility = ()=>{
        const agendado = statusSelect?.value === 'Agendado';
        if(periodBox) periodBox.style.display = agendado ? 'block' : 'none';
        if(agendado && !periodEditor) periodEditor = initAnnualPeriodEditor(ov, 'annual', {});
      };
      statusSelect?.addEventListener('change', updatePeriodVisibility);
      updatePeriodVisibility();

      ov.querySelector("#annual-plan-form").addEventListener("submit", async(e)=>{
        e.preventDefault();
        const data = Object.fromEntries(new FormData(e.target));
        const participantes = checks.filter(ch=>ch.checked).map(ch=>ch.value);
        if(participantes.length === 0){
          alert("Selecione pelo menos um funcionário para participar do treinamento.");
          return;
        }

        data.ano = Number(data.ano);
        data.mes = Number(data.mes);
        delete data.participantes;

        if(data.status === 'Agendado'){
          if(!periodEditor) periodEditor = initAnnualPeriodEditor(ov, 'annual', {});
          if(!periodEditor.validate()) return;
          Object.assign(data, periodEditor.getData());
        }else{
          delete data.dataInicio;
          delete data.dataFim;
          delete data.datasRealizacao;
          delete data.periodoTipo;
        }

        data.participantes = participantes;
        if(!Array.isArray(state.annualTrainingPlan)) state.annualTrainingPlan = [];
        state.annualTrainingPlan.push({id:uid("plan"), ...data});
        await saveState(); window.closeModal(); render();
      });
    });
  }

        const data = Object.fromEntries(new FormData(e.target));
        const novaEleicao = {
          id:uid("cipael"), ...data,
          vagasTitulares: Number(data.vagasTitulares)||3,
          vagasSuplentes: Number(data.vagasSuplentes)||0,
          totalInscritos: 0, totalVotantes: 0,
          candidatos: [], votantes: [], urnaStatus: "Fechada", votosBrancos: 0
        };
        state.cipaElections.push(novaEleicao);

        // Ao cadastrar um processo eleitoral como "Planejada", cria automaticamente
        // uma ação no Plano de Ação para cada etapa (Edital, Inscrições, Eleição e Posse),
        // atribuindo o Presidente da CIPA vigente como responsável, e leva o usuário
        // direto para a aba Plano de Ação.
        if(novaEleicao.status === "Planejada"){
          const presidente = activeCipaMembers().find(m => m.funcaoComissao === "Presidente");
          const respId = presidente ? presidente.employeeId : "";
          const semPresidenteObs = presidente ? "" : "Nenhum Presidente da CIPA cadastrado — defina um responsável manualmente.";
          const etapas = [
            { descricao: `Publicar edital do processo eleitoral CIPA — Gestão ${novaEleicao.gestao}`, prazo: novaEleicao.dataEdital },
            { descricao: `Conduzir o período de inscrições de candidatos — Gestão ${novaEleicao.gestao}`, prazo: novaEleicao.dataInscricaoFim },
            { descricao: `Realizar a eleição/votação da CIPA — Gestão ${novaEleicao.gestao}`, prazo: novaEleicao.dataEleicao },
            { descricao: `Empossar a nova comissão da CIPA — Gestão ${novaEleicao.gestao}`, prazo: novaEleicao.dataPosse }
          ];
          etapas.forEach(etapa => {
            if(!etapa.prazo) return;
            state.cipaActions.push({
              id: uid("cipaacao"),
              descricao: etapa.descricao,
              origem: "Processo Eleitoral CIPA",
              eleicaoId: novaEleicao.id,
              responsavelId: respId,
              prazo: etapa.prazo,
              status: "Pendente",
              observacoes: semPresidenteObs
            });
          });
          currentTab = "cipa-acoes";
        }

        await saveState(); window.closeModal(); render();
      });
    });
  }

          <button type="button" class="btn secondary" onclick="window.closeModal()">Cancelar</button>
          <button type="submit" class="btn">Salvar Ação</button>
        </div>
      </form>
    `, (ov)=>{
      const origemSelect = ov.querySelector("#cipa-acao-origem");
      const ataField = ov.querySelector("#cipa-acao-ata-field");
      const ataSearch = ov.querySelector("#cipa-ata-search");
      const ataHiddenId = ov.querySelector("#cipa-ata-hidden-id");
      const ataResults = ov.querySelector("#cipa-ata-results");

      function meetingLabel(m){
        const pautaExcerpt = (m.pauta || "").slice(0, 70) + ((m.pauta||"").length > 70 ? "…" : "");
        return { title: `${fmtDate(m.dataReuniao)} · ${m.tipo}`, sub: pautaExcerpt };
      }

      function renderResults(query){
        const q = (query || "").trim().toLowerCase();
        const matches = meetingsSorted.filter(m => {
          if(!q) return true;
          const dateBr = fmtDate(m.dataReuniao).toLowerCase();
          return dateBr.includes(q) || (m.pauta||"").toLowerCase().includes(q) || (m.dataReuniao||"").includes(q);
        }).slice(0, 8);

        if(matches.length === 0){
          ataResults.innerHTML = `<div class="search-combo-results"><div class="search-combo-empty">Nenhuma ata encontrada.</div></div>`;
        } else {
          ataResults.innerHTML = `<div class="search-combo-results">
            ${matches.map(m => {
              const lbl = meetingLabel(m);
              return `<div class="search-combo-item" data-pick-ata="${m.id}">
                <div class="sc-title">${lbl.title}</div>
                <div class="sc-sub">${lbl.sub}</div>
              </div>`;
            }).join("")}
          </div>`;
          ataResults.querySelectorAll("[data-pick-ata]").forEach(item => {
            item.addEventListener("mousedown", (e) => {
              e.preventDefault();
              const m = meetingsSorted.find(x => x.id === item.dataset.pickAta);
              if(m){
                ataHiddenId.value = m.id;
                ataSearch.value = `${meetingLabel(m).title} — ${meetingLabel(m).sub}`;
              }
              ataResults.innerHTML = "";
            });
          });
        }
      }

      function toggleAtaField(){
        if(origemSelect.value === "Reunião CIPA"){
          ataField.style.display = "";
        } else {
          ataField.style.display = "none";
          ataHiddenId.value = "";
          ataSearch.value = "";
          ataResults.innerHTML = "";
        }
      }

      origemSelect.addEventListener("change", toggleAtaField);
      toggleAtaField();

      ataSearch.addEventListener("focus", () => renderResults(ataSearch.value));
      ataSearch.addEventListener("input", () => {
        ataHiddenId.value = "";
        renderResults(ataSearch.value);
      });
      ataSearch.addEventListener("blur", () => {
        setTimeout(() => { ataResults.innerHTML = ""; }, 150);
      });

      ov.querySelector("#cipa-acao-form").addEventListener("submit", async(e)=>{
        e.preventDefault();
        const data = Object.fromEntries(new FormData(e.target));
        if(data.origem !== "Reunião CIPA") data.reuniaoId = "";
        state.cipaActions.push({id:uid("cipaacao"), ...data});
        await saveState(); window.closeModal(); render();
      });
    });
  }

      <form id="emp-form">
        <div class="field"><label>Nome Completo</label><input required name="nome" value="${esc(employee?.nome)}"></div>

          <div class="field"><label>E-mail</label><input type="email" name="email" value="${esc(employee?.email)}" placeholder="nome@empresa.com.br"></div>
        </div>

        <div class="field">
          <label>Foto do Funcionário (opcional)</label>
          <div style="display:flex;align-items:center;gap:12px;">
            <div id="employee-photo-preview">${employee?.foto ? `<img class="employee-photo-preview" src="${employee.foto}" alt="Foto do funcionário">` : `<div class="cipa-candidate-avatar">👤</div>`}</div>
            <div style="flex:1;">
              <input id="employee-photo-file" type="file" accept="image/*">
              <button id="employee-camera-btn" class="btn secondary" type="button" style="margin-top:8px;">📷 Tirar foto com a câmera</button>
              <div style="font-size:11px;color:var(--ink-dim);margin-top:5px;">Você pode escolher uma imagem ou tirar a foto diretamente pela câmera. Esta foto também aparecerá no Terminal de Votação CIPA quando o funcionário for candidato.</div>
            </div>
          </div>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn secondary" onclick="window.closeModal()">Cancelar</button>
          <button type="submit" class="btn">${isEdit ? "Salvar Alterações" : "Cadastrar"}</button>
        </div>
      </form>
    `, (ov)=>{
      let employeePhoto = employee?.foto || "";
      const photoInput = ov.querySelector("#employee-photo-file");
      photoInput?.addEventListener("change", ()=>{
        const file=photoInput.files?.[0];
        if(!file) return;
        if(!file.type.startsWith("image/")){ alert("Selecione um arquivo de imagem."); photoInput.value=""; return; }
        const reader=new FileReader();
        reader.onload=()=>{
          employeePhoto=String(reader.result||"");
          const preview=ov.querySelector("#employee-photo-preview");
          if(preview) preview.innerHTML=`<img class="employee-photo-preview" src="${employeePhoto}" alt="Foto do funcionário">`;
        };
        reader.readAsDataURL(file);
      });

      const cameraBtn = ov.querySelector("#employee-camera-btn");
      let employeeCameraStream = null;

      const stopEmployeeCamera = ()=>{
        if(employeeCameraStream){
          employeeCameraStream.getTracks().forEach(track=>track.stop());
          employeeCameraStream = null;
        }
      };

      cameraBtn?.addEventListener("click", async ()=>{
        if(!navigator.mediaDevices?.getUserMedia){
          alert("Este navegador não oferece acesso à câmera. Use um navegador atualizado em HTTPS ou localhost.");
          return;
        }
        try{
          employeeCameraStream = await navigator.mediaDevices.getUserMedia({
            video:{facingMode:"user"},
            audio:false
          });

          const cameraBox = document.createElement("div");
          cameraBox.id = "employee-camera-box";
          cameraBox.style.cssText = "margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);";
          cameraBox.innerHTML = `
            <div style="font-weight:700;margin-bottom:8px;">📷 Câmera</div>
            <video id="employee-camera-video" autoplay playsinline style="width:100%;max-width:430px;aspect-ratio:4/3;object-fit:cover;border-radius:8px;background:#111;"></video>
            <canvas id="employee-camera-canvas" style="display:none;"></canvas>
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">
              <button class="btn" id="employee-camera-capture" type="button">📸 Capturar foto</button>
              <button class="btn secondary" id="employee-camera-close" type="button">Cancelar</button>
            </div>
          `;
          cameraBtn.parentElement.appendChild(cameraBox);
          cameraBtn.disabled = true;

          const video = cameraBox.querySelector("#employee-camera-video");
          video.srcObject = employeeCameraStream;

          cameraBox.querySelector("#employee-camera-close").addEventListener("click", ()=>{
            stopEmployeeCamera();
            cameraBox.remove();
            cameraBtn.disabled = false;
          });

          cameraBox.querySelector("#employee-camera-capture").addEventListener("click", ()=>{
            if(!video.videoWidth || !video.videoHeight){
              alert("Aguarde a câmera carregar e tente novamente.");
              return;
            }
            const canvas = cameraBox.querySelector("#employee-camera-canvas");
            // Limita o tamanho salvo para não aumentar excessivamente a base local.
            const maxWidth = 640;
            const scale = Math.min(1, maxWidth / video.videoWidth);
            canvas.width = Math.round(video.videoWidth * scale);
            canvas.height = Math.round(video.videoHeight * scale);
            const ctx = canvas.getContext("2d");
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            employeePhoto = canvas.toDataURL("image/jpeg", 0.82);

            const preview = ov.querySelector("#employee-photo-preview");
            if(preview) preview.innerHTML = `<img class="employee-photo-preview" src="${employeePhoto}" alt="Foto do funcionário">`;

            stopEmployeeCamera();
            cameraBox.innerHTML = `
              <div style="font-weight:700;margin-bottom:8px;">✅ Foto capturada</div>
              <img src="${employeePhoto}" alt="Foto capturada" style="width:100%;max-width:300px;border-radius:8px;display:block;margin-bottom:10px;">
              <div style="display:flex;gap:8px;flex-wrap:wrap;">
                <button class="btn" id="employee-camera-use" type="button">✓ Usar esta foto</button>
                <button class="btn secondary" id="employee-camera-retake" type="button">📷 Tirar novamente</button>
              </div>
            `;
            cameraBox.querySelector("#employee-camera-use").addEventListener("click", ()=>{
              cameraBox.remove();
              cameraBtn.disabled = false;
            });
            cameraBox.querySelector("#employee-camera-retake").addEventListener("click", ()=>{
              cameraBox.remove();
              cameraBtn.disabled = false;
              cameraBtn.click();
            });
          });
        }catch(err){
          stopEmployeeCamera();
          cameraBtn.disabled = false;
          alert("Não foi possível acessar a câmera. Verifique se o navegador tem permissão para usar a câmera e se o sistema está sendo aberto por HTTPS ou localhost.");
        }
      });

      ov.querySelector("#emp-form").addEventListener("submit", async(e)=>{
        e.preventDefault();
        const data = Object.fromEntries(new FormData(e.target));

        if(isEdit){
          const idx = state.employees.findIndex(x=>x.id===employeeId);
          if(idx < 0) return;
          state.employees[idx] = { ...state.employees[idx], ...data, foto: employeePhoto };
        } else {
          state.employees.push({id:uid("emp"), ...data, foto: employeePhoto});
        }

        await saveState();
        window.closeModal();
        render();
      });
    });
  }

  function buildCipaVotingReportHtml(election){
    ensureCipaVoteAuth();
    if(!election) return {rows:[]};

    // Eleitores cadastrados na eleição.
    const eligibleRaw = [
      ...(Array.isArray(election.eleitores) ? election.eleitores : []),
      ...(Array.isArray(election.eleitoresAptos) ? election.eleitoresAptos : []),
      ...(Array.isArray(election.voters) ? election.voters : [])
    ];
    const eligibleIds = eligibleRaw.map(x=>typeof x==="object"?(x.employeeId||x.id):x).filter(Boolean);

    // Quem já votou: cobre estruturas novas e antigas do sistema.
    const votedIds=new Set();
    [
      ...(Array.isArray(election.votantesQueVotaram)?election.votantesQueVotaram:[]),
      ...(Array.isArray(election.votedEmployeeIds)?election.votedEmployeeIds:[]),
      ...(Array.isArray(election.votantes)?election.votantes:[])
    ].forEach(x=>{
      const id=typeof x==="object"?(x.employeeId||x.eleitorId||x.id):x;
      if(id) votedIds.add(id);
    });

    // O sistema já possui registros individuais de voto/comparecimento.
    (state.cipaVotes||[]).forEach(v=>{
      if(v && (!v.electionId || v.electionId===election.id)){
        const id=v.employeeId||v.eleitorId||v.voterId;
        if(id) votedIds.add(id);
      }
    });
    (state.cipaRemoteVoting?Object.values(state.cipaRemoteVoting):[]).forEach(v=>{
      if(v?.electionId===election.id && v.voted && v.employeeId) votedIds.add(v.employeeId);
    });
    state.cipaVoteAuth.filter(r=>r.electionId===election.id).forEach(r=>votedIds.add(r.employeeId));

    // Se a versão anterior já computou o voto mas ainda não criou o novo comprovante,
    // cria o código agora, sem associá-lo ao candidato escolhido.
    let changed=false;
    votedIds.forEach(id=>{
      if(!state.cipaVoteAuth.some(r=>r.electionId===election.id && r.employeeId===id)){
        const voter=(state.employees||[]).find(e=>e.id===id);
        if(voter){ createCipaVoteAuth(election,voter); changed=true; }
      }
    });
    if(changed) saveState();

    const ids=Array.from(new Set([...eligibleIds,...votedIds]));
    return {rows:ids.map(id=>{
      const emp=(state.employees||[]).find(e=>e.id===id);
      const auth=state.cipaVoteAuth.find(r=>r.electionId===election.id && r.employeeId===id);
      const voted=votedIds.has(id)||!!auth;
      return {
        nome:emp?.nome||"—",
        matricula:emp?.matricula||"—",
        status:voted?"Votou":"Pendente",
        codigo:voted?(auth?.code||"Código não localizado"):"—",
        data:auth?.createdAt?new Date(auth.createdAt).toLocaleString("pt-BR"):"—"
      };
    })};
  }

          const oneDayInput = ov.querySelector('#annual-status-one-day');
          const rangeStart = ov.querySelector('#annual-status-range-start');
          const rangeEnd = ov.querySelector('#annual-status-range-end');
          const datesList = ov.querySelector('#annual-status-specific-dates');
          const addBtn = ov.querySelector('#annual-status-add-date');

          typeEl.value = initial.periodoTipo || 'dia';
          let initialDates = getAnnualPlanDates(initial);

          const addRow = (value='')=>{
            const row = document.createElement('div');
            row.style.cssText='display:flex;gap:8px;align-items:center;margin-bottom:7px;';
            row.innerHTML=`<input type="date" class="annual-status-specific-date" value="${value}" style="flex:1;"><button type="button" class="btn secondary annual-status-remove-date" style="width:auto;padding:7px 10px;">Remover</button>`;
            row.querySelector('.annual-status-remove-date').addEventListener('click',()=>{row.remove();sync();});
            datesList.appendChild(row);
          };
          const sync=()=>{
            const t=typeEl.value;
            oneDayBox.style.display=t==='dia'?'block':'none';
            rangeBox.style.display=t==='periodo'?'block':'none';
            datesBox.style.display=t==='dias'?'block':'none';
            oneDayInput.required=t==='dia';
            rangeStart.required=t==='periodo';
            rangeEnd.required=t==='periodo';
            ov.querySelectorAll('.annual-status-specific-date').forEach(i=>i.required=t==='dias');
          };
          if(typeEl.value==='dia'){
            oneDayInput.value=initialDates[0] || initial.dataInicio || '';
          }else if(typeEl.value==='periodo'){
            rangeStart.value=initial.dataInicio || initialDates[0] || '';
            rangeEnd.value=initial.dataFim || initialDates[initialDates.length-1] || '';
          }else{
            (initialDates.length ? initialDates : ['']).forEach(d=>addRow(d));
          }
          typeEl.addEventListener('change',sync);
          addBtn.addEventListener('click',()=>{addRow('');sync();});
          sync();

          ov.querySelector('#annual-status-period-form').addEventListener('submit', async ev=>{
            ev.preventDefault();
            const t=typeEl.value;
            let periodData;
            if(t==='dia'){
              if(!oneDayInput.value){alert('Informe o dia do treinamento.');return;}
              periodData={periodoTipo:'dia',dataInicio:oneDayInput.value,dataFim:oneDayInput.value,datasRealizacao:[oneDayInput.value]};
            }else if(t==='periodo'){
              if(!rangeStart.value || !rangeEnd.value){alert('Informe a data inicial e a data final.');return;}
              if(rangeEnd.value < rangeStart.value){alert('A data final não pode ser anterior à data inicial.');return;}
              periodData={periodoTipo:'periodo',dataInicio:rangeStart.value,dataFim:rangeEnd.value,datasRealizacao:[]};
            }else{
              const vals=[...new Set(Array.from(ov.querySelectorAll('.annual-status-specific-date')).map(i=>i.value).filter(Boolean))].sort();
              if(!vals.length){alert('Informe pelo menos um dia específico.');return;}
              periodData={periodoTipo:'dias',dataInicio:vals[0],dataFim:vals[vals.length-1],datasRealizacao:vals};
            }
            plan.status='Agendado';
            Object.assign(plan,periodData);
            await saveState();
            window.closeModal();
            render();
          });
        });
        return;
      }

      plan.status = newStatus;
      if(newStatus === 'Realizado' && currentUser?.role === 'Usuario') {
        plan.realizadoBloqueado = true;
        plan.realizadoPor = currentUser.id;
        plan.realizadoEm = new Date().toISOString();
      }
      if(newStatus !== 'Agendado'){
        delete plan.dataInicio;
        delete plan.dataFim;
        delete plan.datasRealizacao;
        delete plan.periodoTipo;
      }
      await saveState();
      render();
    }));

  // Detecta se a página foi aberta por um link de votação remota da CIPA
  // (enviado via WhatsApp/E-mail), caso em que a votação é exibida sem login.
  function isRemoteVoteMode(){
    return new URLSearchParams(window.location.search).get("votarCipa") === "1";
  }

  // ===== VOTAÇÃO CIPA REMOTA INTEGRADA =====
  function ensureCipaVoteAuth(){
    if(!Array.isArray(state.cipaVoteAuth)) state.cipaVoteAuth=[];
  }
  function createCipaVoteAuth(election,voter){
    ensureCipaVoteAuth();
    let rec=state.cipaVoteAuth.find(r=>r.electionId===election.id && r.employeeId===voter.id);
    if(rec) return rec;
    const bytes=new Uint8Array(8);
    if(window.crypto?.getRandomValues) window.crypto.getRandomValues(bytes);
    else for(let i=0;i<bytes.length;i++) bytes[i]=Math.floor(Math.random()*256);
    rec={
      id:uid("authvote"),
      electionId:election.id,
      employeeId:voter.id,
      code:"CIPA-"+Array.from(bytes).map(b=>b.toString(16).padStart(2,"0")).join("").toUpperCase(),
      createdAt:new Date().toISOString()
    };
    state.cipaVoteAuth.push(rec);
    return rec;
  }
  function cipaVoteAuthText(election,voter,rec){
    return `Comprovante de Votação CIPA\nGestão: ${election.gestao||"—"}\nEleitor: ${voter.nome||"—"}\nCódigo de autenticação: ${rec.code}\nData/Hora: ${new Date(rec.createdAt).toLocaleString("pt-BR")}\n\nO código comprova o registro do voto sem identificar o candidato escolhido.`;
  }
  function deliverCipaVoteAuth(election,voter,rec){
    const msg=cipaVoteAuthText(election,voter,rec);
    const phone=String(voter.telefone||voter.celular||"").replace(/\D/g,"");
    if(phone) window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`,"_blank");
    if(voter.email) setTimeout(()=>{ location.href=`mailto:${encodeURIComponent(voter.email)}?subject=${encodeURIComponent("Código de autenticação do voto CIPA")}&body=${encodeURIComponent(msg)}`; },500);
  }

  function ensureCipaRemoteVotingState(){
    if(!state.cipaRemoteVoting || typeof state.cipaRemoteVoting !== "object") state.cipaRemoteVoting = {};
  }

  function getActiveCipaElection(){
    const elections = Array.isArray(state.cipaElections) ? state.cipaElections : [];
    return elections.find(e => e.urnaAberta === true || e.status === "Aberta" || e.status === "Em andamento")
      || elections.slice().sort((a,b)=>String(b.id||"").localeCompare(String(a.id||"")))[0]
      || null;
  }

  function getCipaRemoteToken(electionId, employeeId){
    ensureCipaRemoteVotingState();
    const key = `${electionId}::${employeeId}`;
    if(!state.cipaRemoteVoting[key]){
      state.cipaRemoteVoting[key] = {
        token: "cipa_" + Math.random().toString(36).slice(2) + Date.now().toString(36),
        electionId, employeeId, voted:false, sentAt:null, votedAt:null
      };
    }
    return state.cipaRemoteVoting[key];
  }

  function buildCipaRemoteVotingUrl(electionId, employeeId){
    const rec = getCipaRemoteToken(electionId, employeeId);
    const base = location.href.split("#")[0].split("?")[0];
    return `${base}?cipaVote=${encodeURIComponent(rec.token)}#cipa-terminal`;
  }

  function findCipaRemoteVoteByToken(token){
    ensureCipaRemoteVotingState();
    return Object.values(state.cipaRemoteVoting).find(r => r && r.token === token) || null;
  }

  function cipaVoterHasVoted(election, employeeId){
    if(!election) return false;
    ensureCipaRemoteVotingState();
    const key = `${election.id}::${employeeId}`;
    if(state.cipaRemoteVoting[key]?.voted) return true;
    const voted = Array.isArray(election.votantesQueVotaram) ? election.votantesQueVotaram : [];
    return voted.includes(employeeId);
  }

  function registerCipaVoterAsVoted(election, employeeId, tokenRecord){
    if(!election) return;
    if(!Array.isArray(election.votantesQueVotaram)) election.votantesQueVotaram = [];
    if(!election.votantesQueVotaram.includes(employeeId)) election.votantesQueVotaram.push(employeeId);
    if(tokenRecord){
      tokenRecord.voted = true;
      tokenRecord.votedAt = new Date().toISOString();
    }
  }

  function openCipaRemoteTerminal(token){
    const remote = findCipaRemoteVoteByToken(token);
    if(!remote){
      alert("Link de votação inválido ou não localizado.");
      return;
    }
    const election = (state.cipaElections || []).find(e=>e.id===remote.electionId);
    const voter = (state.employees || []).find(e=>e.id===remote.employeeId);
    if(!election || !voter){
      alert("Não foi possível localizar a eleição ou o eleitor deste link.");
      return;
    }
    if(remote.voted || cipaVoterHasVoted(election, voter.id)){
      openModal(`<h3>🗳️ Terminal de Votação CIPA</h3>
        <div class="empty">✅ Seu voto já foi registrado. Este link não possui mais voto pendente.</div>
        <div class="modal-actions"><button class="btn secondary" type="button" onclick="closeModal()">Fechar</button></div>`);
      return;
    }
    const candidates = Array.isArray(election.candidatos) ? election.candidatos : [];
    const candidateRows = candidates.map(c=>{
      const id = typeof c === "string" ? c : (c.employeeId || c.id);
      const emp = (state.employees || []).find(e=>e.id===id);
      const name = emp?.nome || c.nome || "Candidato";
      return `<label style="display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:8px;margin:7px 0;cursor:pointer;">
        <input type="radio" name="cipa-remote-candidate" value="${id}" style="width:auto;margin:0;" required>
        <strong>${name}</strong>
      </label>`;
    }).join("");

    openModal(`<h3>🗳️ Terminal de Votação CIPA</h3>
      <div style="margin-bottom:12px;">Eleitor: <strong>${voter.nome}</strong></div>
      <div style="font-size:12px;color:var(--ink-dim);margin-bottom:12px;">Selecione um candidato e confirme. O voto será computado e este eleitor deixará automaticamente a lista de pendentes.</div>
      <form id="cipa-remote-vote-form">
        ${candidateRows || `<div class="empty">Nenhum candidato cadastrado nesta eleição.</div>`}
        ${candidateRows ? `<div class="modal-actions"><button class="btn" type="submit">Confirmar Voto</button></div>` : ""}
      </form>`);

    document.querySelector("#cipa-remote-vote-form")?.addEventListener("submit", async ev=>{
      ev.preventDefault();
      if(remote.voted || cipaVoterHasVoted(election, voter.id)){
        alert("Este eleitor já registrou voto nesta eleição.");
        return;
      }
      const chosen = new FormData(ev.currentTarget).get("cipa-remote-candidate");
      if(!chosen) return;
      if(!election.votos || typeof election.votos !== "object") election.votos = {};
      election.votos[chosen] = Number(election.votos[chosen] || 0) + 1;
      registerCipaVoterAsVoted(election, voter.id, remote);
      const authReceipt=createCipaVoteAuth(election,voter);
      await saveState();
      window.closeModal();
      openModal(`<h3>🗳️ Terminal de Votação CIPA</h3>
        <div class="empty">
          ✅ Voto registrado com sucesso. Você não está mais pendente de voto.<br><br>
          <strong>Código de autenticação do voto</strong><br>
          <span style="font-size:20px;font-weight:800;letter-spacing:1px;">${authReceipt.code}</span><br><br>
          <small>Este código comprova o registro do voto e não identifica o candidato escolhido.</small>
        </div>
        <div class="modal-actions">
          <button class="btn secondary" type="button" onclick="closeModal()">Fechar</button>
        </div>`);
      deliverCipaVoteAuth(election,voter,authReceipt);
      render();
    });
  }

  function checkCipaRemoteVotingLink(){
    const params = new URLSearchParams(location.search);
    const token = params.get("cipaVote");
    if(token) setTimeout(()=>openCipaRemoteTerminal(token), 250);
  }

  function render(){
    if(!loaded) {
      loadState();
      return;
    }
    if(isRemoteVoteMode()){
      const params = new URLSearchParams(window.location.search);
      renderRemoteVoteScreen(params.get("eleicaoId"), params.get("eleitorId"), params.get("canal") || "whatsapp");
      return;
    }
    // Persiste a posição de navegação deste navegador (módulo/aba atuais),
    // já que salvar dados pode republicar/recarregar a página inteira.
    try{
      sessionStorage.setItem(NAV_SESSION_KEY, JSON.stringify({ currentModule, currentTab, currentVotacaoElectionId }));
    }catch(e){}
    renderShell();
  }

  window.addEventListener("DOMContentLoaded", () => {
    loadState();
  });

})();
</script>

<script>
  // Registra o Service Worker (permite instalar como app / funcionar
  // parcialmente offline). Só roda quando o arquivo está hospedado em
  // http(s) — em file:// ou dentro do preview do Claude o navegador não
  // suporta Service Worker, então falha silenciosamente sem afetar o app.
  if("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")){
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("service-worker.js").catch(() => {});
      else if(currentTab === "geral-setores") renderGeneralSectors(main);
      else if(currentTab === "geral-cargos") renderGeneralJobs(main);
    });
  }

  window.addEventListener("load", checkCipaRemoteVotingLink);
</script>
