  function openCipaCalendarPlanModal(gestao){
    ensureCipaCalendar();
    const existing=state.cipaMeetingCalendar
      .filter(r=>r.gestao===gestao && r.tipo==="Ordinária")
      .sort((a,b)=>a.data.localeCompare(b.data));

    const yearMatch=String(gestao||"").match(/\d{4}/);
    const baseYear=yearMatch ? Number(yearMatch[0]) : new Date().getFullYear();

    const toISO=(y,m,d)=>{
      const dt=new Date(y,m,d,12,0,0);
      return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;
    };
    const nextBusinessDay=(iso)=>{
      if(!iso) return "";
      const [y,m,d]=iso.split("-").map(Number);
      const dt=new Date(y,m-1,d,12,0,0);
      while(dt.getDay()===0 || dt.getDay()===6) dt.setDate(dt.getDate()+1);
      return toISO(dt.getFullYear(),dt.getMonth(),dt.getDate());
    };
    const make12Dates=(firstISO)=>{
      if(!firstISO) return [];
      const [y,m,d]=firstISO.split("-").map(Number);
      const out=[];
      for(let i=0;i<12;i++){
        const targetMonth=(m-1)+i;
        const yy=y+Math.floor(targetMonth/12);
        const mm=((targetMonth%12)+12)%12;
        const lastDay=new Date(yy,mm+1,0,12,0,0).getDate();
        const safeDay=Math.min(d,lastDay);
        out.push(nextBusinessDay(toISO(yy,mm,safeDay)));
      }
      return out;
    };

    const initial=existing.length ? existing.map(x=>x.data) : [];

    openModal(`<h3>📅 Calendário de Reuniões · Gestão ${gestao}</h3>
      <div class="sub" style="margin-bottom:14px;">
        Escolha como deseja programar as reuniões ordinárias. Se uma data cair em sábado ou domingo,
        o sistema moverá automaticamente para o próximo dia útil.
      </div>

      <div class="calendar-mode-box">
        <label class="calendar-mode-option">
          <input type="radio" name="calendarMode" value="monthly" checked>
          <span><strong>📆 Definir mês a mês</strong><small>Escolha manualmente a data de cada reunião.</small></span>
        </label>
        <label class="calendar-mode-option">
          <input type="radio" name="calendarMode" value="annual">
          <span><strong>🗓️ Repetir por 12 meses</strong><small>Escolha a primeira data e o sistema programa os 12 meses seguintes.</small></span>
        </label>
      </div>

      <form id="cipa-calendar-form">
        <div id="calendar-monthly-mode">
          <div id="cipa-calendar-date-list">
            ${(initial.length?initial:[""]).map((d,i)=>`<div class="field-row cipa-date-row">
              <div class="field"><label>${i+1}ª reunião ordinária</label><input type="date" name="datas" value="${d}"></div>
              <button type="button" class="btn secondary cipa-remove-date" style="align-self:end;">Remover</button>
            </div>`).join("")}
          </div>
          <button type="button" class="btn secondary" id="cipa-add-date">+ Adicionar mês/data</button>
        </div>

        <div id="calendar-annual-mode" style="display:none;">
          <div class="field-row">
            <div class="field">
              <label>Primeira data da sequência de 12 meses</label>
              <input type="date" id="cipa-first-annual-date" value="${initial[0]||`${baseYear}-01-01`}">
            </div>
          </div>
          <div class="calendar-business-note">💼 Sábado ou domingo → próximo dia útil (segunda-feira).</div>
          <div id="cipa-annual-preview"></div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button>
          <button class="btn" type="submit">Salvar Calendário</button>
        </div>
      </form>`,ov=>{
        const monthly=ov.querySelector("#calendar-monthly-mode");
        const annual=ov.querySelector("#calendar-annual-mode");
        const list=ov.querySelector("#cipa-calendar-date-list");
        const firstAnnual=ov.querySelector("#cipa-first-annual-date");
        const preview=ov.querySelector("#cipa-annual-preview");

        const renumber=()=>list.querySelectorAll(".cipa-date-row label").forEach((l,i)=>l.textContent=`${i+1}ª reunião ordinária`);
        const adjustInput=(input)=>{
          if(!input.value) return;
          const adjusted=nextBusinessDay(input.value);
          if(adjusted!==input.value){
            input.value=adjusted;
            alert("A data selecionada caiu em um final de semana e foi transferida para o próximo dia útil.");
          }
        };
        const wireRows=()=>{
          list.querySelectorAll('input[name="datas"]').forEach(inp=>inp.onchange=()=>adjustInput(inp));
          list.querySelectorAll(".cipa-remove-date").forEach(b=>b.onclick=()=>{
            b.closest(".cipa-date-row").remove();renumber();
          });
        };
        const renderPreview=()=>{
          const dates=make12Dates(firstAnnual.value);
          preview.innerHTML=dates.length?`<div class="annual-preview-grid">${dates.map((d,i)=>`
            <div class="annual-preview-item"><strong>${i+1}º mês</strong><span>${fmtDate(d)}</span></div>`).join("")}</div>`:"";
        };

        wireRows();
        renderPreview();

        ov.querySelectorAll('input[name="calendarMode"]').forEach(r=>r.onchange=()=>{
          const isAnnual=r.value==="annual" && r.checked;
          if(r.checked){
            monthly.style.display=isAnnual?"none":"block";
            annual.style.display=isAnnual?"block":"none";
            if(isAnnual) renderPreview();
          }
        });

        ov.querySelector("#cipa-add-date").onclick=()=>{
          list.insertAdjacentHTML("beforeend",`<div class="field-row cipa-date-row">
            <div class="field"><label>Nova reunião</label><input type="date" name="datas"></div>
            <button type="button" class="btn secondary cipa-remove-date" style="align-self:end;">Remover</button>
          </div>`);
          wireRows();renumber();
        };

        firstAnnual.onchange=()=>{
          firstAnnual.value=nextBusinessDay(firstAnnual.value);
          renderPreview();
        };

        ov.querySelector("#cipa-calendar-form").onsubmit=async e=>{
          e.preventDefault();
          const mode=ov.querySelector('input[name="calendarMode"]:checked').value;
          let dates;
          if(mode==="annual"){
            if(!firstAnnual.value){alert("Escolha a primeira data.");return;}
            dates=make12Dates(firstAnnual.value);
          }else{
            dates=[...e.target.querySelectorAll('input[name="datas"]')]
              .map(x=>nextBusinessDay(x.value)).filter(Boolean);
            if(!dates.length){alert("Adicione pelo menos uma data.");return;}
          }

          dates=Array.from(new Set(dates)).sort();
          state.cipaMeetingCalendar=state.cipaMeetingCalendar.filter(r=>!(r.gestao===gestao&&r.tipo==="Ordinária"));
          dates.forEach((data,i)=>state.cipaMeetingCalendar.push({
            id:uid("cipacal"),gestao,data,tipo:"Ordinária",
            titulo:`${i+1}ª Reunião Ordinária`,
            observacoes:i===0?"Primeira reunião da gestão":""
          }));
          await saveState();closeModal();render();
        };
      });
  }

  function ensureCipaCauseAnalysis(){
    if(!Array.isArray(state.cipaCauseAnalyses)) state.cipaCauseAnalyses=[];
  }
  function getMeetingCAT(meeting){
    if(!meeting) return null;
    const calendar=(state.cipaMeetingCalendar||[]).find(r=>r.id===meeting.calendarId);
    const catId=meeting.catId || calendar?.catId;
    return catId ? (state.cipaCATs||[]).find(c=>c.id===catId) : null;
  }
  function fishboneCauses(analysis){
    if(!analysis) return [];
    const groups=[
      ["Método",analysis.metodo],["Máquina / Equipamento",analysis.maquina],
      ["Mão de obra / Pessoas",analysis.maoDeObra],["Material",analysis.material],
      ["Meio ambiente",analysis.meioAmbiente],["Medição / Controle",analysis.medicao]
    ];
    return groups.flatMap(([grupo,texto])=>(texto||"").split("\n").map(x=>x.trim()).filter(Boolean).map((texto,i)=>({
      id:`${analysis.id}-${grupo}-${i}`,grupo,texto
    })));
  }
  function openFishboneAnalysis(meetingId, afterSave){
    ensureCipaCauseAnalysis();
    const meeting=(state.cipaMeetings||[]).find(m=>m.id===meetingId);
    const cat=getMeetingCAT(meeting);
    if(!meeting||!cat){ if(afterSave) afterSave(); return; }
    let a=state.cipaCauseAnalyses.find(x=>x.meetingId===meetingId);
    if(!a) a={id:uid("fish"),meetingId,catId:cat.id,metodo:"",maquina:"",maoDeObra:"",material:"",meioAmbiente:"",medicao:"",causaRaiz:"",conclusao:""};
    openModal(`<h3>🐟 Análise de Causa · Espinha de Peixe</h3>
      <div class="cat-form-note"><strong>${cat.numeroInterno}</strong> · ${catEmployeeName(cat.employeeId)} · acidente em ${fmtDate(cat.dataAcidente)}. Registre causas potenciais por categoria; uma causa por linha facilita o vínculo com o Plano de Ação.</div>
      <form id="fishbone-form">
        <div class="fishbone-diagram">
          <div class="fishbone-row top">
            <div class="fish-cause"><strong>📋 Método</strong><textarea name="metodo" rows="3" placeholder="Procedimento, instrução, sequência de trabalho...">${a.metodo||""}</textarea></div>
            <div class="fish-cause"><strong>⚙️ Máquina / Equipamento</strong><textarea name="maquina" rows="3" placeholder="Máquina, ferramenta, proteção, manutenção...">${a.maquina||""}</textarea></div>
            <div class="fish-cause"><strong>👷 Pessoas</strong><textarea name="maoDeObra" rows="3" placeholder="Treinamento, comunicação, comportamento, aptidão...">${a.maoDeObra||""}</textarea></div>
          </div>
          <div class="fishbone-spine"><span>CAUSAS</span><div></div><strong>➡️ ACIDENTE / EVENTO</strong></div>
          <div class="fishbone-row bottom">
            <div class="fish-cause"><strong>📦 Material</strong><textarea name="material" rows="3" placeholder="Matéria-prima, insumo, condição do material...">${a.material||""}</textarea></div>
            <div class="fish-cause"><strong>🌦️ Meio ambiente</strong><textarea name="meioAmbiente" rows="3" placeholder="Iluminação, ruído, piso, clima, organização...">${a.meioAmbiente||""}</textarea></div>
            <div class="fish-cause"><strong>📏 Medição / Controle</strong><textarea name="medicao" rows="3" placeholder="Inspeção, indicador, verificação, controle...">${a.medicao||""}</textarea></div>
          </div>
        </div>
        <div class="field"><label>Causa(s) raiz identificada(s)</label><textarea name="causaRaiz" rows="3" required>${a.causaRaiz||""}</textarea></div>
        <div class="field"><label>Conclusão da análise</label><textarea name="conclusao" rows="3">${a.conclusao||""}</textarea></div>
        <div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">Fechar</button><button class="btn" type="submit">Salvar Análise de Causa</button></div>
      </form>`,ov=>{
        ov.querySelector("#fishbone-form").onsubmit=async e=>{
          e.preventDefault(); const data=Object.fromEntries(new FormData(e.target));
          Object.assign(a,data,{meetingId,catId:cat.id,updatedAt:new Date().toISOString()});
          const idx=state.cipaCauseAnalyses.findIndex(x=>x.meetingId===meetingId);
          if(idx>=0) state.cipaCauseAnalyses[idx]=a; else state.cipaCauseAnalyses.push(a);
          await saveState(); closeModal(); if(afterSave) afterSave(); else render();
        };
      });
  }

      ov.querySelector("#edit-cipa-action-form").onsubmit=async e=>{
        e.preventDefault(); const data=Object.fromEntries(new FormData(e.target));
        Object.assign(a,data,{updatedAt:new Date().toISOString()});
        const meeting=(state.cipaMeetings||[]).find(m=>m.id===data.meetingId);
        if(meeting) a.dataOrigem=meeting.dataReuniao;
        await saveState(); closeModal(); render();
      };
    });
  }

  function renderCipaAcoes(root){
    const origins=Array.from(new Set((state.cipaActions||[]).map(a=>a.origem).filter(Boolean))).sort();
    const owners=Array.from(new Set((state.cipaActions||[]).map(a=>a.responsavelId).filter(Boolean)))
      .map(id=>(state.employees||[]).find(e=>e.id===id)).filter(Boolean).sort((a,b)=>a.nome.localeCompare(b.nome));

    root.innerHTML = `
      <div class="page-head">
        <div>
          <h2>🎯 Plano de Ação da CIPA</h2>
          <div class="sub">Itens de melhoria oriundos de reuniões, mapa de risco e inspeções de segurança.</div>
        </div>
        ${checkPermission("Master") ? `<button class="btn" id="btn-new-cipa-acao">+ Nova Ação</button>` : ""}
      </div>

      <div class="panel cipa-action-filter-panel">
        <div class="panel-head"><h3>🔎 Filtros e Pesquisa</h3><button class="btn secondary" type="button" id="cipa-action-clear">Limpar filtros</button></div>
        <div class="cipa-action-page-filters">
          <div class="field search"><label>Pesquisar</label><input id="cipa-action-search" placeholder="Pesquisar ação, responsável ou observação..."></div>
          <div class="field"><label>Origem</label><select id="cipa-action-origin"><option value="">Todas as origens</option>${origins.map(o=>`<option value="${o}">${o}</option>`).join("")}</select></div>
          <div class="field"><label>Situação</label><select id="cipa-action-status"><option value="">Todas as situações</option><option value="A vencer">A vencer</option><option value="Atrasada">Atrasada</option><option value="Concluída">Concluída</option></select></div>
          <div class="field"><label>Responsável</label><select id="cipa-action-owner"><option value="">Todos</option>${owners.map(e=>`<option value="${e.id}">${e.nome}</option>`).join("")}</select></div>
          <div class="field"><label>Prazo inicial</label><input type="date" id="cipa-action-from"></div>
          <div class="field"><label>Prazo final</label><input type="date" id="cipa-action-to"></div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head"><h3>📋 Ações cadastradas</h3><span id="cipa-action-count" class="panel-note"></span></div>
        <div id="cipa-action-results"></div>
      </div>
    `;

    const applyFilters=()=>{
      const q=(root.querySelector("#cipa-action-search")?.value||"").trim().toLowerCase();
      const origin=root.querySelector("#cipa-action-origin")?.value||"";
      const status=root.querySelector("#cipa-action-status")?.value||"";
      const owner=root.querySelector("#cipa-action-owner")?.value||"";
      const from=root.querySelector("#cipa-action-from")?.value||"";
      const to=root.querySelector("#cipa-action-to")?.value||"";

      const rows=(state.cipaActions||[]).filter(a=>{
        const realStatus=a.status==="Concluída" ? "Concluída" : (cipaActionStatus(a)==="bad" ? "Atrasada" : "A vencer");
        const text=[a.descricao,a.origem,a.observacoes,employeeName(a.responsavelId)].filter(Boolean).join(" ").toLowerCase();
        return (!q||text.includes(q)) && (!origin||a.origem===origin) && (!status||realStatus===status)
          && (!owner||a.responsavelId===owner) && (!from||(a.prazo||"")>=from) && (!to||(a.prazo||"")<=to);
      });
      root.querySelector("#cipa-action-results").innerHTML=renderCipaActionsTable(rows,checkPermission("Master"));
      root.querySelector("#cipa-action-count").textContent=`${rows.length} de ${(state.cipaActions||[]).length} ação(ões)`;
    };

    root.querySelector("#cipa-action-search")?.addEventListener("input",applyFilters);
    ["#cipa-action-origin","#cipa-action-status","#cipa-action-owner","#cipa-action-from","#cipa-action-to"].forEach(sel=>root.querySelector(sel)?.addEventListener("change",applyFilters));
    root.querySelector("#cipa-action-clear")?.addEventListener("click",()=>{
      ["#cipa-action-search","#cipa-action-origin","#cipa-action-status","#cipa-action-owner","#cipa-action-from","#cipa-action-to"].forEach(sel=>{const el=root.querySelector(sel);if(el)el.value="";});
      applyFilters();
    });
    root.addEventListener("click",async ev=>{
      const edit=ev.target.closest(".cipa-action-edit");
      if(edit){ openCipaActionEdit(edit.dataset.id); return; }
      const done=ev.target.closest(".cipa-action-done");
      if(done){
        const a=(state.cipaActions||[]).find(x=>x.id===done.dataset.id);
        if(a){a.status="Concluída";a.concluidaEm=new Date().toISOString();await saveState();render();}
        return;
      }
      const rem=ev.target.closest(".cipa-action-remove");
      if(rem && confirm("Remover esta ação?")){
        state.cipaActions=(state.cipaActions||[]).filter(x=>x.id!==rem.dataset.id);await saveState();render();
      }
    });
    applyFilters();
  }


  function getCipaActionMeeting(action){
    if(!action) return null;
    if(action.meetingId) return (state.cipaMeetings||[]).find(m=>m.id===action.meetingId)||null;
    if(action.reuniaoId) return (state.cipaMeetings||[]).find(m=>m.id===action.reuniaoId)||null;
    // Retrocompatibilidade: ações antigas de "Reunião CIPA" podem ter a data da ata na origem.
    if((action.origem||"").toLowerCase().includes("reuni")){
      const date=action.dataOrigem||action.dataReuniao||action.createdAt?.slice(0,10);
      if(date) return (state.cipaMeetings||[]).find(m=>m.dataReuniao===date)||null;
    }
    return null;
  }
  function cipaMeetingLabel(meeting){
    if(!meeting) return "—";
    const tipo=meeting.tipo||"Reunião CIPA";
    return `${tipo} · ${fmtDate(meeting.dataReuniao)}${meeting.gestao?` · Gestão ${meeting.gestao}`:""}`;
  }

  function renderCipaActionsTable(list, allowActions=false){
    if(list.length === 0) return `<div class="empty">Nenhuma ação cadastrada neste filtro.</div>`;
    return `
      <table>
        <thead><tr><th>Ação</th><th>Origem</th><th>Ata vinculada</th><th>Responsável</th><th>Prazo</th><th>Situação</th>${allowActions?'<th>Ações</th>':''}</tr></thead>
        <tbody>
          ${list.map(a=>{
            const st=cipaActionStatus(a);
            const dleft=daysUntil(a.prazo);
            const stLabel=a.status==="Concluída"?"Concluída":st==="bad"?`Atrasada ${Math.abs(dleft)}d`:st==="warn"?`Prazo em ${dleft}d`:"A vencer";
            const meeting=getCipaActionMeeting(a);
            const cause=a.causeRef?a.causeRef.split("|||").slice(1).join(" · "):"";
            return `<tr>
              <td><strong>${a.descricao}</strong>${cause?`<br><small class="cause-link-label">🔗 Causa: ${cause}</small>`:""}</td>
              <td>${a.origem||"—"}${a.dataOrigem?`<br><small>Ata de <strong>${fmtDate(a.dataOrigem)}</strong></small>`:""}</td>
              <td>${meeting?`<strong>📝 ${cipaMeetingLabel(meeting)}</strong><br><small>${meeting.pauta||""}</small>`:(a.origem||"").toLowerCase().includes("reuni")?'<span class="badge warn">Ata não identificada</span>':"—"}</td>
              <td>${employeeName(a.responsavelId)}</td>
              <td>${fmtDate(a.prazo)}</td>
              <td><span class="badge ${a.status==="Concluída"?"ok":st}">● ${stLabel}</span></td>
              ${allowActions?`<td class="action-buttons"><button class="btn secondary cipa-action-edit" data-id="${a.id}">✏️ Editar</button> ${a.status!=="Concluída"?`<button class="btn secondary cipa-action-done" data-id="${a.id}">Concluir</button>`:""} <button type="button" class="btn secondary cipa-action-remove" data-id="${a.id}">🗑️ Remover</button></td>`:""}
            </tr>`;
          }).join("")}
        </tbody>
      </table>`;
  }

  function openRoleMatrixModal(matrixId=null){
    const registro = matrixId ? (state.roleMatrix || []).find(x=>x.id===matrixId) : null;
    const cargosUnicos = Array.from(new Set([...state.employees.map(e => e.cargo).filter(Boolean), ...(registro?.cargo?[registro.cargo]:[])]));
    
    openModal(`
      <h3>${registro?'Editar':'Vincular'} Procedimento / Treinamento por Função</h3>
      <form id="role-matrix-form">
        <div class="field">
          <label>Cargo / Função</label>
          ${cargosUnicos.length > 0 ? `
            <select name="cargoSelect" id="cargoSelect">
              ${cargosUnicos.map(c=>`<option value="${c}" ${registro?.cargo===c?'selected':''}>${c}</option>`).join("")}
              <option value="__OUTRO__">+ Informar outro cargo...</option>

        <div class="modal-actions">
          <button type="button" class="btn secondary" onclick="window.closeModal()">Cancelar</button>
          <button type="submit" class="btn">${registro?'Salvar Alterações':'Salvar na Matriz'}</button>
        </div>

    `, (ov)=>{
      const cargoSel = ov.querySelector("#cargoSelect");
      const cargoCust = ov.querySelector("#cargoCustom");
      if(cargoSel && cargoCust){
        cargoSel.addEventListener("change", ()=>{
          cargoCust.style.display = cargoSel.value === "__OUTRO__" ? "block" : "none";
          if(cargoSel.value === "__OUTRO__") cargoCust.required = true;
          else cargoCust.required = false;
        });
      }

      ov.querySelector("#role-matrix-form").addEventListener("submit", async(e)=>{
        e.preventDefault();
        const formData = Object.fromEntries(new FormData(e.target));
        let cargoFinal = formData.cargo;
        if(cargoSel){
          cargoFinal = cargoSel.value === "__OUTRO__" ? formData.cargoCustom : cargoSel.value;
        }

        const entryData = {
          cargo: cargoFinal,
          procedimento: formData.procedimento,
          tipo: formData.tipo,
          cargaHoraria: formData.cargaHoraria,
          reciclagemMeses: formData.reciclagemMeses ? Number(formData.reciclagemMeses) : null,
          descricao: formData.descricao
        };

        if(!state.roleMatrix) state.roleMatrix = [];
        if(registro) Object.assign(registro,entryData);
        else state.roleMatrix.push({id:uid("mtx"),...entryData});
        await saveState(); window.closeModal(); render();
      });
    });
  }

        </div>
      </form>
    `, (ov)=>{
      ov.querySelector("#train-form").addEventListener("submit", async(e)=>{
        e.preventDefault();
        const data = Object.fromEntries(new FormData(e.target));
        data.dataVencimento = addMonths(data.dataRealizacao, data.validadeMeses);
        const trainingId=uid("tr");
        state.trainings.push({id:trainingId, ...data});

        const employee=(state.employees||[]).find(x=>x.id===data.employeeId);
        if(!Array.isArray(state.annualTrainingPlan)) state.annualTrainingPlan=[];
        const alreadyScheduled=state.annualTrainingPlan.some(p=>
          p.autoSourceTrainingId===trainingId ||
          (p.treinamento===data.curso &&
           String(p.dataPrevista||'')===String(data.dataVencimento||'') &&
           Array.isArray(p.participantes) && p.participantes.includes(data.employeeId))
        );
        if(data.dataVencimento && !alreadyScheduled){
          const due=new Date(data.dataVencimento+'T00:00:00');
          state.annualTrainingPlan.push({
            id:uid('plan'),
            ano:due.getFullYear(),
            mes:due.getMonth()+1,
            treinamento:data.curso,
            norma:'Reciclagem automática',
            publico:employee?.cargo||'—',
            participantes:[data.employeeId],
            responsavel:data.entidade||'',
            cargaHoraria:data.cargaHoraria||'',
            modalidade:'Reciclagem',
            status:'Planejado',
            dataPrevista:data.dataVencimento,
            observacoes:`Planejamento automático gerado pela validade do treinamento realizado em ${fmtDate(data.dataRealizacao)}.`,
            autoSourceTrainingId:trainingId
          });
        }
        await saveState(); window.closeModal(); render();
      });
    });
  }

          selectAll.indeterminate = selected > 0 && selected < checks.length;

      };

      if(selectAll){

        });

          alert("Selecione pelo menos um funcionário para participar do treinamento.");
          return;
        }

        data.ano = Number(data.ano);
        data.mes = Number(data.mes);
        delete data.participantes;

        if(data.status === 'Agendado'){
          if(!periodEditor) periodEditor = initAnnualPeriodEditor(ov, 'annual', {});

          Object.assign(data, periodEditor.getData());
        }else{
          delete data.dataInicio;

        state.annualTrainingPlan.push({id:uid("plan"), ...data});
        await saveState(); window.closeModal(); render();

            <select name="tipo" id="pgr-tipo-select">${PGR_TIPOS.map(t=>`<option value="${t}">${PGR_TIPO_ICON[t]} ${t}</option>`).join("")}</select>
            <div class="pgr-hint">Preenchido automaticamente pelo perigo escolhido.</div>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label>Severidade (1 a 4)</label>
            <select name="severidade">
              <option value="1">1 - Leve</option>
              <option value="2">2 - Moderada</option>
              <option value="3" selected>3 - Alta</option>
              <option value="4">4 - Crítica</option>
            </select>
          </div>
          <div class="field">
            <label>Probabilidade (1 a 4)</label>
            <select name="probabilidade">
              <option value="1">1 - Rara</option>
              <option value="2">2 - Improvável</option>
              <option value="3" selected>3 - Provável</option>
              <option value="4">4 - Frequente</option>
            </select>
          </div>
        </div>
        <div style="margin-top:-4px;margin-bottom:12px"><button type="button" class="btn secondary" id="pgr-criteria-toggle">❓ Como escolher a severidade e a probabilidade?</button></div>
        <div class="pgr-criteria-box" id="pgr-criteria-box">
          <div class="pgr-criteria-grid">
            <div><h4>Severidade — tamanho da consequência</h4><ol><li><strong>1 · Leve:</strong> efeito pequeno, reversível e sem afastamento.</li><li><strong>2 · Moderada:</strong> lesão ou adoecimento com atendimento e possível afastamento curto.</li><li><strong>3 · Alta:</strong> consequência grave, incapacidade temporária prolongada ou doença ocupacional relevante.</li><li><strong>4 · Crítica:</strong> fatalidade, incapacidade permanente ou várias pessoas gravemente atingidas.</li></ol></div>
            <div><h4>Probabilidade — chance de acontecer</h4><ol><li><strong>1 · Rara:</strong> exposição excepcional e controles confiáveis.</li><li><strong>2 · Improvável:</strong> exposição ocasional; pode ocorrer, mas não é esperado.</li><li><strong>3 · Provável:</strong> exposição frequente ou controles parcialmente eficazes.</li><li><strong>4 · Frequente:</strong> exposição contínua, ocorrência recorrente ou controles ausentes/ineficazes.</li></ol></div>
          </div>
          <div class="pgr-criteria-result"><strong>Cálculo:</strong> Severidade × Probabilidade. Resultado de <strong>1 a 5 = Baixo</strong>, <strong>6 a 11 = Médio</strong> e <strong>12 a 16 = Alto</strong>. A avaliação deve considerar a atividade real, o tempo e a frequência de exposição, o número de pessoas expostas, os controles existentes e os registros de incidentes. Em caso de dúvida, valide com o profissional responsável por SST.</div>
        </div>

        <div class="field">
          <label>🦺 EPIs relacionados ao perigo <span style="font-weight:400;color:var(--ink-dim);">(do catálogo do módulo EPIs)</span></label>
          ${epis.length ? `
            <div id="pgr-epi-tools" style="display:none;margin-bottom:8px;"><input type="search" id="pgr-epi-search" placeholder="Filtrar EPIs..."></div>
            <div class="pgr-epi-list" id="pgr-epi-list" style="display:none;"></div>
            <div class="pgr-hint" id="pgr-epi-count">Selecione um perigo para ver os EPIs relacionados.</div>
            <button type="button" class="pgr-link" id="pgr-epi-toggle" style="display:none;"></button>
            <label class="pgr-save-link" id="pgr-epi-save-wrap" style="display:none;"><input type="checkbox" id="pgr-epi-save"><span id="pgr-epi-save-text"></span></label>`
          : `<div class="pgr-hint warn">⚠️ Nenhum EPI cadastrado. Cadastre em EPIs (NR-6) → Catálogo EPIs para poder relacioná-los aos perigos.</div>`}
        </div>

        <div class="field">
          <label>🛠️ Outras medidas de controle / prevenção</label>
          <textarea name="medidaControle" rows="2" placeholder="Ex: exaustor local, enclausuramento da fonte, rodízio de tarefas...">${empEsc(atual?.medidaControle||'')}</textarea>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn secondary" onclick="window.closeModal()">Cancelar</button>
          <button type="submit" class="btn">${atual?'Salvar Alterações':'Cadastrar Risco'}</button>
        </div>
      </form>
    `, (ov)=>{
      const setorSel = ov.querySelector("#pgr-sector-select");
      const jobSel = ov.querySelector("#pgr-job-select");
      const jobHint = ov.querySelector("#pgr-job-hint");
      const hzSel = ov.querySelector("#pgr-hazard-select");
      const tipoSel = ov.querySelector("#pgr-tipo-select");
      if(atual){ov.querySelector('[name="severidade"]').value=String(atual.severidade||3);ov.querySelector('[name="probabilidade"]').value=String(atual.probabilidade||3)}
      const criteriaBtn=ov.querySelector("#pgr-criteria-toggle"),criteriaBox=ov.querySelector("#pgr-criteria-box");criteriaBtn?.addEventListener("click",()=>{const open=criteriaBox.classList.toggle("open");criteriaBtn.textContent=open?"✖ Fechar explicação":"❓ Como escolher a severidade e a probabilidade?"});

      // ---- Setor -> só os cargos vinculados a ele no cadastro geral ----
      const fillJobs = () => {
        const setor = setorSel.value;
        jobHint.classList.remove("warn"); jobHint.textContent = "";
        if(!setor){ jobSel.innerHTML = '<option value="">Selecione primeiro o setor</option>'; jobSel.disabled = true; return; }
        const map = new Map();
        sectorEmployees(setor).forEach(e => { const c = String(e.cargo||"").trim(); if(c) map.set(c,(map.get(c)||0)+1); });
        const cargos = [...map.entries()].sort((a,b)=>a[0].localeCompare(b[0],"pt-BR"));
        if(!cargos.length){
          jobSel.innerHTML = '<option value="">Nenhum cargo neste setor</option>'; jobSel.disabled = true;
          jobHint.classList.add("warn");
          jobHint.textContent = "⚠️ Este setor ainda não tem cargos vinculados. Cadastre funcionários nele em Geral / Pessoas → Funcionários.";
          return;
        }
        jobSel.disabled = false;
        jobSel.innerHTML = '<option value="">Selecione o cargo / função</option>' + cargos.map(([c,n]) => `<option value="${empEsc(c)}">${empEsc(c)} (${n})</option>`).join("");
        if(atual&&atual.setor===setor)jobSel.value=atual.atividade||'';
        jobHint.textContent = `${cargos.length} cargo${cargos.length===1?"":"s"} vinculado${cargos.length===1?"":"s"} a este setor.`;
      };
      setorSel.addEventListener("change", fillJobs);if(setorSel.value)fillJobs();

      // ---- Perigos cadastrados (agrupados por tipo) ----
      const fillHazards = (selectId="") => {
        const hs = state.pgrHazards.slice().sort((a,b)=>a.nome.localeCompare(b.nome,"pt-BR"));
        if(!hs.length){ hzSel.innerHTML = '<option value="">Nenhum perigo cadastrado — clique em ➕ Novo</option>'; return; }
        const tipos = [...PGR_TIPOS, ...new Set(hs.map(h=>h.tipo).filter(t=>!PGR_TIPOS.includes(t)))];
        hzSel.innerHTML = '<option value="">Selecione o perigo</option>' + tipos.map(t => {
          const g = hs.filter(h=>h.tipo===t);
          return g.length ? `<optgroup label="${empEsc((PGR_TIPO_ICON[t]||"☣️")+" "+t)}">${g.map(h=>`<option value="${empEsc(h.id)}" ${h.id===selectId?"selected":""}>${empEsc(h.nome)}</option>`).join("")}</optgroup>` : "";
        }).join("");
      };
      const syncTipo = () => {
        const h = state.pgrHazards.find(z => z.id === hzSel.value);
        if(h && [...tipoSel.options].some(o => o.value === h.tipo)) tipoSel.value = h.tipo;
      };
      fillHazards(atual?.perigoId||state.pgrHazards.find(h=>normalizeText(h.nome)===normalizeText(atual?.perigo))?.id||"");
      hzSel.addEventListener("change", () => onHazardChange());

      // ---- Cadastro rápido de perigo, sem sair do formulário ----
      const inline = ov.querySelector("#pgr-hazard-inline"), nhName = ov.querySelector("#pgr-nh-name"), nhTipo = ov.querySelector("#pgr-nh-tipo");
      const closeInline = () => { inline.classList.remove("open"); nhName.value = ""; };
      ov.querySelector("#pgr-hazard-add").addEventListener("click", () => { inline.classList.add("open"); nhName.focus(); });
      ov.querySelector("#pgr-nh-cancel").addEventListener("click", closeInline);
      const saveHazard = async () => {
        const nome = nhName.value.trim();
        if(!nome){ nhName.focus(); return; }
        const existente = state.pgrHazards.find(h => normalizeText(h.nome) === normalizeText(nome));
        if(existente){ fillHazards(existente.id); onHazardChange(); closeInline(); return; }
        const h = {id:uid("perigo"), nome, tipo:nhTipo.value};
        state.pgrHazards.push(h);
        await saveState();
        fillHazards(h.id); onHazardChange(); closeInline();
      };
      ov.querySelector("#pgr-nh-save").addEventListener("click", saveHazard);
      nhName.addEventListener("keydown", ev => { if(ev.key === "Enter"){ ev.preventDefault(); saveHazard(); } });

      // ---- EPIs: aparecem os relacionados ao perigo escolhido ----
      const epiList = ov.querySelector("#pgr-epi-list"), epiCount = ov.querySelector("#pgr-epi-count");
      const epiToggle = ov.querySelector("#pgr-epi-toggle"), epiTools = ov.querySelector("#pgr-epi-tools"), epiSearch = ov.querySelector("#pgr-epi-search");
      const saveWrap = ov.querySelector("#pgr-epi-save-wrap"), saveChk = ov.querySelector("#pgr-epi-save"), saveTxt = ov.querySelector("#pgr-epi-save-text");
      let selected = new Set(), showAll = false;
      const currentHazard = () => state.pgrHazards.find(z => z.id === hzSel.value);
      const relatedSet = () => new Set((currentHazard()?.epiIds || []).filter(id => epis.some(i => i.id === id)));
      const sameSet = (a,b) => a.size === b.size && [...a].every(x => b.has(x));
      const filterEpis = () => {
        if(!epiList) return;
        const q = empPlain(epiSearch?.value || "");
        epiList.querySelectorAll(".pgr-epi-opt").forEach(l => { l.style.display = !q || l.dataset.name.includes(q) ? "" : "none"; });
      };
      const paintMeta = () => {
        if(!epiList) return;
        const h = currentHazard(), rel = relatedSet();
        if(!h){
          epiToggle.style.display = "none"; epiTools.style.display = "none"; saveWrap.style.display = "none";
          epiCount.textContent = "Selecione um perigo para ver os EPIs relacionados."; return;
        }
        const n = selected.size;
        if(n) epiCount.textContent = `${n} EPI${n===1?"":"s"} selecionado${n===1?"":"s"}.`;
        else if(!rel.size && !showAll) epiCount.textContent = "Nenhum EPI relacionado a este perigo ainda. Use “Ver todos os EPIs” para escolher.";
        else epiCount.textContent = "Nenhum EPI selecionado.";
        const temOutros = epis.some(i => !rel.has(i.id));
        epiToggle.style.display = temOutros ? "" : "none";
        epiToggle.textContent = showAll ? "Mostrar só os relacionados" : "＋ Ver todos os EPIs";
        epiTools.style.display = showAll && epis.length > 6 ? "" : "none";
        const mudou = !sameSet(selected, rel) && n > 0;
        saveWrap.style.display = mudou ? "" : "none";
        if(mudou) saveTxt.textContent = `💾 Salvar esta seleção como EPIs relacionados ao perigo “${h.nome}”`;
      };
      const paintEpis = () => {
        if(!epiList) return;
        const h = currentHazard(), rel = relatedSet();
        const visible = !h ? [] : (showAll ? epis : epis.filter(i => rel.has(i.id) || selected.has(i.id)));
        epiList.style.display = visible.length ? "" : "none";
        epiList.innerHTML = visible.map(i => `<label class="pgr-epi-opt ${selected.has(i.id)?"on":""}" data-name="${empEsc(empPlain(i.nome))}"><input type="checkbox" value="${empEsc(i.id)}" ${selected.has(i.id)?"checked":""}><span class="ei">${pgrEpiIcon(i.nome)}</span><span><strong>${empEsc(i.nome)}</strong><small>${i.ca?`CA ${empEsc(i.ca)}`:"&nbsp;"}${rel.has(i.id)?' <span class="rel">· ★ do perigo</span>':""}</small></span></label>`).join("");
        filterEpis(); paintMeta();
      };
      const onHazardChange = () => {
        syncTipo();
        showAll = false;
        selected = relatedSet();
        if(saveChk) saveChk.checked = false;
        if(epiSearch) epiSearch.value = "";
        paintEpis();
      };
      epiList?.addEventListener("change", ev => {
        const cb = ev.target.closest("input[type=checkbox]"); if(!cb) return;
        if(cb.checked) selected.add(cb.value); else selected.delete(cb.value);
        cb.closest(".pgr-epi-opt").classList.toggle("on", cb.checked);
        paintMeta();
      });
      epiToggle?.addEventListener("click", () => { showAll = !showAll; paintEpis(); });
      epiSearch?.addEventListener("input", filterEpis);
      if(atual){selected=new Set(Array.isArray(atual.epiIds)?atual.epiIds:[]);tipoSel.value=atual.tipo||tipoSel.value}paintEpis();

      ov.querySelector("#pgr-form").addEventListener("submit", async(e)=>{
        e.preventDefault();
        const fd = Object.fromEntries(new FormData(e.target));
        const hazard = state.pgrHazards.find(z => z.id === hzSel.value);
        if(!hazard){ alert("Selecione um perigo. Se ele não existir, clique em ➕ Novo para cadastrá-lo."); return; }
        if(!jobSel.value){ alert("Selecione o cargo / função do setor."); return; }
        const epiIds = [...selected].filter(id => epis.some(i => i.id === id));
        if(saveChk?.checked) hazard.epiIds = epiIds.slice();
        const registro={
          id:atual?.id||uid("pgr"), setor:fd.setor, atividade:jobSel.value,
          perigo:hazard.nome, perigoId:hazard.id, tipo:fd.tipo,
          severidade:fd.severidade, probabilidade:fd.probabilidade,
          epiIds, medidaControle:String(fd.medidaControle||"").trim()
        };if(atual)Object.assign(atual,registro);else state.pgrRisks.push(registro);
        await saveState(); window.closeModal(); render();
      });
    });
  }

        // Ao cadastrar um processo eleitoral como "Planejada", cria automaticamente

            });
          });
          currentTab = "cipa-acoes";
        }

        await saveState(); window.closeModal(); render();
      });
    });
  }

  function biometricRandomBytes(size=32){const b=new Uint8Array(size);crypto.getRandomValues(b);return b}
  function biometricToBase64Url(buffer){return btoa(String.fromCharCode(...new Uint8Array(buffer))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
  function biometricFromBase64Url(value){const s=String(value||'').replace(/-/g,'+').replace(/_/g,'/');const padded=s+'='.repeat((4-s.length%4)%4);return Uint8Array.from(atob(padded),c=>c.charCodeAt(0))}
  function biometricAvailable(){return !!(window.PublicKeyCredential&&navigator.credentials&&window.isSecureContext)}
  async function registerEmployeeBiometric(name,matricula){
    if(!biometricAvailable()) throw new Error('A biometria exige navegador compatível e acesso por HTTPS ou localhost.');
    const credential=await navigator.credentials.create({publicKey:{challenge:biometricRandomBytes(),rp:{name:'Sistema SST'},user:{id:biometricRandomBytes(),name:`${matricula||'funcionario'}@sst.local`,displayName:name||'Funcionário'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'discouraged'},timeout:60000,attestation:'none'}});
    if(!credential) throw new Error('Cadastro biométrico não concluído.');
    return biometricToBase64Url(credential.rawId);
  }
  async function verifyEmployeeBiometric(employee){
    if(!employee?.biometricCredentialId){alert('Este funcionário ainda não possui biometria cadastrada no Cadastro Geral.');return false}
    if(!biometricAvailable()){alert('A biometria exige navegador compatível e acesso por HTTPS ou localhost.');return false}
    try{
      const assertion=await navigator.credentials.get({publicKey:{challenge:biometricRandomBytes(),allowCredentials:[{type:'public-key',id:biometricFromBase64Url(employee.biometricCredentialId)}],userVerification:'required',timeout:60000}});
      return !!assertion;
    }catch(err){alert('A assinatura biométrica não foi confirmada. A entrega não foi registrada.');return false}
  }

  function nextEmployeeRegistration(){
    const numericRegistrations = (state.employees || []).map(employee => {
      const raw = String(employee.matricula || "").trim();
      return /^\d+$/.test(raw) ? { raw, number: Number(raw) } : null;
    }).filter(item => item && Number.isSafeInteger(item.number));
    const lastNumber = numericRegistrations.reduce((max,item)=>Math.max(max,item.number),0);
    const width = Math.max(6, ...numericRegistrations.map(item=>item.raw.length));
    return String(lastNumber + 1).padStart(width,"0");
  }

            <div style="flex:1;">

        <div class="field"><label>🔐 Biometria para retirada de EPI</label><div class="nr7-banner" style="margin:0;"><div id="employee-biometric-status"><strong>${employee?.biometricCredentialId?`✅ ${employee?.biometricType==='facial'?'Biometria facial':'Biometria digital/do dispositivo'} cadastrada`:'⚠️ Biometria não cadastrada'}</strong></div><div class="muted" style="margin:6px 0 10px;">Escolha o método disponível no aparelho. O sistema não armazena imagem da digital, fotografia ou modelo do rosto.</div><div style="display:flex;gap:8px;flex-wrap:wrap;"><button type="button" class="btn" id="employee-biometric-register">🖐️ Digital / dispositivo</button><button type="button" class="btn" id="employee-facial-register">🙂 Biometria facial</button>${employee?.biometricCredentialId?'<button type="button" class="btn secondary" id="employee-biometric-remove">🗑️ Remover cadastro</button>':''}</div><div class="muted" style="margin-top:8px;">A opção facial utiliza Windows Hello, Face ID ou o reconhecimento facial configurado no dispositivo.</div></div></div>
        <div class="modal-actions">

          <button type="submit" class="btn">${isEdit ? "Salvar Alterações" : "Cadastrar"}</button>
        </div>
      </form>
    `, (ov)=>{
      let employeePhoto = employee?.foto || "";
      let employeeBiometricCredentialId=employee?.biometricCredentialId||"";
      let employeeBiometricType=employee?.biometricType||"device";
      const employeeJobSelect=ov.querySelector('#employee-job-select');
      const employeeSectorSelect=ov.querySelector('#employee-sector-select');
      const employeeSectorLinkInfo=ov.querySelector('#employee-sector-link-info');
      const updateEmployeeSectors=()=>{
        const selectedJob=state.generalJobs.find(job=>normalizeText(job.nome)===normalizeText(employeeJobSelect?.value));
        const linkedSectors=selectedJob ? setoresCadastrados.filter(sector=>Array.isArray(sector.cargoIds)&&sector.cargoIds.includes(selectedJob.id)) : [];
        const previousSector=employeeSectorSelect?.value || (isEdit ? String(employee?.setor||'') : '');
        if(!employeeSectorSelect) return;
        if(!selectedJob){
          employeeSectorSelect.innerHTML='<option value="">Selecione primeiro o cargo</option>';
          employeeSectorLinkInfo.textContent='O setor será carregado conforme o vínculo do cargo.';
          return;
        }
        if(!linkedSectors.length){
          employeeSectorSelect.innerHTML='<option value="">Nenhum setor vinculado a este cargo</option>';
          employeeSectorLinkInfo.textContent='Vincule este cargo a um setor em Cadastro de Setores antes de continuar.';
          return;
        }
        employeeSectorSelect.innerHTML=`<option value="">${linkedSectors.length===1?'Setor vinculado':'Selecione um dos setores vinculados'}</option>${linkedSectors.map(sector=>`<option value="${esc(sector.nome)}">${esc(sector.nome)}</option>`).join('')}`;
        const validPrevious=linkedSectors.some(sector=>normalizeText(sector.nome)===normalizeText(previousSector));
        employeeSectorSelect.value=validPrevious ? linkedSectors.find(sector=>normalizeText(sector.nome)===normalizeText(previousSector)).nome : (linkedSectors.length===1 ? linkedSectors[0].nome : '');
        employeeSectorLinkInfo.textContent=linkedSectors.length===1 ? 'Setor preenchido automaticamente conforme o cargo.' : `${linkedSectors.length} setores vinculados a este cargo. Selecione o setor correto.`;
      };
      employeeJobSelect?.addEventListener('change',updateEmployeeSectors);
      updateEmployeeSectors();
      const biometricStatus=ov.querySelector('#employee-biometric-status');
      const biometricRegister=ov.querySelector('#employee-biometric-register');
      const facialRegister=ov.querySelector('#employee-facial-register');
      const performBiometricRegistration=async(type,button)=>{
        const form=ov.querySelector('#emp-form');
        const nome=String(form.elements.nome.value||'').trim(),matricula=String(form.elements.matricula.value||'').trim();
        if(!nome||!matricula){alert('Informe o nome e a matrícula antes de cadastrar a biometria.');return}
        biometricRegister.disabled=true;facialRegister.disabled=true;const oldText=button.textContent;button.textContent=type==='facial'?'⏳ Aguardando reconhecimento facial...':'⏳ Aguardando biometria...';
        try{employeeBiometricCredentialId=await registerEmployeeBiometric(nome,matricula);employeeBiometricType=type;biometricStatus.innerHTML=`<strong>✅ ${type==='facial'?'Biometria facial':'Biometria digital/do dispositivo'} cadastrada</strong>`;}
        catch(err){alert(err?.message||'Não foi possível cadastrar a biometria.');}
        finally{button.textContent=oldText;biometricRegister.disabled=false;facialRegister.disabled=false}
      };
      biometricRegister?.addEventListener('click',()=>performBiometricRegistration('device',biometricRegister));
      facialRegister?.addEventListener('click',()=>performBiometricRegistration('facial',facialRegister));
      ov.querySelector('#employee-biometric-remove')?.addEventListener('click',()=>{if(confirm('Remover o cadastro biométrico deste funcionário?')){employeeBiometricCredentialId='';employeeBiometricType='';biometricStatus.innerHTML='<strong>⚠️ Biometria não cadastrada</strong>';}});
      const photoInput = ov.querySelector("#employee-photo-file");
      photoInput?.addEventListener("change", ()=>{
        const file=photoInput.files?.[0];

        const reader=new FileReader();

        }
      };

      cameraBtn?.addEventListener("click", async ()=>{
        if(!navigator.mediaDevices?.getUserMedia){
          alert("Este navegador não oferece acesso à câmera. Use um navegador atualizado em HTTPS ou localhost.");
          return;
        }
        try{
          employeeCameraStream = await navigator.mediaDevices.getUserMedia({
            video:{facingMode:"user"},
            audio:false
          });

          const cameraBox = document.createElement("div");
          cameraBox.id = "employee-camera-box";
          cameraBox.style.cssText = "margin-top:12px;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--panel);";
          cameraBox.innerHTML = `
            <div style="font-weight:700;margin-bottom:8px;">📷 Câmera</div>
            <video id="employee-camera-video" autoplay playsinline style="width:100%;max-width:430px;aspect-ratio:4/3;object-fit:cover;border-radius:8px;background:#111;"></video>
            <canvas id="employee-camera-canvas" style="display:none;"></canvas>
            <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;">
              <button class="btn" id="employee-camera-capture" type="button">📸 Capturar foto</button>
              <button class="btn secondary" id="employee-camera-close" type="button">Cancelar</button>
            </div>
          `;
          cameraBtn.parentElement.appendChild(cameraBox);
          cameraBtn.disabled = true;

          const video = cameraBox.querySelector("#employee-camera-video");
          video.srcObject = employeeCameraStream;

          cameraBox.querySelector("#employee-camera-close").addEventListener("click", ()=>{
            stopEmployeeCamera();
            cameraBox.remove();
            cameraBtn.disabled = false;
          });

          cameraBox.querySelector("#employee-camera-capture").addEventListener("click", ()=>{
            if(!video.videoWidth || !video.videoHeight){
              alert("Aguarde a câmera carregar e tente novamente.");
              return;
            }
            const canvas = cameraBox.querySelector("#employee-camera-canvas");
            // Limita o tamanho salvo para não aumentar excessivamente a base local.
            const maxWidth = 640;
            const scale = Math.min(1, maxWidth / video.videoWidth);
            canvas.width = Math.round(video.videoWidth * scale);
            canvas.height = Math.round(video.videoHeight * scale);
            const ctx = canvas.getContext("2d");
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
            employeePhoto = canvas.toDataURL("image/jpeg", 0.82);

            const preview = ov.querySelector("#employee-photo-preview");
            if(preview) preview.innerHTML = `<img class="employee-photo-preview" src="${employeePhoto}" alt="Foto do funcionário">`;

            stopEmployeeCamera();
            cameraBox.innerHTML = `
              <div style="font-weight:700;margin-bottom:8px;">✅ Foto capturada</div>
              <img src="${employeePhoto}" alt="Foto capturada" style="width:100%;max-width:300px;border-radius:8px;display:block;margin-bottom:10px;">
              <div style="display:flex;gap:8px;flex-wrap:wrap;">

              cameraBtn.disabled = false;
            });

              cameraBox.remove();
              cameraBtn.disabled = false;
              cameraBtn.click();
            });
          });
        }catch(err){
          stopEmployeeCamera();
          cameraBtn.disabled = false;
          alert("Não foi possível acessar a câmera. Verifique se o navegador tem permissão para usar a câmera e se o sistema está sendo aberto por HTTPS ou localhost.");
        }

      ov.querySelector('#emp-form [name="matricula"]')?.addEventListener("input", e=>{

        if(error) error.style.display = "none";

      ov.querySelector("#emp-form").addEventListener("submit", async(e)=>{

        );

        if(matriculaDuplicada){
          if(matriculaError) matriculaError.style.display = "block";
          matriculaInput?.setCustomValidity("Esta matrícula já está cadastrada para outro funcionário.");

          matriculaInput?.focus();
          return;
        }
        if(matriculaError) matriculaError.style.display = "none";
        matriculaInput?.setCustomValidity("");

        if(isEdit){
          const idx = state.employees.findIndex(x=>x.id===employeeId);
          if(idx < 0) return;
          state.employees[idx] = { ...state.employees[idx], ...data, foto: employeePhoto, biometricCredentialId:employeeBiometricCredentialId,biometricType:employeeBiometricType };
        } else {
          state.employees.push({id:uid("emp"), ...data, foto: employeePhoto, biometricCredentialId:employeeBiometricCredentialId,biometricType:employeeBiometricType});
        }

        await saveState();
        window.closeModal();
        render();
      });
    });
  }

        <div id="epi-pgr-employee-info" class="nr7-banner" style="margin:0 0 14px;"></div>

        <div class="field"><label>✍️ Forma de registro da entrega</label><select required name="signatureMethod" id="epi-delivery-signature-method"><option value="facial">🙂 Biometria facial</option><option value="digital">🖐️ Biometria digital / dispositivo</option><option value="convencional">📝 Assinatura convencional na ficha impressa</option></select><div id="epi-delivery-signature-hint" class="muted" style="margin-top:6px;"></div></div>
        <div class="field-row"><div class="field"><label>🔢 Quantidade a fornecer</label><input type="number" required name="quantidade" id="epi-delivery-quantity" min="1" step="1" value="1"></div><div class="field"><label>📅 Data da Entrega</label><input type="date" required name="dataEntrega" value="${new Date().toISOString().slice(0,10)}"></div></div>
        <div class="modal-actions">
          <button type="button" class="btn secondary" onclick="window.closeModal()">Cancelar</button>
          <button type="submit" class="btn" id="epi-delivery-submit">Confirmar Entrega</button>
        </div>
      </form>
    `, (ov)=>{
      const employeeSelect=ov.querySelector('#epi-delivery-employee');

      const signatureMethod=ov.querySelector('#epi-delivery-signature-method');
      const signatureHint=ov.querySelector('#epi-delivery-signature-hint');
      let currentEmployeeHasBiometric=false;
      const pgrDataForEmployee=emp=>{
        const risks=(state.pgrRisks||[]).filter(r=>pgrExposedEmployees(r).some(x=>x.id===emp?.id));
        const epiMap=new Map();
        risks.forEach(r=>pgrEpisOfRisk(r).forEach(item=>epiMap.set(item.id,item)));
        return {risks,epis:Array.from(epiMap.values()).sort((a,b)=>String(a.nome||'').localeCompare(String(b.nome||''),'pt-BR'))};
      };
      const updateQuantityLimit=()=>{
        const item=itemById(itemSelect.value);
        const saldo=Number(item?.estoque)||0;
        quantityInput.max=String(saldo);
        if(Number(quantityInput.value)>saldo) quantityInput.value=saldo>0?'1':'0';
        // A ausência de biometria não deve deixar o botão aparentemente sem ação.
        // O envio continua bloqueado pela validação, mas o clique mostra a orientação ao usuário.
        submitButton.disabled=!item||saldo<1;
        if(item&&saldo<1) itemHint.innerHTML+=' <strong style="color:var(--red)">⚠️ Sem estoque disponível.</strong>';
      };
      const showEmployeeInfo=()=>{
        const emp=pgrEmployees.find(e=>e.id===employeeSelect.value);

        const {risks,epis}=pgrDataForEmployee(emp);
        info.innerHTML=emp?`<strong>🛡️ Cadastro PGR confirmado</strong><br><span class="muted">${empEsc(emp.nome)} · Matrícula ${empEsc(emp.matricula||'não informada')} · ${empEsc(emp.cargo||emp.funcao||'Cargo não informado')} · ${empEsc(emp.setor||'Setor não informado')} · ${risks.length} risco${risks.length===1?'':'s'} relacionado${risks.length===1?'':'s'}</span><div style="margin-top:8px;"><span class="status-pill ${currentEmployeeHasBiometric?'ok':'bad'}">${currentEmployeeHasBiometric?'🖐️ Biometria pronta':'⚠️ Biometria não cadastrada'}</span>${currentEmployeeHasBiometric?'':'<div class="muted" style="margin-top:7px;">Cadastre a biometria em <strong>Geral / Pessoas → Funcionários → Editar</strong>. Ao confirmar, o sistema mostrará essa orientação e não registrará a entrega sem assinatura.</div>'}</div>`:'';
        itemSelect.innerHTML=epis.length
          ? epis.map(i=>`<option value="${i.id}">${pgrEpiIcon(i.nome)} ${empEsc(i.nome)} (CA ${empEsc(i.ca||'não informado')}) · Estoque ${Number(i.estoque)||0}</option>`).join('')
          : '<option value="">Nenhum EPI vinculado à função no PGR</option>';
        itemSelect.disabled=!epis.length;
        quantityInput.disabled=!epis.length;
        submitButton.disabled=!epis.length;
        itemHint.innerHTML=epis.length
          ? `✅ ${epis.length} EPI${epis.length===1?'':'s'} exigido${epis.length===1?'':'s'} para <strong>${empEsc(emp?.cargo||emp?.funcao||'esta função')}</strong>, considerando ${risks.length} risco${risks.length===1?'':'s'} do PGR.`
          : `⚠️ Nenhum EPI foi relacionado aos riscos desta função no PGR. Edite o Inventário de Riscos e selecione os EPIs antes de registrar a entrega.`;
        updateQuantityLimit();
      };
      const updateSignatureHint=()=>{
        const emp=pgrEmployees.find(e=>e.id===employeeSelect.value),method=signatureMethod.value;
        if(method==='convencional') signatureHint.innerHTML='📝 A entrega será liberada agora e ficará como <strong>assinatura manual pendente</strong>. Depois, imprima a Ficha do Funcionário para colher a assinatura.';
        else if(method==='facial') signatureHint.innerHTML=emp?.biometricType==='facial'?'✅ Biometria facial cadastrada para este funcionário.':'⚠️ Este funcionário precisa ter a biometria facial cadastrada em Geral / Pessoas → Funcionários → Editar.';
        else signatureHint.innerHTML=emp?.biometricCredentialId&&emp?.biometricType!=='facial'?'✅ Biometria digital/do dispositivo cadastrada.':'⚠️ Este funcionário precisa ter a biometria digital/do dispositivo cadastrada em Geral / Pessoas → Funcionários → Editar.';

      signatureMethod.addEventListener('change',updateSignatureHint);

      updateSignatureHint();
      ov.querySelector("#deliv-form").addEventListener("submit", async(e)=>{

        if(!data.itemId || !allowedEpiIds.has(data.itemId)){
          alert('Selecione um EPI relacionado à função deste funcionário no PGR.');
          return;
        }
        const item = itemById(data.itemId);
        const quantidade=Number(data.quantidade);
        const saldo=Number(item.estoque)||0;
        if(!Number.isInteger(quantidade)||quantidade<1){alert('Informe uma quantidade válida, maior que zero.');return;}
        if(quantidade>saldo){alert(`Estoque insuficiente. Saldo disponível: ${saldo}.`);return;}
        const method=data.signatureMethod;
        if(method==='facial'&&selectedEmployee?.biometricType!=='facial'){alert('A biometria facial ainda não está cadastrada para este funcionário. Cadastre em Geral / Pessoas → Funcionários → Editar ou escolha assinatura convencional.');return;}

        let biometricVerifiedAt='',biometricMethod='Assinatura convencional',signatureStatus='pendente-manual';
        if(method!=='convencional'){
          submitButton.disabled=true;submitButton.textContent=method==='facial'?'🙂 Aguardando reconhecimento facial...':'🖐️ Aguardando biometria digital...';
          const biometricOk=await verifyEmployeeBiometric(selectedEmployee);
          if(!biometricOk){submitButton.disabled=false;submitButton.textContent='Confirmar Entrega';return;}

        await saveState(); window.closeModal(); render();
      });
    });
  }

  function openDeliveryEditModal(deliveryId){

        await saveState();closeModal();render();
      };
    });

  function epiEmployeeSheetHtml(employeeId,forPrint=false){
    const {employee,deliveries}=epiEmployeeSheetData(employeeId);if(!employee)return '<p>Funcionário não encontrado.</p>';
    const totalUnits=deliveries.reduce((sum,d)=>sum+(Number(d.quantidade)||1),0);
    const rows=deliveries.map(d=>{const item=itemById(d.itemId),quantity=Number(d.quantidade)||1;return `<tr><td>${fmtDate(d.dataEntrega)}</td><td>${pgrEpiIcon(item?.nome)} ${empEsc(item?.nome||'EPI removido')}</td><td>${empEsc(item?.ca||'—')}</td><td>${quantity}</td><td>${fmtDate(d.dataValidade||item?.validadeCA)}</td><td>${d.signatureMethod==='convencional'?'✍️ Assinatura convencional<br><small>Pendente na ficha impressa</small>':d.biometricVerifiedAt?`✅ ${d.biometricMethod==='WebAuthn/facial'?'Biometria facial':'Biometria digital'}<br><small>${fmtDateTime(d.biometricVerifiedAt)}</small>`:'⚠️ Sem assinatura registrada'}</td></tr>`;}).join('');

  // Tipos de equipamentos de emergência disponíveis para cadastro. Cada tipo
  // define os rótulos mais adequados para os dois campos de data do

  // (vencimentoCarga/vencimentoHidro) para não quebrar dashboards e relatórios

  const FIRE_EQUIP_TYPES = {

    "Mangueira de Incêndio": { grupo:"Combate a Incêndio", d1:"Vencimento do Teste Hidrostático", d2:"Próxima Inspeção Visual" },

    "Alarme de Incêndio": { grupo:"Detecção e Alarme", d1:"Validade da Bateria/Componentes", d2:"Próxima Manutenção" },
    "Detector de Fumaça": { grupo:"Detecção e Alarme", d1:"Validade da Bateria/Sensor", d2:"Próxima Manutenção" },
    "Iluminação de Emergência": { grupo:"Evacuação e Sinalização", d1:"Validade da Bateria", d2:"Próximo Teste de Autonomia" },

    "Chuveiro / Lava-olhos": { grupo:"Primeiros Socorros / Resposta", d1:"Vencimento/Validade", d2:"Próxima Inspeção" },
    "Kit de Primeiros Socorros": { grupo:"Primeiros Socorros / Resposta", d1:"Validade dos Itens", d2:"Próxima Reposição/Conferência" },
    "Outro Equipamento de Emergência": { grupo:"Outros Equipamentos", d1:"Vencimento/Validade", d2:"Próxima Verificação" }
  };
  const FIRE_GROUP_ICONS = {"Combate a Incêndio":"🧯","Detecção e Alarme":"🚨","Evacuação e Sinalização":"🚪","Primeiros Socorros / Resposta":"⛑️","Outros Equipamentos":"🧰"};
  function fireEquipGroup(eq){ return eq.grupo || FIRE_EQUIP_TYPES[eq.tipo]?.grupo || "Outros Equipamentos"; }

          data.proximaPesagem = addMonths(new Date().toISOString().slice(0,10), data.periodicidadePesagemMeses);
        } else {
          if(data.tipo !== "Extintor") delete data.agenteExtintor;
          delete data.pesoCheio;
          delete data.periodicidadePesagemMeses;
          delete data.proximaPesagem;
        }
        if(current) Object.assign(current,data,{updatedAt:new Date().toISOString()});
        else state.fireEquip.push({id:uid("fire"), ...data});
        await saveState(); window.closeModal(); render();
      });

  }

  function buildCipaVotingReportHtml(election){
    ensureCipaVoteAuth();
    if(!election) return {rows:[]};

    // Eleitores cadastrados na eleição.
    const eligibleRaw = [
      ...(Array.isArray(election.eleitores) ? election.eleitores : []),
      ...(Array.isArray(election.eleitoresAptos) ? election.eleitoresAptos : []),
      ...(Array.isArray(election.voters) ? election.voters : [])
    ];
    const eligibleIds = eligibleRaw.map(x=>typeof x==="object"?(x.employeeId||x.id):x).filter(Boolean);

    // Quem já votou: cobre estruturas novas e antigas do sistema.
    const votedIds=new Set();
    [
      ...(Array.isArray(election.votantesQueVotaram)?election.votantesQueVotaram:[]),
      ...(Array.isArray(election.votedEmployeeIds)?election.votedEmployeeIds:[]),
      ...(Array.isArray(election.votantes)?election.votantes:[])
    ].forEach(x=>{
      const id=typeof x==="object"?(x.employeeId||x.eleitorId||x.id):x;
      if(id) votedIds.add(id);
    });

    // O sistema já possui registros individuais de voto/comparecimento.
    (state.cipaVotes||[]).forEach(v=>{
      if(v && (!v.electionId || v.electionId===election.id)){
        const id=v.employeeId||v.eleitorId||v.voterId;
        if(id) votedIds.add(id);
      }
    });
    (state.cipaRemoteVoting?Object.values(state.cipaRemoteVoting):[]).forEach(v=>{
      if(v?.electionId===election.id && v.voted && v.employeeId) votedIds.add(v.employeeId);
    });
    state.cipaVoteAuth.filter(r=>r.electionId===election.id).forEach(r=>votedIds.add(r.employeeId));

    // Se a versão anterior já computou o voto mas ainda não criou o novo comprovante,
    // cria o código agora, sem associá-lo ao candidato escolhido.
    let changed=false;
    votedIds.forEach(id=>{
      if(!state.cipaVoteAuth.some(r=>r.electionId===election.id && r.employeeId===id)){
        const voter=(state.employees||[]).find(e=>e.id===id);
        if(voter){ createCipaVoteAuth(election,voter); changed=true; }
      }
    });
    if(changed) saveState();

    const ids=Array.from(new Set([...eligibleIds,...votedIds]));
    return {rows:ids.map(id=>{
      const emp=(state.employees||[]).find(e=>e.id===id);
      const auth=state.cipaVoteAuth.find(r=>r.electionId===election.id && r.employeeId===id);
      const voted=votedIds.has(id)||!!auth;
      return {
        nome:emp?.nome||"—",
        matricula:emp?.matricula||"—",
        status:voted?"Votou":"Pendente",
        codigo:voted?(auth?.code||"Código não localizado"):"—",
        data:auth?.createdAt?new Date(auth.createdAt).toLocaleString("pt-BR"):"—"
      };
    })};
  }

  function openCipaVotingReport(election){
    if(!election){ alert("Nenhuma eleição CIPA localizada."); return; }
    const {rows}=buildCipaVotingReportHtml(election);
    openModal(`<h3>📋 Relatório de Votação CIPA</h3>

      const plan = (state.annualTrainingPlan || []).find(x => x.id === e.currentTarget.dataset.statusAnnualPlan);
      if(!plan) return;
      const newStatus = e.currentTarget.value;
      const oldStatus = plan.status || 'Planejado';
      if(newStatus === oldStatus) return;

      if(currentUser?.role === 'Usuario' && oldStatus === 'Realizado') {
        alert('Este treinamento já foi marcado como Realizado e não pode mais ser modificado pelo usuário. Somente Administrador e Master podem alterar este treinamento.');
        render();
        return;
      }
      // Regra especial do Plano Anual: o nível Usuário pode alterar a SITUAÇÃO
      // enquanto o treinamento ainda não estiver Realizado. Ao chegar em Realizado,
      // o registro fica bloqueado para esse nível. Administrador e Master continuam
      // podendo alterar a situação normalmente.
      const podeAlterarSituacao = currentUser?.role === 'Administrador' ||
        currentUser?.role === 'Master' ||
        (currentUser?.role === 'Usuario' && oldStatus !== 'Realizado');
      if(!podeAlterarSituacao) {
        alert('Você não possui permissão para alterar a situação deste treinamento.');
        render();
        return;
      }

      if(newStatus === 'Realizado' && currentUser?.role === 'Usuario') {
        const confirmar = confirm('Ao marcar este treinamento como Realizado, ele ficará bloqueado para novas alterações deste usuário. Somente os níveis Administrador e Master poderão modificar o treinamento depois disso.\n\nDeseja continuar?');
        if(!confirmar) { render(); return; }
      }

      if(newStatus === 'Agendado'){
        openModal(`
          <h3>Período do Treinamento Agendado</h3>
          <div style="font-size:12px;color:var(--ink-dim);margin-bottom:14px;">Defina se o treinamento ocorrerá em um dia, em um período contínuo ou em dias específicos.</div>
          <form id="annual-status-period-form">
            <div class="field">
              <label>Como será o período de realização?</label>
              <select id="annual-status-period-type">
                <option value="dia">Um dia</option>
                <option value="periodo">Período contínuo (mais de um dia)</option>
                <option value="dias">Dias específicos / aleatórios</option>
              </select>
            </div>
            <div id="annual-status-period-editor">
              <div id="annual-status-one-day-box">
                <div class="field"><label>Data do treinamento</label><input type="date" id="annual-status-one-day"></div>
              </div>
              <div id="annual-status-range-box" style="display:none;">
                <div class="field-row">
                  <div class="field"><label>Data inicial</label><input type="date" id="annual-status-range-start"></div>
                  <div class="field"><label>Data final</label><input type="date" id="annual-status-range-end"></div>
                </div>
              </div>
              <div id="annual-status-dates-box" style="display:none;">
                <div class="field"><label>Dias em que o treinamento será realizado</label>
                  <div id="annual-status-specific-dates"></div>
                  <button type="button" class="btn secondary" id="annual-status-add-date" style="margin-top:4px;">+ Adicionar outro dia</button>
                </div>
              </div>
            </div>
            <div class="modal-actions">
              <button type="button" class="btn secondary" onclick="window.closeModal();render();">Cancelar</button>
              <button type="submit" class="btn">Salvar Agendamento</button>
            </div>
          </form>
        `, (ov)=>{
          const initial = {
            ...plan,
            periodoTipo: plan.periodoTipo || (Array.isArray(plan.datasRealizacao) && plan.datasRealizacao.length > 1 ? 'dias' : (plan.dataInicio && plan.dataFim && plan.dataInicio !== plan.dataFim ? 'periodo' : 'dia'))
          };
          const typeEl = ov.querySelector('#annual-status-period-type');
          const oneDayBox = ov.querySelector('#annual-status-one-day-box');
          const rangeBox = ov.querySelector('#annual-status-range-box');
          const datesBox = ov.querySelector('#annual-status-dates-box');
          const oneDayInput = ov.querySelector('#annual-status-one-day');
          const rangeStart = ov.querySelector('#annual-status-range-start');
          const rangeEnd = ov.querySelector('#annual-status-range-end');
          const datesList = ov.querySelector('#annual-status-specific-dates');
          const addBtn = ov.querySelector('#annual-status-add-date');

          typeEl.value = initial.periodoTipo || 'dia';
          let initialDates = getAnnualPlanDates(initial);

          const addRow = (value='')=>{
            const row = document.createElement('div');
            row.style.cssText='display:flex;gap:8px;align-items:center;margin-bottom:7px;';
            row.innerHTML=`<input type="date" class="annual-status-specific-date" value="${value}" style="flex:1;"><button type="button" class="btn secondary annual-status-remove-date" style="width:auto;padding:7px 10px;">Remover</button>`;
            row.querySelector('.annual-status-remove-date').addEventListener('click',()=>{row.remove();sync();});
            datesList.appendChild(row);
          };
          const sync=()=>{
            const t=typeEl.value;
            oneDayBox.style.display=t==='dia'?'block':'none';
            rangeBox.style.display=t==='periodo'?'block':'none';
            datesBox.style.display=t==='dias'?'block':'none';
            oneDayInput.required=t==='dia';
            rangeStart.required=t==='periodo';
            rangeEnd.required=t==='periodo';
            ov.querySelectorAll('.annual-status-specific-date').forEach(i=>i.required=t==='dias');
          };
          if(typeEl.value==='dia'){
            oneDayInput.value=initialDates[0] || initial.dataInicio || '';
          }else if(typeEl.value==='periodo'){
            rangeStart.value=initial.dataInicio || initialDates[0] || '';
            rangeEnd.value=initial.dataFim || initialDates[initialDates.length-1] || '';
          }else{
            (initialDates.length ? initialDates : ['']).forEach(d=>addRow(d));
          }
          typeEl.addEventListener('change',sync);
          addBtn.addEventListener('click',()=>{addRow('');sync();});
          sync();

          ov.querySelector('#annual-status-period-form').addEventListener('submit', async ev=>{
            ev.preventDefault();
            const t=typeEl.value;
            let periodData;
            if(t==='dia'){
              if(!oneDayInput.value){alert('Informe o dia do treinamento.');return;}
              periodData={periodoTipo:'dia',dataInicio:oneDayInput.value,dataFim:oneDayInput.value,datasRealizacao:[oneDayInput.value]};
            }else if(t==='periodo'){
              if(!rangeStart.value || !rangeEnd.value){alert('Informe a data inicial e a data final.');return;}
              if(rangeEnd.value < rangeStart.value){alert('A data final não pode ser anterior à data inicial.');return;}
              periodData={periodoTipo:'periodo',dataInicio:rangeStart.value,dataFim:rangeEnd.value,datasRealizacao:[]};
            }else{
              const vals=[...new Set(Array.from(ov.querySelectorAll('.annual-status-specific-date')).map(i=>i.value).filter(Boolean))].sort();
              if(!vals.length){alert('Informe pelo menos um dia específico.');return;}
              periodData={periodoTipo:'dias',dataInicio:vals[0],dataFim:vals[vals.length-1],datasRealizacao:vals};
            }
            plan.status='Agendado';
            Object.assign(plan,periodData);
            await saveState();
            window.closeModal();
            render();
          });
        });
        return;
      }

      plan.status = newStatus;
      if(newStatus === 'Realizado' && currentUser?.role === 'Usuario') {
        plan.realizadoBloqueado = true;
        plan.realizadoPor = currentUser.id;
        plan.realizadoEm = new Date().toISOString();

      if(newStatus !== 'Agendado'){
        delete plan.dataInicio;
        delete plan.dataFim;
        delete plan.datasRealizacao;
        delete plan.periodoTipo;
      }
      await saveState();
      render();
    }));
