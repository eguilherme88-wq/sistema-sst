        date.disabled=!done; date.required=done;
        if(!done) date.value='';
        const months=Number(row.dataset.periodicity||0);
        const next=done&&date.value&&months>0?addMonths(date.value,months):'';
        row.querySelector('.compliance-next').textContent=done?(next?fmtDate(next):months>0?'Informe a data':'Não se aplica'):'Pendente';
      };
      ov.querySelectorAll('[data-compliance-row]').forEach(row=>{
        row.querySelector('.compliance-done').addEventListener('change',()=>syncRow(row));
        row.querySelector('.compliance-date').addEventListener('change',()=>syncRow(row));
      });
      const employeeFilter=ov.querySelector('#role-employee-filter');
      const applyEmployeeFilter=()=>{
        const selected=employeeFilter?.value||'';
        let visible=0;
        ov.querySelectorAll('[data-compliance-row]').forEach(row=>{
          const show=!selected||row.dataset.employeeId===selected;
          row.style.display=show?'':'none';
          if(show) visible++;
        });
        const empty=ov.querySelector('#role-filter-empty');
        if(empty) empty.style.display=visible?'none':'block';
      };
      employeeFilter?.addEventListener('change',applyEmployeeFilter);
      ov.querySelector('#role-compliance-pdf')?.addEventListener('click',()=>printRoleProceduresPdf(cargo,employeeFilter?.value||''));
      applyEmployeeFilter();
      ov.querySelector('[data-back-role-procedures]')?.addEventListener('click',()=>openRoleProceduresModal(cargo));
      ov.querySelector('#role-compliance-form')?.addEventListener('submit',async e=>{

    const fEpi = root.dataset.hzEpi || "";
    const catalogo = (state.items||[]).slice().sort((a,b)=>String(a.nome||"").localeCompare(String(b.nome||""),"pt-BR"));
    const episDoPerigo = h => (Array.isArray(h.epiIds) ? h.epiIds : []).map(id => catalogo.find(i => i.id === id)).filter(Boolean);
    const all = state.pgrHazards.map(h => ({ h, uso: pgrRisksUsingHazard(h.nome).length, epis: episDoPerigo(h) }));
    const episUsados = catalogo.filter(i => all.some(r => r.epis.some(e => e.id === i.id)));
    const q = empPlain(fSearch);
    let rows = all.filter(r => {
      if(fTipo && r.h.tipo !== fTipo) return false;
      if(fUso === "uso" && !r.uso) return false;
      if(fUso === "livre" && r.uso) return false;
      if(fEpi === "__none__" && r.epis.length) return false;
      if(fEpi && fEpi !== "__none__" && !r.epis.some(e => e.id === fEpi)) return false;
      if(q && !empPlain([r.h.nome, r.h.descricao, r.h.tipo, ...r.epis.map(e=>e.nome)].join(" ")).includes(q)) return false;
      return true;
    });
    const byName = (a,b) => a.h.nome.localeCompare(b.h.nome,"pt-BR");
    if(fSort === "nome-desc") rows.sort((a,b)=>byName(b,a));
    else if(fSort === "tipo") rows.sort((a,b)=>PGR_TIPOS.indexOf(a.h.tipo)-PGR_TIPOS.indexOf(b.h.tipo) || byName(a,b));
    else if(fSort === "uso") rows.sort((a,b)=>b.uso-a.uso || byName(a,b));
    else rows.sort(byName);

    const emUso = all.filter(r=>r.uso).length;
    const semEpi = all.filter(r=>!r.epis.length).length;
    const kpi = (icon, cls, num, label) => `<div class="annual-kpi"><div class="annual-kpi-icon ${cls}">${icon}</div><div><div class="num">${num}</div><div class="label">${label}</div></div></div>`;

    const rowHtml = rows.map(({h, uso, epis}) => {
      const hue = PGR_TIPO_HUE[h.tipo] ?? 210;
      return `<tr>
        <td><div class="sec-name"><span class="sec-ico" style="background:hsla(${hue},70%,50%,.16);border:1px solid hsla(${hue},70%,50%,.38);">${PGR_TIPO_ICON[h.tipo]||"☣️"}</span><div><div>${empEsc(h.nome)}</div>${h.descricao ? `<div class="hz-desc">${empEsc(h.descricao)}</div>` : ""}</div></div></td>
        <td>${pgrTipoChip(h.tipo)}</td>
        <td>${epis.length ? `<div class="pgr-epi-chips">${epis.map(i=>`<span class="pgr-epi" title="${i.ca?`CA ${empEsc(i.ca)}`:"EPI cadastrado"}">${pgrEpiIcon(i.nome)} ${empEsc(i.nome)}</span>`).join("")}</div>` : `<span class="sec-none">🚫 Nenhum EPI relacionado</span>`}</td>
        <td>${uso ? `<span class="sec-count">⚠️ ${uso} risco${uso===1?"":"s"} mapeado${uso===1?"":"s"}</span>` : `<span class="sec-none">💤 Sem uso no inventário</span>`}</td>
        <td>${canEdit ? `<div class="emp-actions">
          <button type="button" class="emp-action hz-edit" data-id="${empEsc(h.id)}" title="Editar perigo" aria-label="Editar perigo ${empEsc(h.nome)}">✏️</button>
          <button type="button" class="emp-action danger hz-del" data-id="${empEsc(h.id)}" title="Remover perigo" aria-label="Remover perigo ${empEsc(h.nome)}">🗑️</button>
        </div>` : ""}</td>
      </tr>`;
    }).join("");

    root.innerHTML = `
      <div class="page-head">
        <div><h2>☣️ Cadastro de Perigos</h2><div class="sub">Catálogo de perigos e agentes nocivos usado ao mapear riscos no Inventário.</div></div>
        ${canNew ? `<button class="btn" id="hz-new">+ Novo Perigo</button>` : ""}
      </div>
      <div class="emp-kpis">
        ${kpi("☣️","red",all.length,"Perigos cadastrados")}
        ${kpi("⚠️","amber",emUso,"Em uso no inventário")}
        ${kpi("💤","purple",all.length-emUso,"Sem uso no inventário")}
        ${kpi("🦺","blue",semEpi,"Sem EPI relacionado")}
      </div>
      <div class="panel annual-filter-panel">
        <div class="panel-head">
          <h3>🔎 Filtros de pesquisa</h3>
          <span class="emp-count">${rows.length} de ${all.length} perigo${all.length===1?"":"s"}${hasFilter ? `<button type="button" class="emp-clear" id="hz-clear">✖ Limpar filtros</button>` : ""}</span>
        </div>
        <div class="emp-filter-row hz-filter-row">
          <div><label for="hz-search">🔍 Pesquisar</label><input id="hz-search" type="search" value="${empEsc(fSearch)}" placeholder="Perigo, descrição ou EPI..."></div>
          <div><label for="hz-tipo">🧭 Tipo de risco</label><select id="hz-tipo"><option value="">Todos os tipos</option>${PGR_TIPOS.map(t=>`<option value="${t}" ${fTipo===t?"selected":""}>${PGR_TIPO_ICON[t]} ${t}</option>`).join("")}</select></div>
          <div><label for="hz-epi">🦺 EPI</label><select id="hz-epi"><option value="">Todos</option><option value="__none__" ${fEpi==="__none__"?"selected":""}>Sem EPI relacionado</option>${episUsados.map(i=>`<option value="${empEsc(i.id)}" ${fEpi===i.id?"selected":""}>${empEsc(i.nome)}</option>`).join("")}</select></div>
          <div><label for="hz-uso">⚠️ Uso</label><select id="hz-uso"><option value="">Todos</option><option value="uso" ${fUso==="uso"?"selected":""}>Em uso no inventário</option><option value="livre" ${fUso==="livre"?"selected":""}>Sem uso</option></select></div>
          <div><label for="hz-sort">↕️ Ordenar por</label><select id="hz-sort">
            <option value="">Nome (A–Z)</option>
            <option value="nome-desc" ${fSort==="nome-desc"?"selected":""}>Nome (Z–A)</option>
            <option value="tipo" ${fSort==="tipo"?"selected":""}>Tipo de risco</option>
            <option value="uso" ${fSort==="uso"?"selected":""}>Mais usados</option>
          </select></div>
        </div>
      </div>
      <div class="panel">
        ${all.length===0 ? `<div class="empty">Nenhum perigo cadastrado.${canNew ? " Use <strong>+ Novo Perigo</strong> para começar." : ""}</div>`
        : rows.length===0 ? `<div class="empty">🔍 Nenhum perigo encontrado com os filtros atuais.</div>`
        : `<div class="emp-table-wrap"><table class="hz-table">
          <thead><tr>
            <th class="c-perigo"><span class="ico">☣️</span>Perigo / Agente</th>
            <th class="c-tipo"><span class="ico">🧭</span>Tipo</th>
            <th class="c-epis"><span class="ico">🦺</span>EPIs relacionados</th>
            <th class="c-uso"><span class="ico">⚠️</span>Uso no inventário</th>
            <th class="c-acoes" style="text-align:right;"><span class="ico">⚙️</span>${canEdit?"Ações":""}</th>
          </tr></thead>
          <tbody>${rowHtml}</tbody>
        </table></div>`}
      </div>`;

    const refresh = () => renderPgrHazards(root);
    root.querySelector("#hz-new")?.addEventListener("click", () => openPgrHazardForm());
    root.querySelector("#hz-search")?.addEventListener("input", ev => {
      root.dataset.hzSearch = ev.target.value;
      const pos = ev.target.selectionStart;
      refresh();
      const input = root.querySelector("#hz-search");
      input?.focus(); input?.setSelectionRange(pos,pos);
    });
    [["#hz-tipo","hzTipo"],["#hz-epi","hzEpi"],["#hz-uso","hzUso"],["#hz-sort","hzSort"]].forEach(([sel,key]) => {
      root.querySelector(sel)?.addEventListener("change", ev => { root.dataset[key] = ev.target.value; refresh(); });
    });
    root.querySelector("#hz-clear")?.addEventListener("click", () => {
      ["hzSearch","hzTipo","hzEpi","hzUso","hzSort"].forEach(k => delete root.dataset[k]);
      refresh();
    });
    root.querySelectorAll(".hz-edit").forEach(b => b.addEventListener("click", ev => openPgrHazardForm(ev.currentTarget.dataset.id)));
    root.querySelectorAll(".hz-del").forEach(b => b.addEventListener("click", async ev => {
      const h = state.pgrHazards.find(z => z.id === ev.currentTarget.dataset.id);
      if(!h) return;
      const n = pgrRisksUsingHazard(h.nome).length;
      if(n){
        alert(`Não é possível remover o perigo "${h.nome}": ele está em ${n} risco${n===1?"":"s"} do Inventário. Remova ou altere esses riscos antes.`);
        return;
      }
      if(!confirm(`Remover o perigo "${h.nome}" do cadastro?`)) return;
      state.pgrHazards = state.pgrHazards.filter(z => z.id !== h.id);
      await saveState(); render();
    }));
  }
  function openPgrHazardForm(id=""){
    ensurePgrHazards();
    const x = state.pgrHazards.find(z => z.id === id) || {};
    const catalogo = (state.items||[]).slice().sort((a,b)=>String(a.nome||"").localeCompare(String(b.nome||""),"pt-BR"));
    const rel = new Set(x.epiIds || []);
    openModal(`<h3>${id?"✏️ Editar":"➕ Novo"} Perigo / Agente Nocivo</h3>
      <form id="pgr-hazard-form">
        <div class="field"><label>Perigo / Agente nocivo *</label><input name="nome" required value="${empEsc(x.nome||"")}" placeholder="Ex.: Ruído contínuo"></div>
        <div class="field"><label>Tipo de risco *</label><select name="tipo" required>${PGR_TIPOS.map(t=>`<option value="${t}" ${(x.tipo||"Físico")===t?"selected":""}>${PGR_TIPO_ICON[t]} ${t}</option>`).join("")}</select></div>
        <div class="field"><label>Descrição / fontes geradoras (opcional)</label><textarea name="descricao" rows="3" placeholder="Ex.: Motores, compressores e máquinas de corte.">${empEsc(x.descricao||"")}</textarea></div>
        <div class="field">
          <label>🦺 EPIs relacionados a este perigo</label>
          ${catalogo.length ? `<div class="pgr-epi-list">${catalogo.map(i=>`<label class="pgr-epi-opt ${rel.has(i.id)?"on":""}"><input type="checkbox" name="epi" value="${empEsc(i.id)}" ${rel.has(i.id)?"checked":""}><span class="ei">${pgrEpiIcon(i.nome)}</span><span><strong>${empEsc(i.nome)}</strong>${i.ca?`<small>CA ${empEsc(i.ca)}</small>`:""}</span></label>`).join("")}</div>
            <div class="pgr-hint">Ao escolher este perigo em um novo risco, estes EPIs já aparecem selecionados.</div>`
          : `<div class="pgr-hint warn">⚠️ Nenhum EPI cadastrado. Cadastre em EPIs (NR-6) → Catálogo EPIs para poder relacioná-los.</div>`}
        </div>
        <div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn">💾 Salvar</button></div>
      </form>`, ov => {
      ov.querySelector(".pgr-epi-list")?.addEventListener("change", ev => ev.target.closest(".pgr-epi-opt")?.classList.toggle("on", ev.target.checked));
      ov.querySelector("form").onsubmit = async e => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const nome = String(fd.get("nome")||"").trim(), tipo = String(fd.get("tipo")||""), descricao = String(fd.get("descricao")||"").trim();
        const epiIds = fd.getAll("epi").map(String);
        if(!nome) return;
        if(state.pgrHazards.some(z => z.id!==id && normalizeText(z.nome)===normalizeText(nome))){ alert("Já existe um perigo com este nome."); return; }
        if(id){
          const h = state.pgrHazards.find(z => z.id === id);
          const antigo = h.nome;
          Object.assign(h, {nome, tipo, descricao, epiIds});
          delete h.imported;
          // Mantém o vínculo com os riscos já mapeados.
          const key = normalizeText(antigo);
          (state.pgrRisks||[]).forEach(r => { if(normalizeText(r.perigo)===key){ r.perigo = nome; r.tipo = tipo; } });
        } else {
          state.pgrHazards.push({id:uid("perigo"), nome, tipo, descricao, epiIds});
        }
        await saveState(); closeModal(); render();
      };
    });
  }

  function renderEpiDash(root){
    if(!Array.isArray(state.stockMovements)) state.stockMovements=[];
    const epiDashSearch=normalizeText(root.dataset.epiDashSearch||"");
    const epiDashStatus=root.dataset.epiDashStatus||"todos";
    const epiDashStart=root.dataset.epiDashStart||"";
    const epiDashEnd=root.dataset.epiDashEnd||"";
    const epiDashRows=state.deliveries.filter(d=>{
      const st=deliveryStatus(d);
      const texto=normalizeText(`${employeeName(d.employeeId)} ${itemById(d.itemId)?.nome||''} ${itemById(d.itemId)?.ca||''}`);
      const okTexto=!epiDashSearch||texto.includes(epiDashSearch);
      const okStatus=epiDashStatus==='todos'||st===epiDashStatus;
      const data=d.dataEntrega||'';
      const okInicio=!epiDashStart||data>=epiDashStart;
      const okFim=!epiDashEnd||data<=epiDashEnd;
      return okTexto&&okStatus&&okInicio&&okFim;
    }).slice().reverse();
    const totalItens = state.items.length;
    const entregasVencidas = state.deliveries.filter(d=>deliveryStatus(d)==="bad").length;
    const estoqueBaixo = state.items.filter(i=>i.estoque <= i.estoqueMinimo).length;
    const caVencidos = state.items.filter(i=>i.validadeCA && new Date(i.validadeCA+'T23:59:59') < new Date()).length;

    root.innerHTML = `
      <div class="page-head">
        <div>
          <h2>⛑️ Módulo EPI · Painel Geral</h2>
          <div class="sub">Gestão de Equipamentos de Proteção Individual e histórico de entregas.</div>
        </div>
      </div>

      <div class="hero">
        <div class="stat-card">
          <div class="num" style="color:var(${entregasVencidas>0?'--red':'--green'})">🕒 ${entregasVencidas}</div>
          <div class="label">Entregas Vencidas</div>
        </div>
        <div class="stat-card">
          <div class="num" style="color:var(${estoqueBaixo>0?'--amber':'--ink'})">📉 ${estoqueBaixo}</div>
          <div class="label">Itens com Estoque Baixo</div>
        </div>
        <div class="stat-card">
          <div class="num">📦 ${totalItens}</div>
          <div class="label">Modelos Cadastrados</div>
        </div>
        <div class="stat-card"><div class="num" style="color:var(${caVencidos?'--red':'--green'})">🛡️ ${caVencidos}</div><div class="label">CAs Vencidos</div></div>
      </div>

      <div class="panel epi-filter">
        <div class="panel-head"><h3>🔎 Filtros de pesquisa</h3><span class="emp-count">${epiDashRows.length} resultado${epiDashRows.length===1?'':'s'}</span></div>
        <div class="epi-dashboard-filter-grid">
          <div class="field"><label>👤 Funcionário, EPI ou CA</label><input id="epi-dash-search" value="${empEsc(root.dataset.epiDashSearch||'')}" placeholder="Digite para pesquisar"></div>
          <div class="field"><label>🚦 Situação</label><select id="epi-dash-status"><option value="todos">Todas</option><option value="ok" ${epiDashStatus==='ok'?'selected':''}>Em dia</option><option value="warn" ${epiDashStatus==='warn'?'selected':''}>Próximo do vencimento</option><option value="bad" ${epiDashStatus==='bad'?'selected':''}>Vencido</option></select></div>
          <div class="field"><label>📅 Entrega inicial</label><input id="epi-dash-start" type="date" value="${epiDashStart}"></div>
          <div class="field"><label>📅 Entrega final</label><input id="epi-dash-end" type="date" value="${epiDashEnd}"></div>
          <button class="btn secondary" id="epi-dash-clear">🧹 Limpar</button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head"><h3>📝 Entregas encontradas</h3></div>
        ${epiDashRows.length===0 ? `<div class="empty">🔍 Nenhuma entrega encontrada com os filtros informados.</div>` : `
        <table>
          <thead><tr><th>👤 Funcionário</th><th>🦺 Item</th><th>🔢 Quantidade</th><th>📅 Entrega</th><th>🛡️ Validade</th><th>🚦 Situação</th></tr></thead>
          <tbody>
            ${epiDashRows.map(d=>{
              const st = deliveryStatus(d);
              return `<tr>
                <td>${employeeName(d.employeeId)}${d.pgrLinked?'<br><span class="status-pill ok">🛡️ Vinculado ao PGR</span>':''}</td>
                <td>${itemById(d.itemId)?.nome || "—"}</td>
                <td><strong>${Number(d.quantidade)||1}</strong></td>
                <td>${fmtDate(d.dataEntrega)}</td>
                <td>${fmtDate(d.dataValidade)}</td>
                <td><span class="status-pill ${st}"><span class="dot"></span>${st==='bad'?'Vencido':st==='warn'?'Próx. Vencimento':'Em dia'}</span></td>
              </tr>`;
            }).join("")}
          </tbody>
        </table>`}
      </div>
    `;
    const update=(key,value)=>{root.dataset[key]=value;renderEpiDash(root)};
    root.querySelector('#epi-dash-search')?.addEventListener('input',e=>update('epiDashSearch',e.target.value));
    root.querySelector('#epi-dash-status')?.addEventListener('change',e=>update('epiDashStatus',e.target.value));
    root.querySelector('#epi-dash-start')?.addEventListener('change',e=>update('epiDashStart',e.target.value));
    root.querySelector('#epi-dash-end')?.addEventListener('change',e=>update('epiDashEnd',e.target.value));
    root.querySelector('#epi-dash-clear')?.addEventListener('click',()=>{root.dataset.epiDashSearch='';root.dataset.epiDashStatus='todos';root.dataset.epiDashStart='';root.dataset.epiDashEnd='';renderEpiDash(root)});
  }

  function renderEpiItems(root){
    const q=normalizeText(root.dataset.epiSearch||"");
    const status=root.dataset.epiStatus||"todos";
    const rows=state.items.filter(i=>{
      const hit=!q||normalizeText(`${i.nome} ${i.ca}`).includes(q);
      const expired=i.validadeCA && new Date(i.validadeCA+'T23:59:59')<new Date();
      const low=Number(i.estoque)<=Number(i.estoqueMinimo);
      return hit&&(status==='todos'||(status==='baixo'&&low)||(status==='vencido'&&expired)||(status==='regular'&&!low&&!expired));
    });
    root.innerHTML = `
      <div class="page-head">
        <div><h2>🦺 Catálogo de EPIs</h2><div class="sub">Cadastro, validade do CA e níveis de estoque.</div></div>
        ${checkPermission("Master") ? `<button class="btn" id="btn-new-item">➕ Novo EPI</button>` : ""}
      </div>
      <div class="panel epi-filter"><div class="epi-filter-grid"><div class="field"><label>🔎 Pesquisar</label><input id="epi-search" placeholder="Nome ou número do CA" value="${empEsc(root.dataset.epiSearch||'')}"></div><div class="field"><label>🏷️ Situação</label><select id="epi-status"><option value="todos">Todos</option><option value="regular" ${status==='regular'?'selected':''}>Regular</option><option value="baixo" ${status==='baixo'?'selected':''}>Estoque baixo</option><option value="vencido" ${status==='vencido'?'selected':''}>CA vencido</option></select></div><button class="btn secondary" id="epi-clear">🧹 Limpar</button></div></div>
      <div class="panel">
        ${rows.length === 0 ? `<div class="empty">🔍 Nenhum EPI encontrado.</div>` : `
        <table>

          <tbody>
            ${rows.map(i=>`
              <tr>
                <td><strong>${pgrEpiIcon(i.nome)} ${empEsc(i.nome)}</strong></td>
                <td><span class="ca-tag">CA ${i.ca}</span></td>
                <td>${i.validadeCA?fmtDate(i.validadeCA):'<span class="status-pill warn">Não informada</span>'}</td>
                <td style="color:${i.estoque<=i.estoqueMinimo?'var(--red)':'inherit'}">${i.estoque}</td>
                <td>${i.estoqueMinimo}</td>
                ${checkPermission("Administrador") ? `<td class="row-actions"><button class="btn secondary" data-edit-item="${i.id}">✏️ Editar</button> <button class="action-link" data-del-item="${i.id}">🗑️ Remover</button></td>` : ''}
              </tr>`).join("")}
          </tbody>
        </table>`}
      </div>
    `;
    root.querySelector('#epi-search')?.addEventListener('input',e=>{root.dataset.epiSearch=e.target.value;renderEpiItems(root)});
    root.querySelector('#epi-status')?.addEventListener('change',e=>{root.dataset.epiStatus=e.target.value;renderEpiItems(root)});
    root.querySelector('#epi-clear')?.addEventListener('click',()=>{root.dataset.epiSearch='';root.dataset.epiStatus='todos';renderEpiItems(root)});
    root.querySelector('#btn-new-item')?.addEventListener('click',()=>openItemModal());
    root.querySelectorAll('[data-edit-item]').forEach(b=>b.addEventListener('click',()=>openItemModal(b.dataset.editItem)));
  }

  function renderEpiStock(root){
    if(!Array.isArray(state.stockMovements)) state.stockMovements=[];
    const q=normalizeText(root.dataset.stockSearch||"");
    const rows=state.items.filter(i=>!q||normalizeText(`${i.nome} ${i.ca}`).includes(q));
    const filteredMovements=state.stockMovements.filter(m=>{
      if(!q)return true;
      const item=itemById(m.itemId);
      return normalizeText(`${item?.nome||'EPI removido'} ${item?.ca||''} ${m.tipo||''} ${m.motivo||''}`).includes(q);
    });
    root.innerHTML=`<div class="page-head"><div><h2>📦 Controle de Estoque de EPIs</h2><div class="sub">Entradas, saídas, ajustes e histórico de movimentações.</div></div>${checkPermission('Master')?'<button class="btn" id="btn-stock-move">🔄 Nova Movimentação</button>':''}</div>

  function ensureGeneralMasterData(){
    if(!Array.isArray(state.generalSectors)) state.generalSectors=[];
    if(!Array.isArray(state.generalJobs)) state.generalJobs=[];
    // Aproveita setores e cargos já existentes nos funcionários.
    (state.employees||[]).forEach(e=>{
      const setor=(e.setor||"").trim(), cargo=(e.cargo||e.funcao||"").trim();
      if(setor && !state.generalSectors.some(x=>normalizeText(x.nome)===normalizeText(setor))) state.generalSectors.push({id:uid("setor"),nome:setor,imported:true});
      if(cargo && !state.generalJobs.some(x=>normalizeText(x.nome)===normalizeText(cargo))) state.generalJobs.push({id:uid("cargo"),nome:cargo,imported:true});
    });
  }
  function sectorEmployees(sectorName){
    const key = normalizeText(sectorName);
    return (state.employees||[]).filter(e => normalizeText(e.setor) === key);
  }

      });

      return { s:x, emps, cargos };

        <td>${cargos.length ? `<div class="sec-cargos">${cargos.map(([c,n]) => `<span class="sec-cargo ${fCargo===c?"match":""}" title="${n ? `${n} colaborador${n===1?"":"es"} neste cargo` : "Cargo vinculado, ainda sem colaborador"}">${empIcon(c, EMP_ROLE_ICONS, "💼")} ${empEsc(c)}<span class="cnt">${n}</span></span>`).join("")}</div>` : `<span class="sec-none">💤 Nenhum cargo vinculado</span>`}</td>

      <div class="emp-kpis">

        </div>
        <div class="emp-filter-row sec-filter-row">

          <div><label for="sec-cargo">💼 Cargo</label><select id="sec-cargo"><option value="">Todos os cargos</option>${cargoOptions.map(c=>`<option value="${empEsc(c)}" ${fCargo===c?"selected":""}>${empEsc(c)}</option>`).join("")}</select></div>
          <div><label for="sec-sit">👥 Colaboradores</label><select id="sec-sit"><option value="">Todos os setores</option><option value="com" ${fSit==="com"?"selected":""}>Com colaboradores</option><option value="sem" ${fSit==="sem"?"selected":""}>Sem colaboradores</option></select></div>
          <div><label for="sec-sort">↕️ Ordenar por</label><select id="sec-sort">
            <option value="">Nome (A–Z)</option>
            <option value="nome-desc" ${fSort==="nome-desc"?"selected":""}>Nome (Z–A)</option>
            <option value="mais" ${fSort==="mais"?"selected":""}>Mais colaboradores</option>
            <option value="menos" ${fSort==="menos"?"selected":""}>Menos colaboradores</option>
          </select></div>
        </div>
      </div>

      <div class="panel">
        ${all.length===0 ? `<div class="empty">Nenhum setor cadastrado. Use <strong>+ Novo Setor</strong> para começar.</div>`
        : rows.length===0 ? `<div class="empty">🔍 Nenhum setor encontrado com os filtros atuais.</div>`
        : `<div class="emp-table-wrap"><table class="sec-table">
          <thead><tr>
            <th class="c-setor"><span class="ico">🏢</span>Setor</th>
            <th class="c-cargos"><span class="ico">💼</span>Cargos no setor</th>
            <th class="c-pessoas"><span class="ico">👥</span>Colaboradores</th>

          </tr></thead>
          <tbody>${rowHtml}</tbody>
        </table></div>`}
      </div>`;

    // ---- eventos (ligados direto nos elementos, sem acumular ouvintes no container) ----
    const refresh = () => renderGeneralSectors(root);
    root.querySelector("#new-sector").onclick = () => openGeneralSectorForm();
    root.querySelector("#sec-search")?.addEventListener("input", ev => {
      root.dataset.secSearch = ev.target.value;
      const pos = ev.target.selectionStart;

      input?.focus(); input?.setSelectionRange(pos,pos);

  function openGeneralSectorForm(id=""){

    const selectedJobIds = new Set(Array.isArray(x.cargoIds) ? x.cargoIds : []);

    sectorEmployees(x.nome||"").forEach(e => {

      if(job) selectedJobIds.add(job.id);

            ${jobs.map(j=>`<label style="display:flex;align-items:center;gap:8px;padding:6px 0;font-weight:500;"><input type="checkbox" name="cargoIds" value="${empEsc(j.id)}" ${selectedJobIds.has(j.id)?"checked":""} style="width:auto;"> ${empIcon(j.nome, EMP_ROLE_ICONS, "💼")} ${empEsc(j.nome)}</label>`).join("")}

        <div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn">💾 Salvar</button></div>
      </form>`, ov => {
      const allBox = ov.querySelector("#sector-jobs-all");
      const jobBoxes = [...ov.querySelectorAll('input[name="cargoIds"]')];
      const syncAllBox = () => { if(allBox){ allBox.checked = !!jobBoxes.length && jobBoxes.every(b=>b.checked); allBox.indeterminate = jobBoxes.some(b=>b.checked) && !jobBoxes.every(b=>b.checked); } };
      syncAllBox();
      allBox?.addEventListener("change",()=>{ jobBoxes.forEach(b=>b.checked=allBox.checked); syncAllBox(); });
      jobBoxes.forEach(b=>b.addEventListener("change",syncAllBox));
      ov.querySelector("form").onsubmit = async e => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const nome = String(formData.get("nome")||"").trim();
        const cargoIds = formData.getAll("cargoIds").map(String).filter(jobId=>state.generalJobs.some(j=>j.id===jobId));
        if(!nome) return;
        if(state.generalSectors.some(z => z.id!==id && normalizeText(z.nome)===normalizeText(nome))){
          alert("Já existe um setor com este nome."); return;
        }
        if(id){

  function ensurePcmsoComplementaryExamCatalog(){

  function normalizeText(v){return String(v||"").trim().toLowerCase();}
  function pgrRisksForFunction(funcao){
    const target=normalizeText(funcao); if(!target) return [];
    const out=[];
    const add=(risk,source="PGR")=>{
      if(!risk) return;
      const text=typeof risk==="string"?risk:(risk.risco||risk.perigo||risk.agente||risk.descricao||risk.fatorRisco||risk.nome||"");
      if(text && !out.some(x=>normalizeText(x.text)===normalizeText(text))) out.push({text,source});
    };
    const scan=(obj,source="PGR")=>{
      if(!obj||typeof obj!=="object") return;
      const fn=normalizeText(obj.funcao||obj.cargo||obj.atividade||obj.funcaoNome);
      if(fn===target || fn.includes(target) || target.includes(fn)){
        ["riscos","risks","perigos","agentes","fatoresRisco","fatoresDeRisco"].forEach(k=>{
          const v=obj[k]; if(Array.isArray(v))v.forEach(x=>add(x,source)); else if(v)add(v,source);
        });
        add(obj.risco,source); add(obj.perigo,source); add(obj.agente,source); add(obj.fatorRisco,source);
      }
      Object.entries(obj).forEach(([k,v])=>{
        if(v&&typeof v==="object" && !["employees","pcmsoFunctionExams","pcmsoComplementaryExamCatalog"].includes(k)){
          if(Array.isArray(v)) v.forEach(x=>scan(x,source)); else scan(v,source);
        }
      });
    };
    // Procura nas estruturas PGR existentes do próprio sistema.
    ["pgr","pgrRisks","pgrRiscos","pgrInventario","pgrInventory","riskInventory","inventarioRiscos"].forEach(k=>{
      if(state[k]) scan(state[k],k);
    });
    return out;
  }

  function ensurePcmsoAnnualReports(){
    if(!Array.isArray(state.pcmsoAnnualReports)) state.pcmsoAnnualReports=[];
  }
  function pcmsoExamDate(ex){
    return ex.dataExame || ex.data || ex.realizadoEm || ex.createdAt?.slice(0,10) || "";
  }
  function pcmsoExamYear(ex){ return Number((pcmsoExamDate(ex)||"").slice(0,4))||0; }
  function pcmsoExamType(ex){ return ex.tipoExame || ex.tipo || ex.exame || ex.tipoASO || "Exame ocupacional"; }
  function pcmsoEmployee(ex){ return (state.employees||[]).find(e=>e.id===(ex.employeeId||ex.funcionarioId))||null; }
  function pcmsoEmployeeGroup(ex){
    const emp=pcmsoEmployee(ex);
    return {
      unidade:ex.unidade||emp?.unidade||emp?.empresa||"Não informado",
      setor:ex.setor||emp?.setor||"Não informado",
      funcao:ex.funcao||emp?.funcao||emp?.cargo||"Não informado"
    };
  }
  function pcmsoAnnualData(year){
    const exams=(state.pcmso||[]).filter(e=>pcmsoExamYear(e)===Number(year));
    const clinical=exams.filter(e=>!e.complementar && !String(pcmsoExamType(e)).toLowerCase().includes("complement"));
    const complementary=exams.filter(e=>e.complementar || String(pcmsoExamType(e)).toLowerCase().includes("complement"));
    const types={};
    complementary.forEach(e=>{const t=pcmsoExamType(e);types[t]=(types[t]||0)+1;});
    const abnormal=complementary.filter(e=>{
      const r=String(e.resultado||e.result||e.situacao||"").toLowerCase();
      return e.anormal===true || r.includes("alter") || r.includes("anormal");
    });
    const abnormalGroups={};
    abnormal.forEach(e=>{
      const g=pcmsoEmployeeGroup(e), key=`${pcmsoExamType(e)}|||${g.unidade}|||${g.setor}|||${g.funcao}`;
      abnormalGroups[key]=(abnormalGroups[key]||0)+1;
    });
    const cats=(state.cipaCATs||[]).filter(c=>Number((c.dataAcidente||"").slice(0,4))===Number(year));
    const occupational=cats.filter(c=>String(c.tipoAcidente||"").toLowerCase().includes("doença") || String(c.descricao||"").toLowerCase().includes("ocupacional"));
    return {exams,clinical,complementary,types,abnormal,abnormalGroups,cats,occupational};
  }

  function pcmsoRecordExams(p){
    const direct=Array.isArray(p.examesSolicitados)?p.examesSolicitados:[...(Array.isArray(p.examesClinicos)?p.examesClinicos:[]),...(Array.isArray(p.examesComplementares)?p.examesComplementares:[])];
    if(direct.length)return [...new Set(direct.filter(Boolean))];
    const emp=(state.employees||[]).find(e=>e.id===p.employeeId),fn=normalizeText(p.funcao||emp?.cargo||emp?.funcao);
    const lines=v=>String(v||"").split(/\n|;|,/).map(x=>x.trim()).filter(Boolean);
    return [...new Set((state.pcmsoFunctionExams||[]).filter(x=>normalizeText(x.funcao)===fn).flatMap(x=>[...lines(x.examesClinicos),...lines(x.examesComplementares)]))];
  }

  function renderFireScheduleTable(list, allowActions=false){
    if(list.length === 0) return `<div class="empty">Nenhum equipamento cadastrado no cronograma.</div>`;
    return `

        <thead><tr><th>🧯 Equipamento</th><th>📍 Localização</th><th>🔁 Periodicidade</th><th>📋 Última inspeção</th><th>📅 Vencimento / Validade</th><th>🔎 Próx. verificação</th><th>🚦 Situação</th>${allowActions?'<th>⚙️ Ações</th>':''}</tr></thead>
        <tbody>
          ${list.map(eq=>{
            const nextDate = getNextInspectionDate(eq);
            const st = inspectionStatus(eq);
            const dleft = daysUntil(nextDate);
            const stLabel = st==="ok" ? `Em ${dleft} dias` : st==="bad" ? `Atrasada (${Math.abs(dleft)}d)` : `Pendente (${dleft}d)`;
            const validitySt = fireStatus(eq);
            const validityDays = Math.min(daysUntil(eq.vencimentoCarga),daysUntil(eq.vencimentoHidro));
            const validityLabel = validitySt==="ok" ? "Em dia" : validitySt==="bad" ? `Vencido ${Math.abs(validityDays)}d` : `${validityDays}d restantes`;
            return `<tr>
              <td><strong>${eq.identificador}</strong><br><span style="font-size:11px;color:var(--ink-dim);">${eq.tipo}${eq.agenteExtintor?' · '+eq.agenteExtintor:''}${eq.categoria?' · '+eq.categoria:''}</span></td>

              <td>A cada ${eq.periodicidadeInspMeses || 1} mês(es)</td>
              <td>${fmtDate(eq.ultimaInspecao)}</td>
              <td>📅 ${fmtDate(eq.vencimentoCarga)}</td>
              <td><strong>🔎 ${fmtDate(nextDate)}</strong><br><small style="color:var(--ink-dim)">Teste/validade: ${fmtDate(eq.vencimentoHidro)}</small></td>
              <td><span class="status-pill ${validitySt}"><span class="dot"></span>${validityLabel}</span><br><small style="color:var(--ink-dim)">Inspeção: ${stLabel}</small></td>
              ${allowActions ? `<td class="row-actions"><button class="btn secondary" style="padding:4px 8px;font-size:11px;" data-quick-insp="${eq.id}">Inspecionar</button></td>` : ''}
            </tr>`;
          }).join("")}
        </tbody>
      </table></div>
    `;

                <td><strong>${eq ? eq.identificador : '—'}</strong><br><small>${eq?eq.tipo:''} · ${eq?fireEquipGroup(eq):'—'}<br>📍 ${eq?.localizacao||'—'}</small></td>
                <td><strong>${insp.tipoChecagem||'Plano de inspeção'}</strong><br><small>${checks.length?`${checks.length} itens · ✅ ${approved} · ⚠️ ${attention} · ❌ ${failed}`:'Registro anterior sem checklist detalhado'}</small></td>
                <td>${insp.inspetor}</td>

              </tr>`;

      </div>
    `;
  }

  function renderFireTableList(list, allowActions=false){

              <td><span class="pgr-tipo" style="background:var(--panel-2)">${FIRE_GROUP_ICONS[fireEquipGroup(eq)]||'📦'} ${fireEquipGroup(eq)}</span></td>

            </tr>`;
          }).join("")}
        </tbody>
      </table></div>
    `;
  }

  // ---- Auxiliares visuais do cadastro de funcionários ----
  const EMP_SECTOR_ICONS = [
    [/produc|usinagem|fabric|industri/, "🏭"], [/manutenc/, "🔧"], [/seguranca|\bsst\b|ambiente/, "🦺"],
    [/almoxarif|estoque/, "📦"], [/comercial|vendas/, "🤝"], [/controlad|financ|contab|fiscal/, "📊"],
    [/\brh\b|recursos humanos|pessoal|\bdp\b/, "🧑‍🤝‍🧑"], [/\bti\b|tecnologia|informatic/, "💻"],
    [/logistic|expedic|transporte/, "🚚"], [/qualidade/, "✅"], [/engenharia|projetos/, "📐"],
    [/compras|suprimentos/, "🛒"], [/administrativ|diretoria|gerencia/, "🗂️"], [/limpeza|servicos gerais/, "🧹"],
    [/saude|medic|enfermag/, "🩺"], [/juridic/, "⚖️"], [/marketing/, "📣"]
  ];
  const EMP_ROLE_ICONS = [
    [/supervis|coordenad|gerente|diretor|lider/, "👔"], [/contador|contab/, "🧮"], [/analista/, "📈"],
    [/almoxarif/, "📦"], [/operador|operac/, "⚙️"], [/vigia/, "👁️"], [/engenheir/, "📐"],
    [/eletricist/, "⚡"], [/mecanic|manutenc/, "🔧"], [/motorista/, "🚚"], [/tecnic/, "🛠️"],
    [/vendedor|comercial/, "🤝"], [/seguranca/, "🦺"], [/enfermeir|medic/, "🩺"], [/soldador/, "🔥"],
    [/auxiliar|assistente/, "🗒️"]
  ];
  function empPlain(v){ return String(v||"").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase(); }
  function empEsc(v){ return String(v ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

  // Retorna a tag <img> da logomarca da empresa (cadastrada em Administração ·
  // Logomarca) para ser usada no cabeçalho de qualquer relatório/PDF do
  // sistema. Retorna string vazia se nenhuma logomarca foi cadastrada.
  function reportLogoImgTag(maxHeight){
    if(!state.companyLogo) return '';
    const h = maxHeight || 84;
    return `<img src="${state.companyLogo}" alt="Logomarca da empresa" style="display:block;max-height:${h}px;max-width:${Math.round(h*3.2)}px;object-fit:contain;margin-bottom:10px;">`;
  }
  function empIcon(text, table, fallback){
    const t = empPlain(text);
    const hit = table.find(([re]) => re.test(t));
    return hit ? hit[1] : fallback;
  }
  function empHue(text){
    let h = 0; const t = empPlain(text);
    for(let i=0;i<t.length;i++) h = (h*31 + t.charCodeAt(i)) % 360;
    return h;
  }
  function empInitials(nome){
    const parts = String(nome||"").trim().split(/\s+/).filter(Boolean);
    if(!parts.length) return "?";
    return (parts[0][0] + (parts.length>1 ? parts[parts.length-1][0] : "")).toUpperCase();
  }
  function empAvatar(e){
    if(e.foto){
      return `<button type="button" class="emp-avatar-btn" data-emp-photo="${empEsc(e.id)}" title="Ampliar foto"><img class="emp-avatar" src="${empEsc(e.foto)}" alt="Foto de ${empEsc(e.nome)}" loading="lazy"></button>`;
    }
    return `<div class="emp-avatar" style="background:hsl(${empHue(e.nome)},42%,42%);" title="Sem foto cadastrada" aria-label="Sem foto">${empEsc(empInitials(e.nome))}</div>`;
  }
  function empTenure(dateStr){
    if(!dateStr) return "";
    const days = -daysUntil(dateStr);
    if(days < 0) return `admissão em ${-days} dia${-days===1?"":"s"}`;
    if(days === 0) return "admitido(a) hoje";
    if(days < 30) return `há ${days} dia${days===1?"":"s"}`;
    if(days < 365){ const m = Math.floor(days/30); return `há ${m} ${m===1?"mês":"meses"}`; }
    const y = Math.floor(days/365), m = Math.floor((days%365)/30);
    return `há ${y} ano${y===1?"":"s"}${m?` e ${m} ${m===1?"mês":"meses"}`:""}`;
  }
  function empWhatsLink(tel){
    const d = String(tel||"").replace(/\D/g,"");
    if(d.length < 10) return null;
    return "https://wa.me/" + (d.startsWith("55") && d.length >= 12 ? d : "55" + d);
  }

  function employeeDossierEvents(emp){
    const out=[]; const add=(module,icon,title,detail,date,status="")=>out.push({module,icon,title,detail:detail||"—",date:date||"",status});
    if(emp.admissao) add("Cadastro Geral","👤","Admissão na empresa",`${emp.cargo||"Função não informada"} · ${emp.setor||"Setor não informado"}`,emp.admissao,"Ativo");
    (state.trainings||[]).filter(x=>x.employeeId===emp.id).forEach(x=>add("Treinamentos","🎓",x.curso||"Treinamento",`${x.cargaHoraria||"—"} · ${x.entidade||"Entidade não informada"}`,x.dataRealizacao,x.dataVencimento?`Válido até ${fmtDate(x.dataVencimento)}`:""));
    (state.annualTrainingPlan||[]).filter(x=>(x.participantIds||x.employeeIds||x.funcionariosIds||[]).includes(emp.id)).forEach(x=>add("Plano Anual","📅",x.curso||x.treinamento||x.titulo||"Treinamento planejado",x.status||"Planejado",x.dataInicio||x.data||x.createdAt?.slice(0,10),x.status||""));
    (state.deliveries||[]).filter(x=>x.employeeId===emp.id).forEach(x=>{const item=(state.items||[]).find(i=>i.id===x.itemId);add("EPIs","⛑️",item?.nome||"Entrega de EPI",item?.ca?`CA ${item.ca}`:"Equipamento entregue",x.dataEntrega,x.dataValidade?`Validade ${fmtDate(x.dataValidade)}`:"");});
    (state.pcmso||[]).filter(x=>x.employeeId===emp.id).forEach(x=>add("PCMSO","🏥",`ASO ${x.tipoExame||"ocupacional"}`,`${x.resultado||"—"} · ${pcmsoRecordExams(x).length} exame(s) realizado(s)`,x.dataRealizacao,x.dataVencimento?`Validade ${fmtDate(x.dataVencimento)}`:""));
    (state.pgrRisks||[]).filter(x=>normalizeText(x.setor)===normalizeText(emp.setor)&&normalizeText(x.atividade)===normalizeText(emp.cargo||emp.funcao)).forEach(x=>{const ri=calcRiskScore(x.severidade,x.probabilidade);add("PGR","⚠️",x.perigo||"Risco ocupacional",`${x.tipo||"—"} · ${x.medidaControle||"Sem medida informada"}`,x.createdAt?.slice(0,10),`${ri.label} (${ri.score})`);});
    (state.pets||[]).filter(x=>x.supervisorId===emp.id||x.vigiaId===emp.id||String(x.trabalhadores||"").toLowerCase().includes(String(emp.nome||"").toLowerCase())).forEach(x=>add("Espaço Confinado","🚧",x.numeroPet||"PET",x.trabalhoExecutar||"Participação em espaço confinado",x.dataEmissao,x.status||""));
    (state.cipaMembers||[]).filter(x=>x.employeeId===emp.id).forEach(x=>add("CIPA","🦺",`${x.funcaoComissao||"Membro"} · ${x.tipo||""}`,`Gestão ${x.gestao||"—"} · ${x.representacao||"—"}`,x.mandatoInicio,x.ativo===false?"Encerrado":"Ativo"));
    (state.cipaActions||[]).filter(x=>x.responsavelId===emp.id).forEach(x=>add("CIPA","🎯",x.descricao||"Ação CIPA",x.origem||"Plano de ação",x.prazo,x.status||""));
    (state.cipaCATs||[]).filter(x=>x.employeeId===emp.id).forEach(x=>add("CIPA / CAT","🩹",x.numeroInterno||"Registro CAT",x.tipoAcidente||x.tipoCat||"Ocorrência registrada",x.dataAcidente,x.status||""));
    (state.tercEmpresas||[]).filter(x=>x.responsavelInternoId===emp.id).forEach(x=>add("Terceiros","🏢",`Responsável por ${x.razaoSocial||"empresa contratada"}`,x.servico||"Serviço contratado",x.dataInicioContrato,x.status||""));
    return out.sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));
  }

  function renderEmployeeDossier(root){
    const employees=(state.employees||[]).slice().sort((a,b)=>String(a.nome||"").localeCompare(String(b.nome||""),"pt-BR"));
    if(!employees.length){root.innerHTML='<div class="empty">Cadastre um funcionário para gerar o dossiê.</div>';return;}
    const employeeId=root.dataset.dossierEmployee||selectedDossierEmployeeId||employees[0].id,emp=employees.find(e=>e.id===employeeId)||employees[0];
    const moduleFilter=root.dataset.dossierModule||"",search=root.dataset.dossierSearch||"",q=normalizeText(search),all=employeeDossierEvents(emp);
    const modules=[...new Set(all.map(x=>x.module))].sort();
    const events=all.filter(x=>(!moduleFilter||x.module===moduleFilter)&&(!q||normalizeText([x.module,x.title,x.detail,x.status].join(" ")).includes(q)));
    const counts={};all.forEach(x=>counts[x.module]=(counts[x.module]||0)+1);
    root.innerHTML=`<div class="page-head"><div><h2>📁 Dossiê do Funcionário</h2><div class="sub">Histórico consolidado dos registros vinculados em todos os módulos do sistema.</div></div></div>
      <div class="panel annual-filter-panel"><div class="panel-head"><h3>🔎 Seleção e filtros</h3><span>${events.length} de ${all.length} registro(s)</span></div><div class="annual-filter-row" style="grid-template-columns:minmax(240px,1.4fr) minmax(220px,1.4fr) minmax(170px,1fr) auto">
        <div><label>👤 Funcionário</label><select id="dossier-employee">${employees.map(e=>`<option value="${e.id}" ${e.id===emp.id?"selected":""}>${empEsc(e.nome)} · ${empEsc(e.matricula||"—")}</option>`).join("")}</select></div>
        <div><label>🔍 Pesquisar no histórico</label><input id="dossier-search" value="${empEsc(search)}" placeholder="Treinamento, exame, EPI, risco..."></div>
        <div><label>🗂️ Módulo</label><select id="dossier-module"><option value="">Todos os módulos</option>${modules.map(m=>`<option ${moduleFilter===m?"selected":""}>${empEsc(m)}</option>`).join("")}</select></div><button type="button" class="btn secondary" id="dossier-clear" title="Limpar funcionário, pesquisa e módulo">🧹 Limpar filtros</button>
      </div></div>
      <div class="panel" style="margin-bottom:14px"><div style="display:flex;align-items:center;gap:14px;padding:16px">${empAvatar(emp)}<div><h3 style="margin:0 0 4px">${empEsc(emp.nome)}</h3><div class="muted">🆔 ${empEsc(emp.matricula||"—")} · 💼 ${empEsc(emp.cargo||"—")} · 🏢 ${empEsc(emp.setor||"—")} · 📅 Admissão ${fmtDate(emp.admissao)}</div></div></div></div>
      <div class="emp-kpis" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))">${Object.entries(counts).map(([m,n])=>`<div class="annual-kpi"><div class="annual-kpi-icon blue">${all.find(x=>x.module===m)?.icon||"📄"}</div><div><div class="num">${n}</div><div class="label">${empEsc(m)}</div></div></div>`).join("")||'<div class="empty">Sem registros vinculados.</div>'}</div>
      <div class="panel"><div class="panel-head"><h3>🕘 Linha do tempo completa</h3></div>${events.length?`<div style="padding:8px 16px">${events.map(x=>`<div style="display:grid;grid-template-columns:90px 42px minmax(0,1fr) auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)"><div class="muted">${x.date?fmtDate(x.date):"Sem data"}</div><div style="font-size:23px">${x.icon}</div><div><strong>${empEsc(x.title)}</strong><div class="muted">${empEsc(x.module)} · ${empEsc(x.detail)}</div></div>${x.status?`<span class="status-pill ok">${empEsc(x.status)}</span>`:""}</div>`).join("")}</div>`:'<div class="empty">Nenhum registro encontrado com os filtros atuais.</div>'}</div>`;
    const refresh=()=>renderEmployeeDossier(root);
    root.querySelector("#dossier-employee")?.addEventListener("change",e=>{selectedDossierEmployeeId=e.currentTarget.value;root.dataset.dossierEmployee=selectedDossierEmployeeId;refresh()});
    root.querySelector("#dossier-module")?.addEventListener("change",e=>{root.dataset.dossierModule=e.currentTarget.value;refresh()});
    root.querySelector("#dossier-search")?.addEventListener("input",e=>{root.dataset.dossierSearch=e.currentTarget.value;const p=e.currentTarget.selectionStart;refresh();const i=root.querySelector("#dossier-search");i?.focus();i?.setSelectionRange(p,p)});
    root.querySelector("#dossier-clear")?.addEventListener("click",e=>{
      e.preventDefault();
      selectedDossierEmployeeId=null;
      delete root.dataset.dossierEmployee;
      delete root.dataset.dossierSearch;
      delete root.dataset.dossierModule;
      refresh();
    });
  }

  function renderEmployees(root){
    const all = state.employees || [];
    const fSearch = (root.dataset.empSearch || "").trim();
    const fSetor  = root.dataset.empSetor || "";
    const fCargo  = root.dataset.empCargo || "";
    const fFoto   = root.dataset.empFoto || "";
    const fSort   = root.dataset.empSort || "";
    const hasFilter = !!(fSearch || fSetor || fCargo || fFoto || fSort);
    const canEdit = checkPermission("Administrador");

    const distinct = (key) => [...new Set(all.map(e => String(e[key]||"").trim()).filter(Boolean))]
      .sort((a,b) => a.localeCompare(b,"pt-BR"));
    const setores = distinct("setor"), cargos = distinct("cargo");

    const q = empPlain(fSearch);
    let list = all.filter(e => {
      if(fSetor && String(e.setor||"").trim() !== fSetor) return false;
      if(fCargo && String(e.cargo||"").trim() !== fCargo) return false;
      if(fFoto === "com" && !e.foto) return false;
      if(fFoto === "sem" && e.foto) return false;
      if(q){
        const blob = empPlain([e.nome,e.matricula,e.cargo,e.setor,e.email,e.telefone,String(e.telefone||"").replace(/\D/g,"")].join(" "));
        if(!blob.includes(q)) return false;
      }
      return true;
    });
    const byName = (a,b) => String(a.nome||"").localeCompare(String(b.nome||""),"pt-BR");
    if(fSort === "nome-asc") list.sort(byName);
    else if(fSort === "nome-desc") list.sort((a,b)=>byName(b,a));
    else if(fSort === "adm-desc") list.sort((a,b)=>String(b.admissao||"").localeCompare(String(a.admissao||"")));
    else if(fSort === "adm-asc") list.sort((a,b)=>String(a.admissao||"9999").localeCompare(String(b.admissao||"9999")));
    else if(fSort === "matricula") list.sort((a,b)=>String(a.matricula||"").localeCompare(String(b.matricula||""),"pt-BR",{numeric:true}));

    const novos = all.filter(e => e.admissao && -daysUntil(e.admissao) >= 0 && -daysUntil(e.admissao) <= 30).length;
    const semFoto = all.filter(e => !e.foto).length;

    const rowsHtml = list.map(e => {
      const setorTxt = String(e.setor||"").trim(), cargoTxt = String(e.cargo||"").trim();
      const hue = empHue(setorTxt);
      const dias = e.admissao ? -daysUntil(e.admissao) : null;
      const wa = empWhatsLink(e.telefone);
      const contact = [
        e.telefone ? (wa ? `<a href="${wa}" target="_blank" rel="noopener" title="Abrir conversa no WhatsApp">📱 ${empEsc(e.telefone)}</a>` : `<span>📱 ${empEsc(e.telefone)}</span>`) : "",
        e.email ? `<a href="mailto:${empEsc(e.email)}" title="Enviar e-mail">✉️ ${empEsc(e.email)}</a>` : ""
      ].filter(Boolean).join("") || `<span class="none">— sem contato</span>`;
      return `
        <tr>
          <td>
            <div class="emp-person">
              ${empAvatar(e)}
              <div><div class="emp-name">${empEsc(e.nome)}</div>
              <div class="emp-sub">🆔 ${empEsc(e.matricula||"—")}</div></div>
            </div>
          </td>
          <td>${cargoTxt ? `<span class="emp-role"><span class="emp-role-ico">${empIcon(cargoTxt, EMP_ROLE_ICONS, "💼")}</span>${empEsc(cargoTxt)}</span>` : "—"}</td>
          <td>${setorTxt ? `<span class="emp-chip" style="background:hsla(${hue},65%,50%,.16);border:1px solid hsla(${hue},65%,50%,.35);">${empIcon(setorTxt, EMP_SECTOR_ICONS, "🏢")} ${empEsc(setorTxt)}</span>` : "—"}</td>
          <td><div class="emp-contact">${contact}</div></td>
          <td class="emp-date">📅 ${fmtDate(e.admissao)}${dias!==null && dias>=0 && dias<=30 ? `<span class="emp-new">NOVO</span>` : ""}${e.admissao ? `<small>${empTenure(e.admissao)}</small>` : ""}</td>
          ${canEdit ? `<td><div class="emp-actions">
            <button type="button" class="emp-action" data-emp-dossier="${empEsc(e.id)}" title="Abrir dossiê do funcionário" aria-label="Dossiê de ${empEsc(e.nome)}">📁</button>
            <button type="button" class="emp-action" data-edit-emp="${empEsc(e.id)}" title="Editar funcionário" aria-label="Editar ${empEsc(e.nome)}">✏️</button>
            <button type="button" class="emp-action danger" data-del-emp="${empEsc(e.id)}" title="Remover funcionário" aria-label="Remover ${empEsc(e.nome)}">🗑️</button>
          </div></td>` : ""}
        </tr>`;
    }).join("");

    const kpi = (icon, cls, num, label) => `<div class="annual-kpi"><div class="annual-kpi-icon ${cls}">${icon}</div><div><div class="num">${num}</div><div class="label">${label}</div></div></div>`;

    root.innerHTML = `
      <div class="page-head">
        <div><h2>👥 Cadastro de Funcionários</h2><div class="sub">Base de colaboradores da empresa.</div></div>
        ${checkPermission("Master") ? `<button class="btn" id="btn-new-emp">+ Novo Colaborador</button>` : ""}
      </div>

      <div class="emp-kpis">
        ${kpi("👥","blue",all.length,"Colaboradores cadastrados")}
        ${kpi("🏢","purple",setores.length,"Setores com pessoas")}
        ${kpi("🆕","green",novos,"Admitidos nos últimos 30 dias")}
        ${kpi("📷","amber",semFoto,"Sem foto cadastrada")}
      </div>

      <div class="panel annual-filter-panel">
        <div class="panel-head">
          <h3>🔎 Filtros de pesquisa</h3>
          <span class="emp-count">${list.length} de ${all.length} colaborador${all.length===1?"":"es"}${hasFilter ? `<button type="button" class="emp-clear" id="emp-clear">✖ Limpar filtros</button>` : ""}</span>
        </div>
        <div class="emp-filter-row">
          <div><label for="emp-search">🔍 Pesquisar</label><input id="emp-search" type="search" value="${empEsc(fSearch)}" placeholder="Nome, matrícula, cargo, e-mail, telefone..."></div>
          <div><label for="emp-setor">🏢 Setor</label><select id="emp-setor"><option value="">Todos os setores</option>${setores.map(x=>`<option value="${empEsc(x)}" ${fSetor===x?"selected":""}>${empEsc(x)}</option>`).join("")}</select></div>
          <div><label for="emp-cargo">💼 Cargo</label><select id="emp-cargo"><option value="">Todos os cargos</option>${cargos.map(x=>`<option value="${empEsc(x)}" ${fCargo===x?"selected":""}>${empEsc(x)}</option>`).join("")}</select></div>
          <div><label for="emp-foto">📷 Foto</label><select id="emp-foto"><option value="">Todos</option><option value="com" ${fFoto==="com"?"selected":""}>Com foto</option><option value="sem" ${fFoto==="sem"?"selected":""}>Sem foto</option></select></div>
          <div><label for="emp-sort">↕️ Ordenar por</label><select id="emp-sort">
            <option value="">Ordem de cadastro</option>
            <option value="nome-asc" ${fSort==="nome-asc"?"selected":""}>Nome (A–Z)</option>
            <option value="nome-desc" ${fSort==="nome-desc"?"selected":""}>Nome (Z–A)</option>
            <option value="matricula" ${fSort==="matricula"?"selected":""}>Matrícula</option>
            <option value="adm-desc" ${fSort==="adm-desc"?"selected":""}>Admissão (mais recentes)</option>
            <option value="adm-asc" ${fSort==="adm-asc"?"selected":""}>Admissão (mais antigas)</option>
          </select></div>
        </div>
      </div>

        ${all.length===0 ? `<div class="empty">Nenhum colaborador cadastrado.</div>`

        : `<div class="emp-table-wrap"><table class="emp-table">
          <thead><tr>
            <th class="c-name"><span class="ico">👤</span>Colaborador</th>
            <th class="c-cargo"><span class="ico">💼</span>Cargo</th>
            <th class="c-setor"><span class="ico">🏢</span>Setor</th>
            <th class="c-contato"><span class="ico">📞</span>Contato</th>
            <th class="c-adm"><span class="ico">📅</span>Admissão</th>
            ${canEdit ? '<th class="c-acoes" style="text-align:right;"><span class="ico">⚙️</span>Ações</th>' : ''}
          </tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table></div>`}
      </div>
    `;

    // ---- filtros (mantêm o foco ao digitar) ----
    const refresh = () => { renderEmployees(root); attachMainListeners(root); };
    root.querySelector("#emp-search")?.addEventListener("input", ev => {
      root.dataset.empSearch = ev.target.value;
      const pos = ev.target.selectionStart;
      refresh();
      const input = root.querySelector("#emp-search");
      input?.focus(); input?.setSelectionRange(pos, pos);
    });
    [["#emp-setor","empSetor"],["#emp-cargo","empCargo"],["#emp-foto","empFoto"],["#emp-sort","empSort"]].forEach(([sel,key]) => {
      root.querySelector(sel)?.addEventListener("change", ev => { root.dataset[key] = ev.target.value; refresh(); });
    });
    root.querySelector("#emp-clear")?.addEventListener("click", () => {
      ["empSearch","empSetor","empCargo","empFoto","empSort"].forEach(k => delete root.dataset[k]);
      refresh();
    });

    // ---- ampliar foto ----
    root.querySelectorAll("[data-emp-photo]").forEach(b => b.addEventListener("click", ev => {
      const emp = all.find(x => x.id === ev.currentTarget.dataset.empPhoto);
      if(!emp?.foto) return;
      openModal(`<div class="emp-photo-zoom">
        <img src="${empEsc(emp.foto)}" alt="Foto de ${empEsc(emp.nome)}">
        <h3>${empEsc(emp.nome)}</h3>
        <div class="emp-sub" style="justify-content:center;">${empIcon(emp.cargo, EMP_ROLE_ICONS, "💼")} ${empEsc(emp.cargo||"—")} · ${empIcon(emp.setor, EMP_SECTOR_ICONS, "🏢")} ${empEsc(emp.setor||"—")}</div>
        <div class="modal-actions"><button type="button" class="btn secondary" onclick="window.closeModal()">Fechar</button></div>
      </div>`);
    }));
  }

  function renderCipaDash(root){
    const membrosAtivos = activeCipaMembers();

    const mandatosCriticos = membrosAtivos.filter(m=>cipaMandateStatus(m)!=="ok").length;
    const acoesPendentes = state.cipaActions.filter(a=>a.status!=="Concluída").length;

    const hoje = new Date().toISOString().slice(0,10);

    const agenda=(state.cipaMeetingCalendar||[]).filter(x=>x.data>=hoje).sort((a,b)=>a.data.localeCompare(b.data));
    const reunioesLegadas = state.cipaMeetings
      .filter(r => r.proximaReuniao && r.proximaReuniao >= hoje)
      .map(r=>({data:r.proximaReuniao,tipo:"Ordinária"}));
    const proxima=[...agenda,...reunioesLegadas].sort((a,b)=>a.data.localeCompare(b.data))[0];

    root.innerHTML = `
      <div class="page-head">
        <div>
          <h2>🦺 Módulo CIPA · Painel Geral</h2>
          <div class="sub">Comissão Interna de Prevenção de Acidentes e de Assédio (NR-5).</div>

        <div class="cipa-kpi"><div class="cipa-kpi-icon">⏳</div><div><div class="num" style="color:var(${mandatosCriticos>0?'--red':'--green'})">${mandatosCriticos}</div><div class="label">Mandatos Vencidos/Vencendo</div></div></div>
        <div class="cipa-kpi"><div class="cipa-kpi-icon">🎯</div><div><div class="num" style="color:var(${acoesAtrasadas>0?'--red':'--amber'})">${acoesPendentes}</div><div class="label">Ações do Plano em Aberto</div></div></div>
        <div class="cipa-kpi"><div class="cipa-kpi-icon">📅</div><div><div class="num cipa-date-kpi">${proxima ? fmtDate(proxima.data) : "—"}</div><div class="label">Próxima Reunião ${proxima?.tipo==="Extraordinária"?"Extraordinária":""}</div></div></div>
      </div>

      <div class="panel" style="margin-bottom:20px;">
        <div class="panel-head"><h3>⚠️ Mandatos que Exigem Atenção</h3><span class="panel-note">Vencidos ou a vencer em 60 dias</span></div>
        ${renderCipaMembersTable(membrosAtivos.filter(m=>cipaMandateStatus(m)!=="ok"))}
      </div>

      <div class="panel">
        <div class="panel-head"><h3>🎯 Plano de Ação · Pendentes ou Atrasados</h3></div>
        <div class="cipa-action-filters">
          <div class="field"><label>Pesquisar</label><input id="cipa-dash-action-search" placeholder="Ação, origem ou responsável..."></div>
          <div class="field"><label>Situação</label><select id="cipa-dash-action-status"><option value="">Todas</option><option value="Pendente">Pendentes</option><option value="Atrasada">Atrasadas</option><option value="Concluída">Concluídas</option></select></div>
          <div class="field"><label>Responsável</label><select id="cipa-dash-action-owner"><option value="">Todos</option>${(state.employees||[]).map(e=>`<option value="${e.id}">${e.nome}</option>`).join("")}</select></div>
        </div>
        <div id="cipa-dash-actions-list">${renderCipaActionsTable(state.cipaActions.filter(a=>a.status!=="Concluída"))}</div>

    const applyFilters=()=>{
      const q=(root.querySelector("#cipa-dash-action-search")?.value||"").trim().toLowerCase();
      const st=root.querySelector("#cipa-dash-action-status")?.value||"";
      const owner=root.querySelector("#cipa-dash-action-owner")?.value||"";
      const list=state.cipaActions.filter(a=>{

        const hay=[a.descricao,a.origem,a.observacoes,employeeName(a.responsavelId)].join(" ").toLowerCase();

      root.querySelector("#cipa-dash-actions-list").innerHTML=renderCipaActionsTable(list);

    root.querySelector("#btn-dash-calendario")?.addEventListener("click",()=>{currentTab="cipa-calendario";renderContent();renderShell();});

  function renderCipaMembros(root){
    // Exibe somente a comissão atual. Considera ativo=true e, quando houver,
    // a gestão mais recente entre os membros ativos.
    const allCipaMembers = Array.isArray(state.cipaMembers) ? state.cipaMembers : [];
    const activeMembersList = allCipaMembers.filter(m => m.ativo !== false);
    const currentGestao = activeMembersList
      .map(m => m.gestao || "")
      .filter(Boolean)
      .sort((a,b)=>String(b).localeCompare(String(a)))[0] || "";
    const currentCipaMembers = activeMembersList.filter(m => !currentGestao || (m.gestao || "") === currentGestao);

    const ativos = currentCipaMembers;
    const historico = historicoCipaMembers();

    // Agrupa o histórico por gestão (mais recente primeiro), preservando as
    // composições de comissões anteriores mesmo após uma nova eleição.
    const gestoes = [];
    historico.forEach(m => {
      const chave = m.gestao || "Sem gestão informada";
      let grupo = gestoes.find(g => g.gestao === chave);
      if(!grupo){ grupo = { gestao: chave, membros: [] }; gestoes.push(grupo); }
      grupo.membros.push(m);
    });
    gestoes.sort((a,b) => b.gestao.localeCompare(a.gestao));

    root.innerHTML = `
      <div class="page-head">
        <div>
          <h2>Membros da Comissão (Titulares e Suplentes)</h2>
          <div class="sub">Composição paritária da CIPA — representantes do empregador e dos empregados.</div>
        </div>
        ${checkPermission("Master") ? `<button class="btn" id="btn-new-cipa-membro">+ Novo Membro</button>` : ""}
      </div>
      <div class="panel">
        <div class="panel-head"><h3>Comissão Atual</h3></div>
        <div style="padding:0 0 2px;font-size:11px;color:var(--ink-dim);padding:10px 18px 0;">Ao encerrar a urna de uma eleição, esta composição é atualizada automaticamente com os candidatos eleitos.</div>
        ${renderCipaMembersTable(ativos, checkPermission("Administrador"))}
      </div>

      ${gestoes.length > 0 ? `
        <div class="panel">
          <div class="panel-head"><h3>Histórico de Comissões Anteriores</h3></div>
          ${gestoes.map(g => `
            <div style="padding:12px 18px 0;font-size:12px;font-weight:600;color:var(--ink-dim);">Gestão ${g.gestao}</div>
            ${renderCipaMembersTable(g.membros, false)}
          `).join("")}
        </div>
      ` : ''}
    `;
  }

  function renderCipaMembersTable(list, allowActions=false){
    if(list.length === 0) return `<div class="empty">Nenhum membro cadastrado neste filtro.</div>`;
    return `
      <table>
        <thead><tr><th>Nome</th><th>Representação</th><th>Tipo</th><th>Função na Comissão</th><th>Mandato</th><th>Situação</th>${allowActions?'<th></th>':''}</tr></thead>
        <tbody>
          ${list.map(m=>{
            const st = cipaMandateStatus(m);
            const dleft = daysUntil(m.mandatoFim);
            const stLabel = st==="ok" ? "Mandato Vigente" : st==="bad" ? `Encerrado há ${Math.abs(dleft)}d` : `Vence em ${dleft}d`;
            return `<tr>
              <td><strong>${employeeName(m.employeeId)}</strong></td>
              <td>${m.representacao}</td>
              <td><span class="ca-tag">${m.tipo}</span></td>
              <td>${m.funcaoComissao}</td>
              <td>${fmtDate(m.mandatoInicio)} — ${fmtDate(m.mandatoFim)}</td>
              <td><span class="status-pill ${st}"><span class="dot"></span>${stLabel}</span></td>
              ${allowActions ? `<td class="row-actions"><button class="action-link" data-del-cipa-membro="${m.id}">Remover</button></td>` : ''}
            </tr>`;
          }).join("")}
        </tbody>
      </table>
    `;
  }


  function renderCipaHistorico(root){
    const allMembers = Array.isArray(state.cipaMembers) ? state.cipaMembers : [];
    const activeMembers = allMembers.filter(m => m.ativo !== false);
    const currentGestao = activeMembers.map(m=>m.gestao||"").filter(Boolean)
      .sort((a,b)=>String(b).localeCompare(String(a)))[0] || "";

    // Histórico = membros inativos ou membros pertencentes a gestões diferentes da atual.
    const historical = allMembers.filter(m =>
      m.ativo === false || (currentGestao && m.gestao && m.gestao !== currentGestao)
    );

    const groups = historical.reduce((acc,m)=>{
      const key = m.gestao || "Gestão não informada";
      (acc[key] ||= []).push(m);
      return acc;
    },{});
    const gestoes = Object.keys(groups).sort((a,b)=>String(b).localeCompare(String(a)));
    const isAdmin = currentUser?.role === "Administrador";

    root.innerHTML = `
      <div class="page-head">
        <div>
          <h2>Histórico de Comissões Anteriores</h2>
          <div class="sub">Consulta das composições anteriores da CIPA. A comissão atual permanece em “Membros da Comissão”.</div>
        </div>
        ${isAdmin && historical.length ? `<button class="btn secondary" id="btn-clear-cipa-history" style="color:var(--red);">🗑️ Limpar Histórico</button>` : ""}
      </div>

      ${!historical.length ? `<div class="panel"><div class="empty">Nenhuma comissão anterior registrada no histórico.</div></div>` :
        gestoes.map(gestao=>`
          <div class="panel">
            <div class="panel-head">
              <h3>Gestão ${gestao}</h3>
              <span style="font-size:11px;color:var(--ink-dim);">${groups[gestao].length} membro${groups[gestao].length===1?"":"s"}</span>
            </div>
            <div style="overflow-x:auto;">
              <table>
                <thead><tr><th>Funcionário</th><th>Representação</th><th>Tipo</th><th>Função na Comissão</th><th>Mandato</th></tr></thead>
                <tbody>
                  ${groups[gestao].map(m=>{
                    const emp=(state.employees||[]).find(e=>e.id===m.employeeId);
                    return `<tr>
                      <td><strong>${emp?.nome || "Funcionário não localizado"}</strong>${emp?.matricula?`<br><span style="font-size:11px;color:var(--ink-dim);">Matrícula: ${emp.matricula}</span>`:""}</td>
                      <td>${m.representacao || "—"}</td>
                      <td>${m.tipo || "—"}</td>
                      <td>${m.funcaoComissao || "—"}</td>
                      <td>${m.mandatoInicio ? fmtDate(m.mandatoInicio) : "—"} até ${m.mandatoFim ? fmtDate(m.mandatoFim) : "—"}</td>
                    </tr>`;
                  }).join("")}
                </tbody>
              </table>
            </div>
          </div>
        `).join("")
      }
    `;

    root.querySelector("#btn-clear-cipa-history")?.addEventListener("click", async ()=>{
      if(currentUser?.role !== "Administrador"){
        alert("Somente o Administrador pode limpar o histórico de comissões anteriores.");
        return;
      }
      if(!confirm("ATENÇÃO: deseja realmente limpar todo o histórico de comissões anteriores da CIPA? A comissão atual não será excluída.")) return;
      const historicalIds = new Set(historical.map(m=>m.id));
      state.cipaMembers = (state.cipaMembers || []).filter(m=>!historicalIds.has(m.id));
      await saveState();
      render();
    });
  }

  // Registra um voto (candidato ou branco) de forma sigilosa na eleição informada.
  // Retorna o código de comprovante gerado, ou null se o funcionário já tiver votado.
  function registerCipaVote(electionId, employeeId, candidate){
    const el = state.cipaElections.find(e => e.id === electionId);
    if(!el) return null;
    ensureElectionVotingFields(el);
    if(el.votantes.some(v => v.employeeId === employeeId)) return null;

    if(candidate){ candidate.votos = (candidate.votos || 0) + 1; }
    else { el.votosBrancos = (el.votosBrancos || 0) + 1; }

    const dataHora = new Date().toISOString();
    const codigo = cipaVerificationCode(`${el.id}|${employeeId}|${dataHora}`);
    el.votantes.push({ employeeId, dataHora, codigo });
    return codigo;
  }

  // Monta o link do terminal de votação remota para um eleitor específico,
  // usando a própria URL em que o sistema está publicado.
  function buildVotoCipaLink(eleicaoId, eleitorId, canal){
    const baseUrl = window.location.href.split("#")[0].split("?")[0];
    return `${baseUrl}?votarCipa=1&eleicaoId=${encodeURIComponent(eleicaoId)}&eleitorId=${encodeURIComponent(eleitorId)}&canal=${encodeURIComponent(canal)}`;
  }

  // Abre o WhatsApp Web/App ou o cliente de e-mail já com a mensagem e o link
  // de votação preenchidos, para o Administrador/Master apenas conferir e enviar.
  function enviarLinkVotacaoCipa(eleicaoId, eleitorId, canal){
    const el = state.cipaElections.find(e=>e.id===eleicaoId);
    const emp = state.employees.find(e=>e.id===eleitorId);
    if(!el || !emp) return;
    if(canal === "whatsapp" && !emp.telefone){ alert(`Cadastre o telefone de ${emp.nome} em Geral/Pessoas antes de enviar por WhatsApp.`); return; }
    if(canal === "email" && !emp.email){ alert(`Cadastre o e-mail de ${emp.nome} em Geral/Pessoas antes de enviar por e-mail.`); return; }

    const link = buildVotoCipaLink(eleicaoId, eleitorId, canal);
    const mensagem = `Olá, ${emp.nome}! A urna da eleição da CIPA (gestão ${el.gestao}) está aberta. Acesse o link abaixo para registrar seu voto com total sigilo:\n\n${link}\n\nApós votar, você receberá a confirmação do seu voto por este mesmo canal.`;

    if(canal === "whatsapp"){
      const digits = emp.telefone.replace(/\D/g,"");
      const waPhone = digits.startsWith("55") ? digits : "55"+digits;
      window.open(`https://wa.me/${waPhone}?text=${encodeURIComponent(mensagem)}`, "_blank");
    } else {
      window.open(`mailto:${emp.email}?subject=${encodeURIComponent("Votação Eletrônica da CIPA — Gestão "+el.gestao)}&body=${encodeURIComponent(mensagem)}`, "_blank");
    }
  }

  // Após o voto remoto ser registrado, tenta abrir automaticamente o mesmo canal
  // (WhatsApp ou e-mail) usado para enviar o link, já com a confirmação do voto
  // preenchida, para que o eleitor receba/envie o comprovante para si mesmo.
  function enviarConfirmacaoVotoCipa(emp, el, codigo, canal){
    const mensagem = `Olá, ${emp.nome}! Confirmamos o recebimento do seu voto na eleição da CIPA (gestão ${el.gestao}), registrado com sigilo. Código de confirmação: ${codigo}. Obrigado por participar!`;
    try{
      if(canal === "whatsapp" && emp.telefone){
        const digits = emp.telefone.replace(/\D/g,"");
        const waPhone = digits.startsWith("55") ? digits : "55"+digits;
        window.open(`https://wa.me/${waPhone}?text=${encodeURIComponent(mensagem)}`, "_blank");
      } else if(canal === "email" && emp.email){
        window.open(`mailto:${emp.email}?subject=${encodeURIComponent("Confirmação do seu voto — CIPA "+el.gestao)}&body=${encodeURIComponent(mensagem)}`, "_blank");
      }
    }catch(err){}
  }

  // Tela pública de votação remota, acessada pelo link enviado por WhatsApp/E-mail
  // (parâmetros ?votarCipa=1&eleicaoId=...&eleitorId=...&canal=...). Não exige login.

  function renderCipaAuthenticatedTerminal(electionId, voterId){
    // Login voto_cipa usa exatamente a mesma tela responsiva utilizada pelos links de WhatsApp/e-mail.
    renderRemoteVoteScreen(electionId, voterId, "login");
  }

  function renderRemoteVoteScreen(eleicaoId, eleitorId, canal){
    stopCipaPoll();
    const app = document.getElementById("app");
    const el = state.cipaElections.find(e=>e.id===eleicaoId);
    const emp = state.employees.find(e=>e.id===eleitorId);

    if(!el || !emp){
      app.innerHTML = `
        <div class="login-overlay"><div class="login-card" style="max-width:420px; text-align:center;">
          <h2>🗳️ Votação Eletrônica da CIPA</h2>
          <div class="empty" style="padding:30px 10px;">⚠️ Link inválido ou eleição não encontrada.</div>
        </div></div>`;
      return;
    }
    ensureElectionVotingFields(el);
    const jaVotou = el.votantes.some(v => v.employeeId === eleitorId);

    if(el.urnaStatus !== "Aberta" || jaVotou){
      app.innerHTML = `
        <div class="login-overlay"><div class="login-card" style="max-width:420px; text-align:center;">
          <h2>🗳️ Votação Eletrônica da CIPA</h2>
          <p>Olá, <strong>${emp.nome}</strong>.</p>
          <div class="empty" style="padding:30px 10px;">
            ${jaVotou ? '✅ Seu voto já foi registrado anteriormente nesta gestão. Obrigado por participar!' : '🔒 A urna eletrônica não está aberta no momento. Aguarde uma nova liberação do Administrador/Master e tente novamente pelo mesmo link.'}
          </div>
        </div></div>`;
      return;
    }

    app.innerHTML = `
      <div class="login-overlay">
        <div class="login-card cipa-vote-card" style="width:min(960px,calc(100vw - 32px));max-width:960px;margin:20px auto;box-sizing:border-box;">
          <h2>🗳️ Votação Eletrônica da CIPA</h2>
          <p>Olá, <strong>${emp.nome}</strong>. Você está votando remotamente na eleição da gestão <strong>${el.gestao}</strong>. Seu voto é sigiloso.</p>
          <div id="urna-container"></div>
        </div>
      </div>
    `;
    const container = document.getElementById("urna-container");
    container.innerHTML = buildUrnaBallotHtml(el);
    wireUrnaBallot(container, el, {
      onConfirm: async (candidate) => {
        const codigo = registerCipaVote(el.id, eleitorId, candidate);
        // Dispara a tentativa de confirmação automática antes do await, para
        // aproveitar o gesto de clique do usuário e reduzir o bloqueio de pop-up.
        enviarConfirmacaoVotoCipa(emp, el, codigo, canal);
        await saveState();
        app.innerHTML = `
          <div class="login-overlay"><div class="login-card" style="max-width:420px; text-align:center;">
            <h2>✅ Voto Confirmado</h2>
            <p>Obrigado, <strong>${emp.nome}</strong>! Seu voto foi registrado com sucesso e de forma sigilosa.</p>

  // Liga o comportamento da cédula eletrônica renderizada por buildUrnaBallotHtml
  // dentro de `container`. opts.onConfirm(candidatoOuNull) é chamado após a
  // confirmação final do eleitor (candidato = null significa voto em branco).
  function wireUrnaBallot(container, el, opts){
    const numDigits = Math.max(1, ...el.candidatos.map(c => String(c.numero).length));
    let buffer = "";
    let isBranco = false;

    const displayEl = container.querySelector("#urna-display");
    const previewEl = container.querySelector("#urna-preview");
    const msgEl = container.querySelector("#urna-msg");
    const hiddenInput = container.querySelector("#urna-hidden-input");

    function updateDisplay(){
      if(isBranco){
        displayEl.textContent = "BRANCO";
        previewEl.textContent = "Voto em branco selecionado. Pressione CONFIRMA (Enter).";
        return;
      }
      // O visor nunca exibe "_" vazio. Sem digitação mostra apenas "*".
      // Durante a digitação continua mascarando o número informado.
      displayEl.textContent = buffer.length ? "*".repeat(buffer.length) : "*";
      previewEl.textContent = buffer.length===numDigits ? "Pressione CONFIRMA (Enter) para registrar o voto." : "Digite o número do seu candidato.";
    }

    function addDigit(d){
      if(isBranco) return;
      if(buffer.length >= numDigits) return;
      buffer += String(d);
      msgEl.textContent = "";
      updateDisplay();
    }
    function corrige(){
      isBranco = false;
      buffer = buffer.slice(0, -1);
      msgEl.textContent = "";
      updateDisplay();
    }
    function setBranco(){
      isBranco = true;
      buffer = "";
      msgEl.textContent = "";
      updateDisplay();
    }

    function confirmar(){
      if(isBranco){
        if(!confirm("Confirmar VOTO EM BRANCO?\n\nEsta ação não poderá ser desfeita.")) return;
        opts.onConfirm(null);
        return;
      }
      if(buffer.length === 0){
        msgEl.textContent = "Digite o número do candidato ou selecione BRANCO.";
        return;
      }
      const cand = el.candidatos.find(c => String(c.numero) === buffer);
      if(!cand){
        msgEl.textContent = "❌ Número inválido. Confira o número do seu candidato e tente novamente.";
        buffer = "";
        isBranco = false;
        updateDisplay();
        return;
      }
      if(!confirm(`Confirmar voto na Chapa ${cand.numero}?\n\nEsta ação não poderá ser desfeita.`)) return;
      opts.onConfirm(cand);
    }

    container.querySelectorAll("[data-key]").forEach(btn => {
      btn.addEventListener("click", () => {
        const k = btn.dataset.key;
        if(k === "corrige") corrige();
        else if(k === "branco") setBranco();
        else addDigit(k);
        hiddenInput.focus();
      });
    });

    container.querySelector("#urna-confirmar").addEventListener("click", confirmar);

    hiddenInput.addEventListener("keydown", (e) => {
      if(e.key >= "0" && e.key <= "9"){ addDigit(e.key); e.preventDefault(); }
      else if(e.key === "Backspace"){ corrige(); e.preventDefault(); }
      else if(e.key === "Enter"){ confirmar(); e.preventDefault(); }
      else if(e.key.toLowerCase() === "b"){ setBranco(); e.preventDefault(); }
    });

    updateDisplay();
    setTimeout(() => hiddenInput.focus(), 60);
  }

  // Retorna a eleição com urna aberta na qual o usuário logado (via employeeId
  // vinculado à sua conta) ainda precisa votar, ou null se não houver pendência.
  function getPendingSelfVoteElection(){
    if(!currentUser || !currentUser.employeeId) return null;
    (state.cipaElections || []).forEach(ensureElectionVotingFields);
    const el = state.cipaElections.find(e => e.urnaStatus === "Aberta");
    if(!el || el.candidatos.length === 0) return null;
    if(el.votantes.some(v => v.employeeId === currentUser.employeeId)) return null;
    if(sessionStorage.getItem("cipa-skip-" + el.id + "-" + currentUser.id)) return null;

  // próprio assim que acessam o sistema, enquanto houver urna aberta pendente.

    stopCipaPoll();

  function renderVotoCipaTerminal(){
    const app = document.getElementById("app");
    (state.cipaElections || []).forEach(ensureElectionVotingFields);
    const el = state.cipaElections.find(e => e.urnaStatus === "Aberta" && e.votoPendente);

    app.innerHTML = `

      const container = document.getElementById("urna-container");
      container.innerHTML = buildUrnaBallotHtml(el);
      wireUrnaBallot(container, el, {
        onConfirm: async (candidate) => {

  // Admin/Master libera a urna no Terminal de Votação CIPA para um funcionário
  // específico que não possui usuário próprio cadastrado no sistema.
  function openLiberarUrnaTerminalModal(electionId){
    const el = state.cipaElections.find(e=>e.id===electionId);

    ensureElectionVotingFields(el);
    if(el.votoPendente){ alert("Já existe uma votação liberada aguardando conclusão no terminal. Cancele-a ou aguarde a conclusão antes de liberar outra."); return; }

    const jaVotaramIds = new Set(el.votantes.map(v=>v.employeeId));
    const semUsuario = employeesWithoutUser().filter(e=>!jaVotaramIds.has(e.id));
    if(semUsuario.length===0){ alert("Não há funcionários elegíveis sem usuário cadastrado no sistema para votar pelo terminal."); return; }

    openModal(`
